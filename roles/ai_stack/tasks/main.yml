---
# Role ai_stack (docs/CONTRACTS.md §12.10): the ai-box compose project `ai`.
# Order: checks (incl. the memory budget) -> layout and the Open WebUI secret -> broker image (built only
# when its source changed) -> broker config (validated by the image's own --check) -> Tika config ->
# networks (the pinned `ai` network, role-owned; read-only checks for `extract`) ->
# compose file -> boot helper script -> [stack lock] up --wait [unlock] -> heal missing tailnet bindings
# (the helper, under the same lock) -> assert the bindings -> boot helper unit -> model -> extraction checks
# (read-only: OCR through Tika, Open WebUI's effective document settings).
# A re-run reports changed=0: the build is gated on a source hash, the secret is created once, and
# community.docker.docker_compose_v2 (state present) only acts on a real difference.

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Stack directory (root only)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ homelab_root }}"
    - "{{ homelab_stacks_dir }}"
    - "{{ ai_stack_dir }}"
    - "{{ ai_stack_config_dir }}"

# Open WebUI signs its sessions with WEBUI_SECRET_KEY. Generated once on the host, never in the repo or
# the vault, never printed: .env (root 0600, docs/CONTRACTS.md §2) holds only this key. O_EXCL plus
# `creates` means an existing key is never replaced. Losing the file only signs everyone out.
- name: Open WebUI secret key is generated once (.env, root only)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, secrets, sys
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        os.write(fd, ("WEBUI_SECRET_KEY=" + secrets.token_hex(32) + "\n").encode())
        os.close(fd)
      - "{{ ai_stack_dir }}/.env"
    creates: "{{ ai_stack_dir }}/.env"
  register: ai_stack_secret_created

# Owner and mode only, never content. Skipped in a check run that would have created the file.
- name: Open WebUI secret key file stays root 0600
  ansible.builtin.file:
    path: "{{ ai_stack_dir }}/.env"
    state: file
    owner: root
    group: root
    mode: "0600"
  when: not (ansible_check_mode and ai_stack_secret_created is changed)

- name: Broker image (gpu-broker)
  ansible.builtin.import_tasks: broker_image.yml

# Validated with the image itself (`python -m gpu_broker --check`): unknown keys, bad URLs or a malformed
# alias fail here, before the running broker is touched. root inside a throwaway container with no
# network, only so it can read Ansible's 0600 temp file.
- name: Broker config
  ansible.builtin.copy:
    content: "{{ ai_stack_broker_config_content }}"
    dest: "{{ ai_stack_broker_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --user 0:0
      --mount type=bind,source=%s,target=/etc/gpu-broker/config.json,readonly
      {{ local_images.gpu_broker }} --check

# Tika's server config (OCR for images and scanned PDFs, §12.18b). Its sha256 is a label on the tika
# container, so a change recreates it in the same `compose up`.
- name: Tika config
  ansible.builtin.copy:
    content: "{{ ai_stack_tika_config_content }}"
    dest: "{{ ai_stack_tika_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: python3 -c 'import sys, xml.etree.ElementTree as e; e.parse(sys.argv[1])' %s

- name: Networks (the pinned `ai` network; checks for `extract`)
  ansible.builtin.import_tasks: networks.yml

# §12.23: the broker's pinned address, for the roles that narrow their egress filter to it. As a host fact
# too, so a later play can read hostvars[<ai-box>].ai_stack_broker_ip.
- name: Export the broker's pinned address for other roles
  ansible.builtin.set_fact:
    ai_stack_broker_ip: "{{ ai_stack_broker_ip }}"
    cacheable: true

- name: Skills view (§12.19; the local directory open-webui binds, and its systemd bind mount)
  ansible.builtin.import_tasks: skills.yml

# Before the Compose definition and compose up: open-webui binds each model folder read-only (§12.30, R16-1).
- name: Pre-seeded Hugging Face rerankers (root's host folder, bound read-only into open-webui)
  ansible.builtin.import_tasks: hf_models.yml

- name: Compose definition
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ ai_stack_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
    validate: docker compose --project-directory {{ ai_stack_dir }} -f %s config --quiet

# Every compose call of this role names compose.yaml alone (-f / files:), so an override file is never
# merged. One lying in the stack dir is still refused: someone put it there expecting it to apply (R13-1).
- name: Stack | look for Compose override files in the stack dir
  ansible.builtin.find:
    paths: "{{ ai_stack_dir }}"
    patterns: ["compose.override.yml", "compose.override.yaml", "docker-compose.override.yml",
               "docker-compose.override.yaml", "docker-compose.yml", "docker-compose.yaml", "compose.yml"]
    file_type: any
    hidden: true
  register: ai_stack_compose_overrides
  check_mode: false

- name: Stack | no other Compose file in the stack dir
  ansible.builtin.assert:
    that:
      - ai_stack_compose_overrides.files | length == 0
    fail_msg: >-
      {{ ai_stack_compose_overrides.files | map(attribute='path') | join(', ') }} in {{ ai_stack_dir }}: this role
      runs compose.yaml alone and never merges another file. Remove it (its settings would not apply, and it
      could undo OLLAMA_NO_CLOUD or the pinned addresses if someone ran `docker compose up` there by hand).
    quiet: true

- name: Boot helper (script and unit; the playbook's heal step uses the same script)
  ansible.builtin.import_tasks: boot_helper.yml

- name: Stack up, bindings healed, under the stack lock
  ansible.builtin.import_tasks: stack.yml

- name: Models
  ansible.builtin.import_tasks: models.yml

- name: Skills are read-only inside open-webui (its own mount table)
  ansible.builtin.import_tasks: verify_skills.yml

- name: Document extraction works (Tika OCR, Open WebUI's effective settings)
  ansible.builtin.import_tasks: verify_extraction.yml

- name: Document search settings (report; assert once ai_stack_verify_search_settings)
  ansible.builtin.import_tasks: verify_search.yml

- name: Broker management is locked down (/api/push via the published port is 403)
  ansible.builtin.import_tasks: verify_broker.yml
