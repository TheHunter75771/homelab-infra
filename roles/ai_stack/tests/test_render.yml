---
# Role ai_stack, rendered on the control node into a temp dir (no Docker, no root, no real host):
#   1. compose.yaml: four services, tailnet-only publishes, labels, limits, Open WebUI settings, and tika
#      (internal network only, hardened, its config mounted read-only); tika-config.xml; the memory budget.
#   2. gpu-broker.json for every model combination, each validated by the broker's own `--check`.
#   3. the boot helper script against fake `ip` and `docker` commands (tests/boot_case.yml, one per case).
# Needs the broker's dev venv (apps/gpu-broker/README.md, "Run"); override with -e ai_stack_test_python=...
#   .venv/bin/ansible-playbook -i localhost, -c local roles/ai_stack/tests/test_render.yml </dev/null 2>&1 | cat
- name: Role ai_stack renders a valid stack, broker config and boot helper
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../inventory/group_vars/all/main.yml
    - ../../../inventory/group_vars/all/versions.yml
    - ../defaults/main.yml
    - ../vars/main.yml
  vars:
    # Documentation-only addresses: 100.64.0.0/10 is the tailnet range, 192.0.2.0/24 is TEST-NET-1.
    tailnet_ip: 100.64.0.10
    gaming_pc_tailnet_ip: 100.64.0.20
    lan_ip: 192.0.2.10
    ai_stack_test_role: "{{ playbook_dir | dirname }}"
    ai_stack_test_repo: "{{ playbook_dir }}/../../.."
    ai_stack_test_broker_dir: "{{ ai_stack_test_repo }}/apps/gpu-broker"
    ai_stack_test_python: "{{ ai_stack_test_broker_dir }}/.venv/bin/python"
  tasks:
    - name: Make a scratch directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .ai-stack
      register: ai_stack_test_tmp

    - name: The broker's dev venv exists (it validates the configs)
      ansible.builtin.stat:
        path: "{{ ai_stack_test_python }}"
      register: ai_stack_test_python_stat

    - name: Stop if there is no broker venv
      ansible.builtin.assert:
        that: ai_stack_test_python_stat.stat.exists
        fail_msg: >-
          {{ ai_stack_test_python }} is missing. Create it as apps/gpu-broker/README.md says
          (python3 -m venv .venv && .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.lock).
        quiet: true

    - name: Stack lock defaults (root-only path; the holder outlives lock wait + compose wait)
      ansible.builtin.assert:
        that:
          - ai_stack_lock_file == '/run/homelab-ai-stack.lock'
          - not ai_stack_lock_file.startswith('/run/lock/')
          - ai_stack_lock_hold_max | int == 1020
          - ai_stack_lock_hold_max | int > ai_stack_lock_wait | int + ai_stack_compose_wait_timeout | int
        fail_msg: "{{ ai_stack_lock_file }} {{ ai_stack_lock_hold_max }}"
        quiet: true

    # ---- 1. compose.yaml ------------------------------------------------------------------------------
    - name: Render compose.yaml (both models set, sign-ups on by default)
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/compose.yaml.j2"
        dest: "{{ ai_stack_test_tmp.path }}/compose.yaml"
        mode: "0644"
      vars:
        ai_cpu_model: qwen3:1.7b
        ai_gpu_model: qwen3:8b
        ai_embed_model: nomic-embed-text:v1.5
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"

    - name: Read compose.yaml back
      ansible.builtin.slurp:
        src: "{{ ai_stack_test_tmp.path }}/compose.yaml"
      register: ai_stack_test_compose_raw

    - name: Compose file has the declared shape
      vars:
        ai_cpu_model: qwen3:1.7b
        ai_gpu_model: qwen3:8b
        ai_embed_model: nomic-embed-text:v1.5
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"
        compose: "{{ ai_stack_test_compose_raw.content | b64decode | from_yaml }}"
        svc: "{{ compose.services }}"
        all_ports: "{{ svc.values() | map(attribute='ports') | select('defined') | flatten }}"
        webui_env: "{{ svc['open-webui'].environment }}"
        all_volume_sources: >-
          {{ svc.values() | map(attribute='volumes') | select('defined') | flatten
             | map('regex_replace', '^([^:]*):.*$', '\\1') | map('string') | list
             + svc.values() | map(attribute='volumes') | select('defined') | flatten
             | select('mapping') | map(attribute='source') | list }}
      ansible.builtin.assert:
        that:
          - compose.name == 'ai'
          - svc.keys() | sort == ['gpu-broker', 'ollama-cpu', 'open-webui', 'tika']
          # Every service: restart policy, watch label, memory limit, private network.
          - svc.values() | map(attribute='restart') | unique | list == ['unless-stopped']
          - svc['ollama-cpu'].labels['homelab.watch'] == 'true'
          - svc['gpu-broker'].labels['homelab.watch'] == 'true'
          - svc['open-webui'].labels['homelab.watch'] == 'true'
          - svc['tika'].labels['homelab.watch'] == 'true'
          # §12.23: every service on `ai` has its pinned address (the broker tells open-webui apart by it).
          - >-
            svc['ollama-cpu'].networks == {'ai': {'ipv4_address': '172.20.0.2'}}
          - >-
            svc['gpu-broker'].networks == {'ai': {'ipv4_address': '172.20.0.3'}}
          - svc['open-webui'].networks.ai.ipv4_address == '172.20.0.4'
          - compose['x-common'].networks is not defined
          # open-webui: `ai` (its publish and egress, gateway first) plus the internal `extract`.
          - svc['open-webui'].networks.keys() | sort == ['ai', 'extract']
          - svc['open-webui'].networks.ai.gw_priority == 1
          - svc['open-webui'].depends_on is not defined
          - svc['ollama-cpu'].mem_limit == '5g'
          - svc['gpu-broker'].mem_limit == '256m'
          - svc['open-webui'].mem_limit == '4g'
          - svc['tika'].mem_limit == '1g'
          # No swap: memswap_limit equals mem_limit on every service.
          - svc.values() | map(attribute='memswap_limit') | list == svc.values() | map(attribute='mem_limit') | list
          # Images only from versions.yml.
          - svc['ollama-cpu'].image == images.ollama
          - svc['gpu-broker'].image == local_images.gpu_broker
          - svc['open-webui'].image == images.open_webui
          - svc['tika'].image == images.tika
          - images.tika is search('^docker\\.io/apache/tika:[0-9.]+-full@sha256:[0-9a-f]{64}$')
          - svc['gpu-broker'].pull_policy == 'never'
          # Publishing: exactly two ports, both on the tailnet address; ollama-cpu and tika publish nothing.
          - svc['ollama-cpu'].ports is not defined
          - svc['tika'].ports is not defined
          - svc['tika'].expose is not defined
          - svc['gpu-broker'].ports == ['100.64.0.10:11434:11434']
          - svc['open-webui'].ports == ['100.64.0.10:8080:8080']
          - all_ports | length == 2
          - all_ports | select('match', '^100\.64\.0\.10:') | list | length == 2
          - all_ports | select('search', '0\.0\.0\.0|192\.0\.2\.10|^\d+:\d+$|^\d+$') | list | length == 0
          # Ollama on CPU.
          - svc['ollama-cpu'].environment.OLLAMA_KEEP_ALIVE == '10m'
          - svc['ollama-cpu'].volumes == ['ollama-models:/root/.ollama']
          - svc['ollama-cpu'].healthcheck.test == ['CMD', 'ollama', 'list']
          # Broker: config via env and a read-only bind that is never auto-created; config hash label.
          - svc['gpu-broker'].environment.GPU_BROKER_CONFIG == '/etc/gpu-broker/config.json'
          - svc['gpu-broker'].volumes | length == 1
          - svc['gpu-broker'].volumes[0].source == '/etc/homelab-ai/gpu-broker.json'
          - svc['gpu-broker'].volumes[0].target == '/etc/gpu-broker/config.json'
          - svc['gpu-broker'].volumes[0].read_only
          - not svc['gpu-broker'].volumes[0].bind.create_host_path
          - svc['gpu-broker'].labels['homelab.config-hash'] == ai_stack_broker_config_hash
          - svc['gpu-broker'].labels['homelab.config-hash'] | length == 64
          - svc['gpu-broker'].read_only
          - svc['gpu-broker'].cap_drop == ['ALL']
          # §12.25 S-8: no service on `ai` (or `extract`) keeps NET_RAW: no ARP spoofing of the gateway.
          - svc['ollama-cpu'].cap_drop == ['NET_RAW']
          - svc['open-webui'].cap_drop == ['NET_RAW']
          - svc.values() | map(attribute='cap_drop') | map('default', []) | reject('contains', 'ALL') | reject('contains', 'NET_RAW') | list | length == 0
          - svc.values() | selectattr('cap_add', 'defined') | list | length == 0
          # Open WebUI: broker only, auth on, telemetry off, secret from .env, data on a named volume.
          - webui_env.OLLAMA_BASE_URL == 'http://gpu-broker:11434'
          - webui_env.WEBUI_AUTH == 'true'
          - webui_env.ENABLE_SIGNUP == 'true'
          - webui_env.DEFAULT_USER_ROLE == 'pending'
          - webui_env.SCARF_NO_ANALYTICS == 'true'
          - webui_env.DO_NOT_TRACK == 'true'
          - webui_env.ANONYMIZED_TELEMETRY == 'false'
          - webui_env.WEBUI_SECRET_KEY is not defined
          # Document extraction (§12.18b).
          - webui_env.CONTENT_EXTRACTION_ENGINE == 'tika'
          - webui_env.TIKA_SERVER_URL == 'http://tika:9998'
          - webui_env.TIKA_SERVER_VERSION == '3'
          - webui_env.RAG_FILE_MAX_SIZE == '25'
          - webui_env.CONTENT_EXTRACTION_SUPPORTED_MEDIA_MIME_TYPES == 'image/png,image/jpeg,image/tiff,image/bmp,image/gif'
          # Document search (§12.22): embeddings through the broker's embed alias, 8 passages, hybrid.
          - webui_env.RAG_EMBEDDING_ENGINE == 'ollama'
          - webui_env.RAG_EMBEDDING_MODEL == 'embed'
          - webui_env.RAG_OLLAMA_BASE_URL == 'http://gpu-broker:11434'
          - webui_env.RAG_EMBEDDING_BATCH_SIZE == '16'
          # nomic's task prefixes, each with its trailing space.
          - webui_env.RAG_EMBEDDING_QUERY_PREFIX is match('^search_query:\\s$')
          - webui_env.RAG_EMBEDDING_CONTENT_PREFIX is match('^search_document:\\s$')
          - webui_env.RAG_EMBEDDING_QUERY_PREFIX[-1] == ' ' and webui_env.RAG_EMBEDDING_CONTENT_PREFIX[-1] == ' '
          - webui_env.RAG_TOP_K == '8'
          - webui_env.RAG_TOP_K_RERANKER == '8'
          # Hybrid off (R10-1: with Chroma and no reranker it only repeats the vector top-k).
          - webui_env.ENABLE_RAG_HYBRID_SEARCH == 'false'
          # §12.30: no reranker by default, and never online to Hugging Face.
          - webui_env.RAG_RERANKING_MODEL == ''
          - webui_env.HF_HUB_OFFLINE == '1'
          - webui_env.TRANSFORMERS_OFFLINE == '1'
          - webui_env.RAG_EMBEDDING_MODEL_AUTO_UPDATE == 'false'
          - webui_env.RAG_RERANKING_MODEL_AUTO_UPDATE == 'false'
          - webui_env.RAG_EMBEDDING_CONCURRENT_REQUESTS == '2'
          - webui_env.TASK_MODEL == 'assistant'
          # Title prompt: Open WebUI's own placeholder kept literally, JSON with the "title" key asked for,
          # and no example value or placeholder text a small model could copy.
          - webui_env.TITLE_GENERATION_PROMPT_TEMPLATE is search('\\{\\{MESSAGES:END:2\\}\\}')
          - webui_env.TITLE_GENERATION_PROMPT_TEMPLATE is search('"title"')
          - webui_env.TITLE_GENERATION_PROMPT_TEMPLATE is not search('(?i)your|concise title|example|e\\.g\\.|\\.\\.\\.|<title>|\\[title\\]')
          - >-
            webui_env.TITLE_GENERATION_PROMPT_TEMPLATE is not search('\\{\\s*"title"\\s*:')
          - webui_env.TITLE_GENERATION_PROMPT_TEMPLATE.splitlines() | length <= 8
          # ollama-cpu keeps the chat and the embedding model loaded side by side.
          - svc['ollama-cpu'].environment.OLLAMA_MAX_LOADED_MODELS == '2'
          # §12.23 N-1: no cloud passthrough on ollama-cpu, whatever ai_stack_ollama_env says.
          - svc['ollama-cpu'].environment.OLLAMA_NO_CLOUD == '1'
          - svc['ollama-cpu'].environment.OLLAMA_NUM_PARALLEL == '1'
          # Every value Ansible checks must be a string in compose (no YAML ints/bools leaking through).
          - webui_env.values() | reject('string') | list | length == 0
          # Tika: internal network only, unprivileged, read-only root, tmpfs /tmp, config read-only.
          - svc['tika'].networks == ['extract']
          - compose.networks.extract.internal
          - compose.networks.ai.internal is not defined
          - svc['tika'].read_only
          - svc['tika'].cap_drop == ['ALL']
          - svc['tika'].security_opt == ['no-new-privileges:true']
          - svc['tika'].user is not defined
          - svc['tika'].pids_limit == 256
          - svc['tika'].tmpfs == ['/tmp:size=128m,uid=35002,gid=35002,mode=0700']
          - svc['tika'].command == ['-c', '/tika-config.xml']
          - svc['tika'].volumes | length == 1
          - svc['tika'].volumes[0].type == 'bind'
          - svc['tika'].volumes[0].source == '/etc/homelab-ai/tika-config.xml'
          - svc['tika'].volumes[0].target == '/tika-config.xml'
          - svc['tika'].volumes[0].read_only
          - not svc['tika'].volumes[0].bind.create_host_path
          - svc['tika'].labels['homelab.config-hash'] == ai_stack_tika_config_hash
          - svc['tika'].labels['homelab.config-hash'] | length == 64
          - svc['tika'].healthcheck.test[:2] == ['CMD', 'wget']
          - svc['tika'].healthcheck.test[-1] == 'http://127.0.0.1:9998/tika'
          # One OpenMP thread per Tesseract run, nothing else (no secrets, no proxies).
          - svc['tika'].environment.keys() | list == ['OMP_THREAD_LIMIT']
          - svc['tika'].environment.OMP_THREAD_LIMIT == '1'
          # open-webui is off *common (two networks): it must keep no-new-privileges and the restart policy.
          - svc['open-webui'].security_opt == ['no-new-privileges:true']
          - svc['ollama-cpu'].security_opt == ['no-new-privileges:true']
          - svc['gpu-broker'].security_opt == ['no-new-privileges:true']
          # Networks: `ai` is the role's (external, pinned in tasks/networks.yml); `extract` is pinned here.
          - compose.networks.ai.keys() | sort == ['external', 'name']
          - compose.networks.ai.external is sameas true
          - compose.networks.ai.name == 'ai_ai'
          - compose.networks.extract.name == 'ai_extract'
          - compose.networks.extract.ipam.config | length == 1
          - compose.networks.extract.ipam.config[0].subnet == '172.23.255.240/28'
          - ai_stack_network_subnet == '172.20.0.0/24'
          - svc['tika'].env_file is not defined
          - svc['open-webui'].env_file == ['.env']
          - svc['open-webui'].volumes | length == 6
          - svc['open-webui'].volumes[0] == 'open-webui-data:/app/backend/data'
          # Skills (§12.19): read-only, a LOCAL directory (never the CIFS automount), never auto-created,
          # rslave so the host's bind appears and disappears inside the running container.
          - svc['open-webui'].volumes[1].type == 'bind'
          - svc['open-webui'].volumes[1].source == '/var/lib/homelab-ai/skills'
          - svc['open-webui'].volumes[1].target == '/skills'
          - svc['open-webui'].volumes[1].read_only is sameas true
          - svc['open-webui'].volumes[1].bind.create_host_path is sameas false
          - svc['open-webui'].volumes[1].bind.propagation == 'rslave'
          # Writing (§12.21): exactly the same bind, its own view and target.
          - svc['open-webui'].volumes[2].type == 'bind'
          - svc['open-webui'].volumes[2].source == '/var/lib/homelab-ai/writing'
          - svc['open-webui'].volumes[2].target == '/writing'
          - svc['open-webui'].volumes[2].read_only is sameas true
          - svc['open-webui'].volumes[2].bind.create_host_path is sameas false
          - svc['open-webui'].volumes[2].bind.propagation == 'rslave'
          - svc['open-webui'].volumes[2].keys() | sort == svc['open-webui'].volumes[1].keys() | sort
          # Payday runs (§12.27): the one rw bind, otherwise the same (local view, never auto-created, rslave).
          - svc['open-webui'].volumes[3].type == 'bind'
          - svc['open-webui'].volumes[3].source == '/var/lib/homelab-ai/payday-runs'
          - svc['open-webui'].volumes[3].target == '/payday-runs'
          - svc['open-webui'].volumes[3].read_only is sameas false
          - svc['open-webui'].volumes[3].bind.create_host_path is sameas false
          - svc['open-webui'].volumes[3].bind.propagation == 'rslave'
          - svc['open-webui'].volumes[3].keys() | sort == svc['open-webui'].volumes[1].keys() | sort
          - svc['open-webui'].volumes[1:] | rejectattr('read_only') | map(attribute='target') | list == ['/payday-runs']
          # Rerankers (§12.30, R16-1): each pinned model's folder, READ-ONLY from root's seed folder on the host
          # (outside the data volume and Docker's volumes), onto its folder in open-webui's HF cache.
          - svc['open-webui'].volumes[4:] | map(attribute='type') | unique | list == ['bind']
          - >-
            svc['open-webui'].volumes[4:] | map(attribute='source') | list
            == ['/var/lib/homelab-ai/hf-models/models--cross-encoder--ms-marco-MiniLM-L6-v2',
                '/var/lib/homelab-ai/hf-models/models--BAAI--bge-reranker-base']
          - >-
            svc['open-webui'].volumes[4:] | map(attribute='target') | list
            == ['/app/backend/data/cache/embedding/models/models--cross-encoder--ms-marco-MiniLM-L6-v2',
                '/app/backend/data/cache/embedding/models/models--BAAI--bge-reranker-base']
          - svc['open-webui'].volumes[4:] | map(attribute='read_only') | list == [true, true]
          - svc['open-webui'].volumes[4:] | map(attribute='bind.create_host_path') | list == [false, false]
          - svc['open-webui'].volumes[4:] | map(attribute='bind') | map('list') | list == [['create_host_path']] * 2
          - svc['open-webui'].volumes[4].keys() | sort == ['bind', 'read_only', 'source', 'target', 'type']
          - svc['open-webui'].volumes[5].keys() | sort == ['bind', 'read_only', 'source', 'target', 'type']
          - all_volume_sources | select('match', '^/var/lib/docker') | list | length == 0
          # No container binds anything under the library automount.
          - all_volume_sources | select('match', '^/srv/ai-library') | list | length == 0
          - compose.volumes.keys() | sort == ['ollama-models', 'open-webui-data']
          - compose.networks.keys() | sort == ['ai', 'extract']
        fail_msg: "{{ compose | to_nice_yaml }}"
        quiet: true

    - name: Render compose.yaml with no models set (no embed alias, no task model)
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/compose.yaml.j2"
        dest: "{{ ai_stack_test_tmp.path }}/compose-nomodels.yaml"
        mode: "0644"
      vars:
        ai_cpu_model: "{{ undef(hint='unset in this case') }}"
        ai_gpu_model: "{{ undef(hint='unset in this case') }}"
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"

    - name: Without ai_embed_model, Open WebUI keeps its own embedding (no alias to point at, no prefixes)
      vars:
        env: "{{ (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/compose-nomodels.yaml') | from_yaml).services['open-webui'].environment }}"
      ansible.builtin.assert:
        that:
          - env.keys() | select('match', '^RAG_(EMBEDDING|OLLAMA)_') | reject('match', '.*_AUTO_UPDATE$') | list == []
          # The offline switches apply with or without an embedding model.
          - env.HF_HUB_OFFLINE == '1' and env.RAG_EMBEDDING_MODEL_AUTO_UPDATE == 'false'
          - env.TASK_MODEL is not defined
          - env.RAG_TOP_K == '8'
          - env.ENABLE_RAG_HYBRID_SEARCH == 'false'
        fail_msg: "{{ env | to_json }}"
        quiet: true

    # §12.30, experiment E3: the inventory expects hybrid search with the pre-seeded bge reranker.
    - name: Render compose.yaml for E3 (hybrid + BAAI/bge-reranker-base)
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/compose.yaml.j2"
        dest: "{{ ai_stack_test_tmp.path }}/compose-e3.yaml"
        mode: "0644"
      vars:
        ai_stack_expect_hybrid_search: true
        ai_stack_expect_reranker_model: BAAI/bge-reranker-base
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"

    - name: E3 seeds a fresh database with hybrid and the reranker, and the check expects the same
      vars:
        env: "{{ (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/compose-e3.yaml') | from_yaml).services['open-webui'].environment }}"
        ai_stack_expect_hybrid_search: true
        ai_stack_expect_reranker_model: BAAI/bge-reranker-base
      ansible.builtin.assert:
        that:
          - env.ENABLE_RAG_HYBRID_SEARCH == 'true'
          - env.RAG_RERANKING_MODEL == 'BAAI/bge-reranker-base'
          - env.HF_HUB_OFFLINE == '1'
          - ai_stack_webui_search_expected['rag.enable_hybrid_search'] is sameas true
          - ai_stack_webui_search_expected['rag.reranking_model'] == 'BAAI/bge-reranker-base'
        quiet: true

    - name: Render compose.yaml with sign-ups turned off
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/compose.yaml.j2"
        dest: "{{ ai_stack_test_tmp.path }}/compose-nosignup.yaml"
        mode: "0644"
      vars:
        ai_webui_enable_signup: false
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"

    - name: Sign-ups off reaches Open WebUI
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/compose-nosignup.yaml') | from_yaml)
            .services['open-webui'].environment.ENABLE_SIGNUP == 'false'
        quiet: true

    # ---- 1b. tika-config.xml --------------------------------------------------------------------------
    - name: Write tika-config.xml as the role does (copy of the rendered content)
      ansible.builtin.copy:
        content: "{{ ai_stack_tika_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/tika-config.xml"
        mode: "0644"
      vars:
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"

    # The same validator the role's copy task uses, plus the OCR settings read back from the XML.
    - name: The Tika config parses and sets OCR for images and scanned PDFs
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys, xml.etree.ElementTree as e
            root = e.parse(sys.argv[1]).getroot()
            parsers = [p.get("class").rsplit(".", 1)[1] for p in root.find("parsers")]
            excluded = [x.get("class").rsplit(".", 1)[1] for x in root.find("parsers")[0].findall("parser-exclude")]
            def params(name):
                p = [p for p in root.find("parsers") if p.get("class").endswith("." + name)][0]
                return {x.get("name"): x.text for x in p.find("params")}
            server = root.find("server/params")
            print(json.dumps({"root": root.tag, "parsers": parsers, "excluded": excluded,
                              "pdf": params("PDFParser"), "ocr": params("TesseractOCRParser"),
                              "timeout": server.findtext("taskTimeoutMillis"),
                              "jvm": [a.text for a in server.find("forkedJvmArgs")]}))
          - "{{ ai_stack_test_tmp.path }}/tika-config.xml"
      register: ai_stack_test_tika_xml
      changed_when: false

    - name: Tika config has the declared shape
      vars:
        x: "{{ ai_stack_test_tika_xml.stdout | from_json }}"
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"
      ansible.builtin.assert:
        that:
          - x.root == 'properties'
          # DefaultParser first (minus the two), then the explicit PDF and OCR parsers, which win.
          - x.parsers == ['DefaultParser', 'PDFParser', 'TesseractOCRParser']
          - x.excluded | sort == ['PDFParser', 'TesseractOCRParser']
          - x.pdf.ocrStrategy == 'auto'
          - x.pdf.extractInlineImages == 'false'
          - x.ocr.language == 'eng'
          - x.ocr.skipOcr == 'false'
          - x.ocr.timeoutSeconds == '120'
          - x.timeout == '600000'
          - x.jvm == ['-Xmx512m', '-XX:+ExitOnOutOfMemoryError', '-Dpdfbox.fontcache=/tmp']
          # The label hash is the hash of exactly the installed file.
          - ai_stack_tika_config_hash == lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/tika-config.xml', rstrip=false) | hash('sha256')
          # Open WebUI's "Tika 3.x" API matches the pinned image's major version.
          - images.tika is search(':' ~ ai_stack_tika_server_version ~ '\\.')
        fail_msg: "{{ x | to_json }}"
        quiet: true

    - name: A different OCR strategy changes the config hash (so tika is recreated)
      vars:
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"
        ai_stack_tika_pdf_ocr_strategy: ocr_and_text_extraction
      ansible.builtin.assert:
        that:
          - ai_stack_tika_config_content is search('<param name="ocrStrategy" type="string">ocr_and_text_extraction</param>')
          - ai_stack_tika_config_hash != (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/tika-config.xml', rstrip=false) | hash('sha256'))
        quiet: true

    # ---- 1c. Open WebUI's expected document settings and the memory budget ----------------------------
    - name: The verify step expects exactly what compose sets
      vars:
        env: "{{ (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/compose.yaml') | from_yaml).services['open-webui'].environment }}"
        want: "{{ ai_stack_webui_extraction_expected }}"
      ansible.builtin.assert:
        that:
          - want.keys() | sort == ['rag.content_extraction.supported_media_mime_types', 'rag.content_extraction_engine',
                                   'rag.file.max_size', 'rag.tika_server_url', 'rag.tika_server_version']
          - want['rag.content_extraction_engine'] == env.CONTENT_EXTRACTION_ENGINE
          - want['rag.tika_server_url'] == env.TIKA_SERVER_URL
          - want['rag.tika_server_version'] == env.TIKA_SERVER_VERSION
          - want['rag.file.max_size'] | int == env.RAG_FILE_MAX_SIZE | int == 25
          - want['rag.content_extraction.supported_media_mime_types'] | join(',') == env.CONTENT_EXTRACTION_SUPPORTED_MEDIA_MIME_TYPES
        fail_msg: "{{ [want, env] | to_json }}"
        quiet: true

    - name: Memory budget arithmetic (MiB)
      ansible.builtin.assert:
        that:
          - >-
            ai_stack_mem_containers_mb == {'ollama_cpu': 5120, 'gpu_broker': 256, 'open_webui': 4096,
                                           'tika': 1024, 'searxng': 384}
          # ai-control, research-gate, finance-digest, skill-drafter, voice-profile, forge-api, ai-backup (256M
          # MemoryMax each), mission-control and its briefing (128M each)
          # + host daemons.
          - ai_stack_mem_host_services.keys() | sort == ['ai_backup', 'ai_control', 'finance_digest', 'forge_api',
                                                         'host_daemons', 'mission_control', 'mission_control_briefing',
                                                         'research_gate', 'skill_drafter', 'voice_profile']
          - ai_stack_mem_host_services.mission_control == '128m'
          - ai_stack_mem_host_services.mission_control_briefing == '128m'
          - ai_stack_mem_host_reserve_mb | int == 2816
          - ai_stack_mem_needed_mb | int == 13696
          - ai_stack_mem_overcommit_mb | int == 0
        fail_msg: "{{ [ai_stack_mem_containers_mb, ai_stack_mem_needed_mb] | to_json }}"
        quiet: true

    # The preflight assert itself, against a 7.1 GiB host (7270 MiB here; ai-box's real MemTotal, 7305 MiB, is
    # the inventory case further down).
    - name: The role's default limits, for the budget cases that override one
      ansible.builtin.set_fact:
        ai_stack_test_default_limits: "{{ ai_stack_mem_limits }}"

    - name: Memory budget refuses an unacknowledged overcommit on a 7.1 GiB host
      ansible.builtin.include_tasks: budget_case.yml
      vars:
        budget_memtotal: 7270
        budget_overcommit: 0
        budget_expect_ok: false

    - name: Memory budget passes once the overcommit is acknowledged
      ansible.builtin.include_tasks: budget_case.yml
      vars:
        budget_memtotal: 7270
        budget_overcommit: 6426
        budget_expect_ok: true

    - name: Memory budget refuses one MiB short of the accepted overcommit
      ansible.builtin.include_tasks: budget_case.yml
      vars:
        budget_memtotal: 7270
        budget_overcommit: 6425
        budget_expect_ok: false

    # The ai-box inventory since its RAM upgrade (§12.30): MemTotal 15357 MiB, no overcommit, open_webui 4g:
    # 13696 MiB needed <= 15357 + 0.
    - name: Memory budget passes with the ai-box inventory (15357 MiB, open_webui 4g, overcommit 0)
      ansible.builtin.include_tasks: budget_case.yml
      vars:
        budget_memtotal: 15357
        budget_overcommit: 0
        budget_limits: {open_webui: 4096m}
        budget_expect_ok: true

    - name: Memory budget refuses open_webui 5.7g on that host (one MiB over RAM)
      ansible.builtin.include_tasks: budget_case.yml
      vars:
        budget_memtotal: 15357
        budget_overcommit: 0
        budget_limits: {open_webui: 5758m}
        budget_expect_ok: false

    - name: Memory budget passes on a host with room (16 GiB)
      ansible.builtin.include_tasks: budget_case.yml
      vars:
        budget_memtotal: 15900
        budget_overcommit: 0
        budget_expect_ok: true

    # ---- 1d. The task files are wired in (static: a dropped import would otherwise go unnoticed) ---------
    - name: Read the role's task files
      ansible.builtin.set_fact:
        ai_stack_test_main_tasks: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/main.yml') | from_yaml }}"
        ai_stack_test_preflight_tasks: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/preflight.yml') | from_yaml }}"

    - name: Preflight imports the memory budget; main imports the networks (before compose) and the checks (last)
      vars:
        # The key has dots, so no map(attribute=...): a loop reads it.
        main_imports: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_main_tasks -%}{%- set _ = out.append(t['ansible.builtin.import_tasks'] | default('')) -%}{%- endfor -%}
          {{ out }}
        preflight_imports: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_preflight_tasks -%}{%- set _ = out.append(t['ansible.builtin.import_tasks'] | default('')) -%}{%- endfor -%}
          {{ out }}
        guarded_imports: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_main_tasks + ai_stack_test_preflight_tasks -%}
          {%- if 'ansible.builtin.import_tasks' in t and 'when' in t -%}{%- set _ = out.append(t.name) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}
        main_names: "{{ ai_stack_test_main_tasks | map(attribute='name') | list }}"
      ansible.builtin.assert:
        that:
          - preflight_imports is contains('memory_budget.yml')
          - preflight_imports is contains('broker_num_ctx_check.yml')
          - main_imports | select | list
            == ['preflight.yml', 'broker_image.yml', 'networks.yml', 'skills.yml', 'hf_models.yml', 'boot_helper.yml',
                'stack.yml', 'models.yml', 'verify_skills.yml', 'verify_extraction.yml', 'verify_search.yml',
                'verify_broker.yml']
          # §12.30 (R16-1): the rerankers are seeded before the Compose definition and compose up (the binds'
          # sources exist then, and create_host_path is false).
          - main_imports.index('hf_models.yml') < main_names.index('Compose definition')
          - main_imports.index('hf_models.yml') < main_imports.index('stack.yml')
          - main_imports.index('networks.yml') < main_names.index('Compose definition')
          - main_imports.index('skills.yml') < main_imports.index('stack.yml')
          - main_imports.index('verify_skills.yml') > main_imports.index('stack.yml')
          - main_imports[-1] == 'verify_broker.yml'
          # No import in main.yml or preflight.yml is switched off by a `when:`.
          - guarded_imports | length == 0
        fail_msg: "{{ [main_imports, preflight_imports] | to_json }}"
        quiet: true

    # ---- 1e. The `ai` network task can never recreate, relabel or empty the live network -----------------
    - name: Read tasks/networks.yml
      ansible.builtin.set_fact:
        ai_stack_test_net_tasks: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/networks.yml') | from_yaml }}"

    - name: The docker_network task has exactly the safe arguments, after both read-only checks
      vars:
        # Module keys have dots, so a loop reads them.
        net_idx: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_net_tasks -%}
          {%- if 'community.docker.docker_network' in t or 'docker_network' in t -%}{%- set _ = out.append(loop.index0) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}
        net_task: "{{ ai_stack_test_net_tasks[net_idx[0]] }}"
        net_args: "{{ net_task['community.docker.docker_network'] | default({}) }}"
        names: "{{ ai_stack_test_net_tasks | map(attribute='name') | list }}"
      ansible.builtin.assert:
        that:
          - net_idx | length == 1
          - net_task['community.docker.docker_network'] is mapping
          # Exactly these keys: no force, labels, driver_options, enable_ipv4/6, internal, attachable, ...
          - net_args.keys() | sort == ['appends', 'driver', 'ipam_config', 'name', 'state']
          - net_args.name == '{{ "{{" }} ai_stack_network_name {{ "}}" }}'
          - net_args.driver == 'bridge'
          - net_args.ipam_config | length == 1
          - net_args.ipam_config[0].keys() | list == ['subnet']
          - net_args.ipam_config[0].subnet == '{{ "{{" }} ai_stack_network_subnet {{ "}}" }}'
          - net_args.appends is sameas true
          - net_args.state == 'present'
          # Task-level switches that could bypass it or hide a failure.
          - net_task.keys() | sort == ['community.docker.docker_network', 'name']
          # The two read-only checks (address plan, live networks) run first, and nothing else changes state.
          - names.index('Networks | the pinned subnets fit role docker\'s address plan') < net_idx[0]
          - names.index('Networks | the host\'s networks agree with the pinned subnets') < net_idx[0]
          - net_idx[0] == ai_stack_test_net_tasks | length - 1
        fail_msg: "{{ net_task | default({}) | to_json }}"
        quiet: true

    # ---- 1f. Read-only shares (skills §12.19, writing §12.21): CIFS mounts and the reconcile timer --------
    - name: The read-only shares are skills and writing, each with its own view, target, marker and unit
      vars:
        shares: "{{ ai_stack_ro_shares }}"
      ansible.builtin.assert:
        that:
          - shares | map(attribute='name') | list == ['skills', 'writing', 'payday-runs']
          - shares | map(attribute='what') | list
            == ['//100.64.0.20/ai-library/30-skills', '//100.64.0.20/ai-library/40-writing',
                '//100.64.0.20/ai-library/50-finance/payday-runs']
          - shares | map(attribute='view') | list
            == ['/var/lib/homelab-ai/skills', '/var/lib/homelab-ai/writing', '/var/lib/homelab-ai/payday-runs']
          - shares | map(attribute='target') | list == ['/skills', '/writing', '/payday-runs']
          - shares | map(attribute='marker') | list == ['SKILLS-NOT-MOUNTED', 'WRITING-NOT-MOUNTED', 'PAYDAY-RUNS-NOT-MOUNTED']
          - shares | map(attribute='mount_unit') | list
            == ['var-lib-homelab' ~ ai_stack_systemd_escaped_dash ~ 'ai-skills.mount',
                'var-lib-homelab' ~ ai_stack_systemd_escaped_dash ~ 'ai-writing.mount',
                'var-lib-homelab' ~ ai_stack_systemd_escaped_dash ~ 'ai-payday' ~ ai_stack_systemd_escaped_dash ~ 'runs.mount']
          - shares | map(attribute='view') | unique | list | length == 3
          - shares | map(attribute='mount_unit') | unique | list | length == 3
          # §12.27: exactly one read-write share, the payday-runs subfolder; the others stay read-only.
          - shares | map(attribute='mode') | list == ['ro', 'ro', 'rw']
        quiet: true

    - name: Render each share's mount unit
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/homelab-ai-share.mount.j2"
        dest: "{{ ai_stack_test_tmp.path }}/{{ share.mount_unit }}"
        mode: "0644"
      loop: "{{ ai_stack_ro_shares }}"
      loop_control:
        loop_var: share
        label: "{{ share.name }}"

    - name: Render the reconcile service and timer units
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/{{ item.src }}"
        dest: "{{ ai_stack_test_tmp.path }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - {src: homelab-ai-skills-reconcile.service.j2, dest: "{{ ai_stack_skills_reconcile_unit }}"}
        - {src: homelab-ai-skills.timer.j2, dest: "{{ ai_stack_skills_timer_unit }}"}
      loop_control:
        label: "{{ item.dest }}"

    - name: Write a stand-in for the library's tailnet wait unit
      ansible.builtin.copy:
        content: "[Unit]\nDescription=stand-in\n[Service]\nType=oneshot\nExecStart=/bin/true\n"
        dest: "{{ ai_stack_test_tmp.path }}/{{ ai_stack_skills_wait_unit }}"
        mode: "0644"

    - name: Ask systemd-escape for each share's unit name, where it exists
      ansible.builtin.command:
        argv: [systemd-escape, --path, --suffix=mount, "{{ share.view }}"]
      loop: "{{ ai_stack_ro_shares }}"
      loop_control:
        loop_var: share
        label: "{{ share.name }}"
      register: ai_stack_test_escape
      changed_when: false
      failed_when: false

    - name: Systemd-analyze verify the share units, where it exists
      ansible.builtin.command:
        argv: >-
          {{ ['systemd-analyze', 'verify']
             + (ai_stack_ro_shares | map(attribute='mount_unit') | map('regex_replace', '^', ai_stack_test_tmp.path ~ '/') | list)
             + [ai_stack_test_tmp.path ~ '/' ~ ai_stack_skills_timer_unit,
                ai_stack_test_tmp.path ~ '/' ~ ai_stack_skills_reconcile_unit,
                ai_stack_test_tmp.path ~ '/' ~ ai_stack_skills_wait_unit] }}
      register: ai_stack_test_analyze
      changed_when: false
      failed_when: false

    - name: Each share is its own read-only CIFS mount, never enabled, never tied to the library mount
      vars:
        mount_lines: >-
          {{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/' ~ share.mount_unit).splitlines()
             | reject('match', '^\\s*(#|$)') | list }}
        opts: "{{ (mount_lines | select('match', '^Options=') | first)[8:].split(',') }}"
        escaped: "{{ ai_stack_test_escape.results | selectattr('share.name', 'equalto', share.name) | first }}"
      ansible.builtin.assert:
        that:
          - escaped.rc != 0 or escaped.stdout == share.mount_unit
          - ai_stack_test_analyze.rc == 127 or ai_stack_test_analyze.rc is undefined
            or (ai_stack_test_analyze.rc == 0 and ai_stack_test_analyze.stderr == '')
          - ('What=' ~ share.what) in mount_lines
          - ('Where=' ~ share.view) in mount_lines
          - "'Type=cifs' in mount_lines"
          - "'TimeoutSec=60' in mount_lines"
          # A stop while the PC is away never hangs, and the unmount propagates into open-webui.
          - "'LazyUnmount=yes' in mount_lines"
          - "'ForceUnmount=yes' in mount_lines"
          - share.mode != 'ro' or opts
            == ['ro', 'nosuid', 'nodev', 'noexec', 'vers=3.1.1', 'seal', 'nounix', 'serverino', 'symlink=none',
                'soft', 'echo_interval=15', 'uid=0', 'gid=0', 'file_mode=0440', 'dir_mode=0550',
                'credentials=/etc/ai-library/credentials', '_netdev']
          # The read-write share: rw, files 0640 and folders 0750, everything else the same.
          - share.mode != 'rw' or opts
            == ['rw', 'nosuid', 'nodev', 'noexec', 'vers=3.1.1', 'seal', 'nounix', 'serverino', 'symlink=none',
                'soft', 'echo_interval=15', 'uid=0', 'gid=0', 'file_mode=0640', 'dir_mode=0750',
                'credentials=/etc/ai-library/credentials', '_netdev']
          - opts | select('match', '^(suid|dev|exec|password=|username=|noperm|mfsymlinks)') | list == []
          - share.mode == 'rw' or 'rw' not in opts
          # Ordered after the library client's tailnet wait; nothing about the library mount itself.
          - "'Requires=ai-library-tailnet-wait.service' in mount_lines"
          - "'After=ai-library-tailnet-wait.service tailscaled.service network-online.target' in mount_lines"
          - mount_lines | select('search', 'ai\\\\x2dlibrary|/srv/ai-library') | list == []
          # Not enabled, no automount: only the reconcile starts it (open-webui's bind would fire an automount).
          - mount_lines | select('match', '^(\\[Install\\]|WantedBy=|RequiredBy=)') | list == []
        fail_msg: "{{ [share.name, mount_lines, ai_stack_test_analyze.stderr | default('')] | to_json }}"
        quiet: true
      loop: "{{ ai_stack_ro_shares }}"
      loop_control:
        loop_var: share
        label: "{{ share.name }}"

    - name: One reconcile service and timer for every share
      vars:
        timer_lines: >-
          {{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/' ~ ai_stack_skills_timer_unit).splitlines()
             | reject('match', '^\\s*(#|$)') | list }}
        svc_lines: >-
          {{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/' ~ ai_stack_skills_reconcile_unit).splitlines()
             | reject('match', '^\\s*(#|$)') | list }}
      ansible.builtin.assert:
        that:
          - ai_stack_skills_mount_unit == 'var-lib-homelab\\x2dai-skills.mount'
          - ai_stack_writing_mount_unit == 'var-lib-homelab\\x2dai-writing.mount'
          - ai_stack_skills_timer_unit == 'homelab-ai-skills-reconcile.timer'
          - ai_stack_skills_legacy_wants == '/etc/systemd/system/srv-ai' ~ ai_stack_systemd_escaped_dash ~ 'library.mount.wants/' ~ ai_stack_skills_mount_unit
          # The timer drives the reconcile service, never a mount: 30 s after boot/start, then every minute.
          - "'Unit=homelab-ai-skills-reconcile.service' in timer_lines"
          - "'WantedBy=timers.target' in timer_lines"
          - timer_lines | select('match', '^On') | list == ['OnBootSec=30s', 'OnActiveSec=30s', 'OnUnitActiveSec=1min']
          # The reconcile service: one bounded pass over every share, root, network limited to the PC.
          - "'Type=oneshot' in svc_lines"
          - >-
            ('ExecStart=/usr/bin/python3 -I -B /usr/local/lib/homelab-ai/skills_reconcile.py --host 100.64.0.20'
             ~ ' --port 445 --timeout 4 --where /var/lib/homelab-ai/skills --where /var/lib/homelab-ai/writing'
             ~ ' --where /var/lib/homelab-ai/payday-runs') in svc_lines
          - "'IPAddressDeny=any' in svc_lines"
          - "'IPAddressAllow=100.64.0.20' in svc_lines"
          - "'RestrictAddressFamilies=AF_UNIX AF_INET' in svc_lines"
          - "'NoNewPrivileges=yes' in svc_lines"
          - "'ProtectSystem=strict' in svc_lines"
          - svc_lines | select('match', '^(\\[Install\\]|WantedBy=)') | list == []
        fail_msg: "{{ [timer_lines, svc_lines] | to_json }}"
        quiet: true

    - name: Read tasks/skills.yml
      ansible.builtin.set_fact:
        ai_stack_test_skills_tasks: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/skills.yml') | from_yaml }}"

    # ---- 1g. Probes, marker, credentials preflight, and /skills read-only inside the container -------------
    - name: Search the role's task files for mountpoint
      ansible.builtin.command:
        argv: [grep, -l, -w, -r, --include=*.yml, mountpoint, "{{ ai_stack_test_role }}/tasks"]
      register: ai_stack_test_mountpoint_grep
      changed_when: false
      failed_when: ai_stack_test_mountpoint_grep.rc > 1

    # The one command in skills.yml is the probe that can't stat or mount anything, exactly.
    - name: The share probe is exactly systemctl is-active --quiet on each mount unit (never a stat)
      vars:
        commands: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_skills_tasks -%}
          {%- for k in ['ansible.builtin.command', 'command', 'ansible.builtin.shell', 'shell', 'ansible.builtin.raw', 'raw',
                        'ansible.builtin.script', 'script'] -%}
          {%- if k in t -%}{%- set _ = out.append({'name': t.name, 'module': k, 'args': t[k]}) -%}{%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ out }}
        modules: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_skills_tasks -%}
          {%- set _ = out.append(t.keys() | select('match', '^ansible\.builtin\.') | list | first | default('?')) -%}
          {%- endfor -%}
          {{ out }}
        services: >-
          {%- set out = [] -%}
          {%- for t in ai_stack_test_skills_tasks -%}
          {%- if 'ansible.builtin.systemd_service' in t -%}{%- set _ = out.append(t) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}
        file_task: "{{ ai_stack_test_skills_tasks | selectattr('name', 'equalto', 'Skills | local view directory per share (what open-webui binds)') | first }}"
        probe_task: "{{ ai_stack_test_skills_tasks[0] }}"
        marker_task: "{{ ai_stack_test_skills_tasks | selectattr('name', 'search', '^Skills \\| marker the tool sees') | first }}"
        legacy_task: "{{ ai_stack_test_skills_tasks | selectattr('name', 'equalto', 'Skills | no leftover link from the library mount') | first }}"
        stat_task: "{{ ai_stack_test_skills_tasks | selectattr('name', 'search', 'current marker') | first }}"
        unlock_task: "{{ ai_stack_test_skills_tasks | selectattr('name', 'search', 'unlock an outdated marker') | first }}"
        lock_marker: "{{ ai_stack_test_skills_tasks | selectattr('name', 'search', 'marker immutable') | first }}"
        lock_dir: "{{ ai_stack_test_skills_tasks | selectattr('name', 'search', 'local directory immutable') | first }}"
        task_names: "{{ ai_stack_test_skills_tasks | map(attribute='name') | list }}"
      ansible.builtin.assert:
        that:
          # The probe, and one chattr -i (a read-write share's outdated marker, only while it isn't mounted).
          - commands | length == 2
          - commands[1].args.argv[:2] == ['chattr', '-i']
          # Only an outdated marker is unlocked (a re-run with the same text changes nothing).
          - >-
            unlock_task.when == ['item.stat is defined', 'item.stat.exists',
                                 "item.stat.checksum != (ai_stack_share_marker_text | hash('sha1'))"]
          - stat_task.when == ['item.rc != 0', "item.share.mode == 'rw'"]
          # The fail-safe: marker, then directory, immutable while the read-write share isn't mounted.
          - lock_marker['ansible.builtin.file'].attributes == '+i'
          - lock_dir['ansible.builtin.file'].attributes == '+i'
          - lock_marker['ansible.builtin.file'].path == '{{ "{{" }} item.share.view {{ "}}" }}/{{ "{{" }} item.share.marker {{ "}}" }}'
          - lock_dir['ansible.builtin.file'].path == '{{ "{{" }} item.share.view {{ "}}" }}'
          - lock_marker.when == ['item.rc != 0', "item.share.mode == 'rw'"]
          - lock_dir.when == lock_marker.when
          - task_names.index(marker_task.name) < task_names.index(lock_marker.name) < task_names.index(lock_dir.name)
          - task_names.index(unlock_task.name) < task_names.index(marker_task.name)
          # No task file of the role uses `mountpoint` (it stats the path; a stale soft mount would hang it).
          - ai_stack_test_mountpoint_grep.rc == 1
          - ai_stack_test_mountpoint_grep.stdout == ''
          - commands[0].module == 'ansible.builtin.command'
          - commands[0].args.keys() | list == ['argv']
          - commands[0].args.argv == ['systemctl', 'is-active', '--quiet', '{{ "{{" }} share.mount_unit {{ "}}" }}']
          - ai_stack_test_skills_tasks[0].name == commands[0].name
          - commands[0].name == probe_task.name
          # The probe runs for EVERY share, before anything else; the marker and directory read its results.
          - probe_task.loop == '{{ "{{" }} ai_stack_ro_shares {{ "}}" }}'
          - probe_task.loop_control.loop_var == 'share'
          - probe_task.register == 'ai_stack_ro_share_active'
          - probe_task.failed_when is sameas false
          - modules | unique | sort == ['ansible.builtin.command', 'ansible.builtin.copy', 'ansible.builtin.file',
                                        'ansible.builtin.stat', 'ansible.builtin.systemd_service', 'ansible.builtin.template']
          # The leftover round-3 link is removed.
          - legacy_task['ansible.builtin.file'].path == '{{ "{{" }} ai_stack_skills_legacy_wants {{ "}}" }}'
          - legacy_task['ansible.builtin.file'].state == 'absent'
          - legacy_task.when is not defined
          # The play starts the TIMER; the mount itself is only ever stopped, and only while it is active.
          - services | length == 2
          - services[0]['ansible.builtin.systemd_service'].name == '{{ "{{" }} ai_stack_skills_timer_unit {{ "}}" }}'
          - services[0]['ansible.builtin.systemd_service'].state == 'started'
          - services[0]['ansible.builtin.systemd_service'].enabled is sameas true
          - services[0].when is not defined
          - services[1]['ansible.builtin.systemd_service'].name == '{{ "{{" }} item.0.share.mount_unit {{ "}}" }}'
          - services[1].loop == '{{ "{{" }} ai_stack_ro_share_active.results | zip(ai_stack_ro_share_units.results) | list {{ "}}" }}'
          - services[1]['ansible.builtin.systemd_service'].keys() | sort == ['name', 'state']
          - services[1]['ansible.builtin.systemd_service'].state == 'stopped'
          - services[1].when == ['item.0.rc == 0', 'item.1 is changed']
          - ai_stack_test_skills_tasks[-1].name == services[1].name
          # The marker and the directory's mode are only written while nothing is mounted on top.
          - marker_task.when == 'item.rc != 0'
          - marker_task.loop == '{{ "{{" }} ai_stack_ro_share_active.results {{ "}}" }}'
          - marker_task['ansible.builtin.copy'].dest == '{{ "{{" }} item.share.view {{ "}}" }}/{{ "{{" }} item.share.marker {{ "}}" }}'
          - file_task.when == 'item.rc != 0'
          - file_task.loop == '{{ "{{" }} ai_stack_ro_share_active.results {{ "}}" }}'
          - file_task['ansible.builtin.file'].path == '{{ "{{" }} item.share.view {{ "}}" }}'
        fail_msg: "{{ [commands, modules] | to_json }}"
        quiet: true

    - name: Preflight imports the AI Library client check (no fd-based-mount check any more)
      vars:
        pf_text: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/preflight.yml') }}"
        pf_tasks: "{{ pf_text | from_yaml }}"
      ansible.builtin.assert:
        that:
          - pf_tasks | selectattr('name', 'equalto', 'Preflight | AI Library client prerequisites for the skills mount')
            | map(attribute='ansible.builtin.import_tasks', default='') | list | length == 1
          - pf_text is search('import_tasks. skills_prereqs.yml')
          - pf_text is not search('fd-based')
        quiet: true

    - name: Scratch credentials and wait unit files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ ai_stack_test_tmp.path }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - {name: cred-0600, mode: "0600", content: "username=x\n"}
        - {name: cred-0644, mode: "0644", content: "username=x\n"}
        - {name: wait.service, mode: "0644", content: "[Unit]\n"}

    - name: Scratch directory in place of the credentials file
      ansible.builtin.file:
        path: "{{ ai_stack_test_tmp.path }}/cred-dir"
        state: directory
        mode: "0700"

    - name: Who runs the tests (owner of the scratch files)
      ansible.builtin.stat:
        path: "{{ ai_stack_test_tmp.path }}/cred-0600"
      register: ai_stack_test_cred_stat

    - name: Credentials preflight cases
      ansible.builtin.include_tasks: prereq_case.yml
      loop:
        - {name: good, cred: cred-0600, wait: wait.service, owner: "{{ ai_stack_test_cred_stat.stat.pw_name }}", ok: true}
        - {name: wrong-owner, cred: cred-0600, wait: wait.service, owner: root, ok: false}
        - {name: mode-0644, cred: cred-0644, wait: wait.service, owner: "{{ ai_stack_test_cred_stat.stat.pw_name }}", ok: false}
        - {name: missing, cred: nope, wait: wait.service, owner: "{{ ai_stack_test_cred_stat.stat.pw_name }}", ok: false}
        - {name: a-directory, cred: cred-dir, wait: wait.service, owner: "{{ ai_stack_test_cred_stat.stat.pw_name }}", ok: false}
        - {name: no-wait-unit, cred: cred-0600, wait: nope.service, owner: "{{ ai_stack_test_cred_stat.stat.pw_name }}", ok: false}
      loop_control:
        loop_var: prereq_case
        label: "{{ prereq_case.name }}"

    - name: The skills verify reads the container first, the host second, and retries once (outside check mode)
      vars:
        vs_tasks: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/verify_skills.yml') | from_yaml }}"
        vs_block: "{{ vs_tasks[0].block }}"
        vs_rescue: "{{ vs_tasks[0].rescue }}"
        vs_modules: >-
          {%- set out = [] -%}
          {%- for t in vs_block + vs_rescue -%}
          {%- set _ = out.append(t.keys() | select('match', '^(ansible\.builtin|community\.docker)\.') | list | first | default('?')) -%}
          {%- endfor -%}
          {{ out }}
        probe_argv: ['systemctl', 'is-active', '--quiet', '{{ "{{" }} share.mount_unit {{ "}}" }}']
      ansible.builtin.assert:
        that:
          - vs_tasks | length == 3
          - vs_tasks[0].when == 'not ansible_check_mode'
          # §12.27: after the block, the read-write shares' local directories (lsattr, only while not mounted).
          - vs_tasks[1]['ansible.builtin.command'].argv == ['lsattr', '-d', '{{ "{{" }} item.share.view {{ "}}" }}']
          - vs_tasks[1].when == ['not ansible_check_mode', "item.share.mode | default('ro') == 'rw'", 'item.rc != 0']
          - vs_tasks[1].loop == '{{ "{{" }} ai_stack_ro_share_now.results | default([]) {{ "}}" }}'
          - vs_tasks[2]['ansible.builtin.include_tasks'] == 'verify_rw_failsafe_assert.yml'
          - vs_tasks[2].when == 'not ansible_check_mode'
          - vs_tasks[0].always is not defined
          # block and rescue: container table, host state, assert; same order, same probes.
          - vs_modules == ['community.docker.docker_container_exec', 'ansible.builtin.command', 'ansible.builtin.include_tasks'] * 2
          - vs_block[0]['community.docker.docker_container_exec'].container == 'open-webui'
          - vs_block[0]['community.docker.docker_container_exec'].argv == ['cat', '/proc/1/mountinfo']
          - vs_rescue[0]['community.docker.docker_container_exec'] == vs_block[0]['community.docker.docker_container_exec']
          - vs_block[1]['ansible.builtin.command'].argv == probe_argv
          - vs_rescue[1]['ansible.builtin.command'].argv == probe_argv
          - vs_block[2]['ansible.builtin.include_tasks'] == 'verify_skills_assert.yml'
          - vs_rescue[2]['ansible.builtin.include_tasks'] == 'verify_skills_assert.yml'
          # Every share: the probe loops over all of them, and the assert over every probe result.
          - vs_block[1].loop == '{{ "{{" }} ai_stack_ro_shares {{ "}}" }}' and vs_rescue[1].loop == vs_block[1].loop
          - vs_block[2].loop == '{{ "{{" }} ai_stack_ro_share_now.results {{ "}}" }}' and vs_rescue[2].loop == vs_block[2].loop
          - vs_block[2].loop_control.loop_var == 'share_now' and vs_rescue[2].loop_control.loop_var == 'share_now'
          # Only the probe may not fail; nothing ignores errors, nothing else is conditional.
          - (vs_block + vs_rescue) | selectattr('ignore_errors', 'defined') | list | length == 0
          - (vs_block + vs_rescue) | selectattr('when', 'defined') | list | length == 0
          - (vs_block + vs_rescue) | selectattr('failed_when', 'defined') | map(attribute='failed_when') | list == [false, false]
          - vs_rescue[2].rescue is not defined
        fail_msg: "{{ vs_modules | to_json }}"
        quiet: true

