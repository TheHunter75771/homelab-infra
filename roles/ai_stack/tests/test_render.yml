        case_expect_ok: false
        case_lines:
          - "1500 1400 8:1 /var/lib/docker/x /app/backend/data rw,relatime - ext4 /dev/sda1 rw"

    # ---- 1h. Document search (§12.22): the verify, the CPU pulls, the aliases -------------------------------
    - name: Count the role's execs of the settings checker
      ansible.builtin.command:
        argv: [grep, -r, -l, --include=*.yml, webui_extraction_config.py, "{{ ai_stack_test_role }}/tasks"]
      register: ai_stack_test_settings_execs
      changed_when: false

    - name: One settings exec per converge; the search check reads its result, reports, and asserts behind its gate
      vars:
        vs: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/verify_search.yml') | from_yaml }}"
        ve: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/verify_extraction.yml') | from_yaml }}"
        ve_execs: >-
          {%- set out = [] -%}
          {%- for t in ve -%}{%- if 'community.docker.docker_container_exec' in t -%}
          {%- set _ = out.append(t['community.docker.docker_container_exec']) -%}{%- endif -%}{%- endfor -%}
          {{ out }}
        settings_exec: "{{ ve_execs | selectattr('stdin', 'search', 'webui_extraction_config') | list }}"
        ve_includes: >-
          {%- set out = [] -%}
          {%- for t in ve -%}{%- if 'ansible.builtin.include_tasks' in t -%}
          {%- set _ = out.append({'file': t['ansible.builtin.include_tasks'], 'when': t.when | default('')}) -%}
          {%- endif -%}{%- endfor -%}
          {{ out }}
      ansible.builtin.assert:
        that:
          # verify_search.yml has no exec of its own; it reads the one settings exec's result.
          - vs | length == 1
          - vs[0]['ansible.builtin.include_tasks'] == 'verify_search_assert.yml'
          - vs[0].vars.ai_stack_webui_search == '{{ "{{" }} ai_stack_webui_extraction {{ "}}" }}'
          - vs[0].when == ['not ansible_check_mode', 'ai_embed_model is defined']
          - settings_exec | length == 1
          - settings_exec[0].container == 'open-webui'
          # The extraction checks on that result run whenever not in check mode.
          - ve | selectattr('ansible.builtin.include_tasks', 'defined') | list | length == 0
          - >-
            ve_includes == [{'file': 'verify_extraction_assert.yml', 'when': 'not ansible_check_mode'}]
          - settings_exec[0].argv == ['python3', '-', '{{ "{{" }} ai_stack_webui_settings_expected | to_json {{ "}}" }}']
          - ai_stack_test_settings_execs.stdout_lines | length == 1
          - ai_stack_webui_search_expected.keys() | sort
            == ['rag.embedding_engine', 'rag.embedding_model', 'rag.enable_hybrid_search', 'rag.ollama.base_url',
                'rag.reranking_model', 'rag.top_k']
          # §12.30: hybrid and the reranker are expected as the inventory says; today off and none.
          - ai_stack_webui_search_expected['rag.enable_hybrid_search'] is sameas false
          - ai_stack_webui_search_expected['rag.reranking_model'] == ''
          - ai_stack_webui_search_expected['rag.embedding_engine'] == 'ollama'
          - ai_stack_webui_search_expected['rag.embedding_model'] == ai_stack_embed_alias
          - ai_stack_webui_search_expected['rag.ollama.base_url'] == 'http://gpu-broker:11434'
          - ai_stack_webui_search_expected['rag.top_k'] | int == 8
          - ai_stack_webui_search_report.keys() | sort
            == ['rag.embedding_batch_size', 'rag.embedding_concurrent_requests', 'task.model.default']
          - ai_stack_webui_search_report['rag.embedding_concurrent_requests'] | int == 2
          - ai_stack_verify_search_settings is sameas false
        quiet: true

    - name: The one settings exec checks extraction always, and search only with an embedding model
