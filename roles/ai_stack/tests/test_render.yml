        - name: lsattr-failed
          ok: false
          results: [{rc: 1, stdout: "", item: {share: {view: /var/lib/homelab-ai/payday-runs}}}]
        - name: mounted-so-skipped
          ok: true
          results: [{skipped: true, item: {share: {view: /var/lib/homelab-ai/payday-runs}}}]
        - name: ro-shares-only
          ok: true
          results: []
      loop_control:
        loop_var: fs_case
        label: "{{ fs_case.name }}"

    - name: /skills ro check, no /skills at all fails
      ansible.builtin.include_tasks: skills_ro_case.yml
      vars:
        case_name: absent
