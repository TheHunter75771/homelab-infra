    # The extraction checks read only the extraction keys of the shared result (a search key that is wrong
    # must not fail them; the search check decides that behind its own gate).
    - name: Extraction settings check, per case
      ansible.builtin.include_tasks: extraction_case.yml
      loop:
        - {name: all-good, rc: 0, out: "{{ ai_stack_test_extraction_out.good }}", ok: true}
        - {name: search-key-wrong-only, rc: 1, out: "{{ ai_stack_test_extraction_out.search_wrong }}", ok: true}
        - {name: extraction-key-wrong, rc: 1, out: "{{ ai_stack_test_extraction_out.extraction_wrong }}", ok: false}
        - {name: extraction-key-missing, rc: 0, out: "{{ ai_stack_test_extraction_out.extraction_missing }}", ok: false}
        - {name: unreadable, rc: 2, out: "{{ ai_stack_test_extraction_out.unsupported }}", ok: false}
        - {name: crash, rc: 1, out: "", ok: false}
      loop_control:
        loop_var: extraction_case
        label: "{{ extraction_case.name }}"

    - name: Search settings check, gate-off-mismatch
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-off-mismatch
        case_rc: 1
        case_gate: false
        case_expect_ok: true
        case_stdout: "{{ ai_stack_test_search_out['bad_topk'] | to_json }}"

    - name: Search settings check, gate-off-unreadable
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-off-unreadable
        case_rc: 2
        case_gate: false
        case_expect_ok: true
        case_stdout: "{{ ai_stack_test_search_out['unsup'] | to_json }}"

    - name: Search settings check, gate-on-good
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-on-good
        case_rc: 0
        case_gate: true
        case_expect_ok: true
        case_stdout: "{{ ai_stack_test_search_out['good'] | to_json }}"

    - name: Search settings check, gate-on-top-k-trap
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-on-top-k-trap
        case_rc: 1
        case_gate: true
        case_expect_ok: false
        case_stdout: "{{ ai_stack_test_search_out['bad_topk'] | to_json }}"

    - name: Search settings check, gate-on-unreadable
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-on-unreadable
        case_rc: 2
        case_gate: true
        case_expect_ok: false
        case_stdout: "{{ ai_stack_test_search_out['unsup'] | to_json }}"

    - name: Search settings check, gate-on-report-key-only
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-on-report-key-only
        case_rc: 1
        case_gate: true
        case_expect_ok: true
        case_stdout: "{{ ai_stack_test_search_out['report_only'] | to_json }}"

    - name: Search settings check, gate-on-crash
      ansible.builtin.include_tasks: search_case.yml
      vars:
        case_name: gate-on-crash
        case_rc: 1
        case_gate: true
        case_expect_ok: false
        case_stdout: ""

    # The CPU pulls are the chat and the embedding model, each once, only when set. Task vars outrank the
    # inventory; vars/main.yml's expression is evaluated per case.
    - name: CPU pulls, per case
      ansible.builtin.assert:
        that:
          - ai_stack_cpu_pull_models == item.want
        fail_msg: "{{ item.name }}: {{ ai_stack_cpu_pull_models }}"
        quiet: true
      loop:
        - {name: both, cpu: qwen3:1.7b, embed: nomic-embed-text:v1.5, want: [qwen3:1.7b, nomic-embed-text:v1.5]}
        - {name: none, cpu: null, embed: null, want: []}
        - {name: cpu-only, cpu: qwen3:1.7b, embed: null, want: [qwen3:1.7b]}
        - {name: embed-only, cpu: null, embed: nomic-embed-text:v1.5, want: [nomic-embed-text:v1.5]}
        - {name: same-model, cpu: m:1, embed: m:1, want: ['m:1']}
      loop_control:
        label: "{{ item.name }}"
      vars:
        ai_cpu_model: "{{ item.cpu if item.cpu else undef(hint='unset') }}"
        ai_embed_model: "{{ item.embed if item.embed else undef(hint='unset') }}"

    - name: Models and preflight handle the embedding model
      vars:
        models: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/models.yml') | from_yaml }}"
        pf: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/preflight.yml') | from_yaml }}"
        alias_assert: "{{ (pf | selectattr('name', 'search', 'broker alias names') | first)['ansible.builtin.assert'].that }}"
        model_assert: "{{ (pf | selectattr('name', 'search', 'model variables') | first)['ansible.builtin.assert'].that }}"
      ansible.builtin.assert:
        that:
          - models | length == 2
          - models[0].loop == '{{ "{{" }} ai_stack_cpu_pull_models {{ "}}" }}'
          - models[0]['community.docker.docker_container_exec'].argv == ['ollama', 'show', '{{ "{{" }} item {{ "}}" }}']
          - models[0].failed_when is sameas false
          - models[1].loop == '{{ "{{" }} ai_stack_cpu_show.results {{ "}}" }}'
            or models[1].loop == '{{ "{{" }} ai_stack_cpu_model_show.results {{ "}}" }}'
          - models[1]['community.docker.docker_container_exec'].argv == ['ollama', 'pull', '{{ "{{" }} item.item {{ "}}" }}']
          - models[1].when == 'item.rc | default(1) != 0'
          - "'ai_stack_embed_alias != ai_stack_alias_name' in alias_assert"
          - alias_assert | select('search', 'ai_stack_embed_alias is match') | list | length == 1
          - model_assert | select('search', '^ai_embed_model is undefined or') | list | length == 1
        quiet: true

    # L-5: ai_embed_model must be in the gaming PC's ollama_rocm_extra_models (role ollama_rocm's names).
    - name: Embedding model on the gaming PC, per case
      ansible.builtin.include_tasks: embed_pc_case.yml
      loop:
        - {name: listed, embed: nomic-embed-text:v1.5, pc: gaming-pc-root, extra: [nomic-embed-text:v1.5], ok: true}
        - {name: normalised, embed: Library/Nomic-Embed-Text, pc: gaming-pc-root, extra: [nomic-embed-text:latest], ok: true}
        - {name: registry-prefix, embed: nomic-embed-text:v1.5, pc: gaming-pc-root,
           extra: [registry.ollama.ai/library/nomic-embed-text:v1.5], ok: true}
        - {name: other-tag, embed: nomic-embed-text:v1.5, pc: gaming-pc-root, extra: [nomic-embed-text], ok: false}
        - {name: pc-untagged, embed: nomic-embed-text:latest, pc: gaming-pc-root, extra: [nomic-embed-text], ok: true}
        - {name: not-listed, embed: nomic-embed-text:v1.5, pc: gaming-pc-root, extra: [], ok: false}
        - {name: no-pc-in-inventory, embed: nomic-embed-text:v1.5, pc: "", extra: [], ok: true}
        - {name: embed-unset, embed: "", pc: gaming-pc-root, extra: [], ok: true}
      loop_control:
        loop_var: embed_case
        label: "{{ embed_case.name }}"

    - name: The gaming PC's list is read through hostvars of the workstations_root host
      vars:
        pf_text: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/preflight.yml') }}"
        vars_doc: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/vars/main.yml') | from_yaml }}"
      ansible.builtin.assert:
        that:
          # This test runs without an inventory: no PC host, nothing read.
          - ai_stack_pc_host == ''
          - ai_stack_pc_extra_models == []
          - pf_text is search('import_tasks. embed_pc.yml')
          # The PC as roles/ai_control reads it (inventory/hosts.yml: workstations_root -> gaming-pc-root,
          # where group_vars/workstations_root sets ollama_rocm_extra_models).
          - vars_doc.ai_stack_pc_host is search("groups\\['workstations_root'\\]")
          - vars_doc.ai_stack_pc_extra_models is search('hostvars\\[ai_stack_pc_host\\]\\.ollama_rocm_extra_models')
        quiet: true

    # ---- 1i. Broker management lock-down (§12.23) -------------------------------------------------------
    - name: The pinned addresses and the broker's exported address
      vars:
        main: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/main.yml') | from_yaml }}"
        export: "{{ main | selectattr('name', 'search', '^Export the broker') | first }}"
        vb: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/verify_broker.yml') | from_yaml }}"
        probe: "{{ vb[0]['ansible.builtin.uri'] }}"
      ansible.builtin.assert:
        that:
          - >-
            ai_stack_pinned_ips == {'ollama-cpu': '172.20.0.2', 'gpu-broker': '172.20.0.3', 'open-webui': '172.20.0.4'}
          - ai_stack_network_subnet | ai_stack_pinned_ip_problems(ai_stack_pinned_ips) == []
          - ai_stack_broker_config.management_clients == [ai_stack_webui_ip]
          # Exported for the other roles (a host fact, so later plays read it through hostvars).
          - export['ansible.builtin.set_fact'].ai_stack_broker_ip == '{{ "{{" }} ai_stack_broker_ip {{ "}}" }}'
          - export['ansible.builtin.set_fact'].cacheable is sameas true
          - export.when is not defined
          # The push probe: from the host, through the published port, a model that can't exist, 403 only.
          - vb | length == 2
          - probe.url == 'http://{{ "{{" }} tailnet_ip {{ "}}" }}:{{ "{{" }} ai_stack_broker_port {{ "}}" }}/api/push'
          - probe.method == 'POST'
          - probe.body.model == '{{ "{{" }} ai_stack_broker_probe_model {{ "}}" }}'
          - ai_stack_broker_probe_model is search('does-not-exist')
          - vb[0].when == 'not ansible_check_mode' and vb[1].when == 'not ansible_check_mode'
          - vb[1]['ansible.builtin.assert'].that
            == ['ai_stack_broker_push.status | default(-1) == 403',
                "'/api/push is disabled' in (ai_stack_broker_push.content | default(''))"]
          - probe.return_content is sameas true
        quiet: true

    - name: The network tasks check the pins (and who holds them) before the network task
      vars:
        nt: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/networks.yml') | from_yaml }}"
        names: "{{ nt | map(attribute='name') | list }}"
        fit: "{{ nt | selectattr('name', 'search', 'pinned container addresses fit') | first }}"
        held: "{{ nt | selectattr('name', 'search', 'no other container holds') | first }}"
        members: "{{ nt | selectattr('name', 'search', 'containers on the .ai. network now') | first }}"
        gw_read: "{{ nt | selectattr('name', 'search', 'gateway now') | first }}"
        gw: "{{ nt | selectattr('name', 'search', 'is the live gateway') | first }}"
      ansible.builtin.assert:
        that:
          - fit.vars.ai_stack_pin_issues
            == '{{ "{{" }} ai_stack_network_subnet | ai_stack_pinned_ip_problems(ai_stack_pinned_ips) {{ "}}" }}'
          - fit['ansible.builtin.assert'].that == 'ai_stack_pin_issues | length == 0'
          - held.vars.ai_stack_pin_clashes is search('ai_stack_pinned_ip_holders\\(ai_stack_pinned_ips\\)')
          - held['ansible.builtin.assert'].that == 'ai_stack_pin_clashes | length == 0'
          - members['ansible.builtin.command'].argv[:4] == ['docker', 'network', 'inspect', '{{ "{{" }} ai_stack_network_name {{ "}}" }}']
          - fit.when is not defined and held.when is not defined
          - names.index(fit.name) < names.index(held.name) < names | length - 1
          # No pin (open-webui's included) is the live gateway: tasks/gateway_assert.yml, cases below.
          - gw['ansible.builtin.include_tasks'] == 'gateway_assert.yml'
          - gw_read['ansible.builtin.command'].argv[-1] is search('Gateway')
          - names.index(gw_read.name) < names.index(gw.name) < names | length - 1
          - gw.when is not defined
        quiet: true

    - name: The fixed keys are refused in ai_stack_ollama_env, per case (the role's preflight check)
      ansible.builtin.include_tasks: ollama_env_case.yml
      loop:
        - {name: role-default, env: "{{ ai_stack_ollama_env }}", ok: true}
        - {name: empty, env: {}, ok: true}
        - {name: no-cloud-0, env: {OLLAMA_KEEP_ALIVE: 10m, OLLAMA_NO_CLOUD: "0"}, ok: false}
        - {name: no-cloud-1, env: {OLLAMA_NO_CLOUD: "1"}, ok: false}
        - {name: host, env: {OLLAMA_HOST: "0.0.0.0:11434"}, ok: false}
        - {name: not-a-mapping, env: [OLLAMA_KEEP_ALIVE], ok: false}
      loop_control:
        loop_var: env_case
        label: "{{ env_case.name }}"

    - name: The preflight runs that check
      ansible.builtin.assert:
        that:
          - >-
            lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/preflight.yml')
            is search('import_tasks. ollama_env_check.yml')
        quiet: true

    - name: Render compose.yaml with an empty ai_stack_ollama_env (an override can't drop OLLAMA_NO_CLOUD)
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/compose.yaml.j2"
        dest: "{{ ai_stack_test_tmp.path }}/compose-noenv.yaml"
        mode: "0644"
      vars:
        ai_stack_ollama_env: {}
        ai_stack_tika_config_template: "{{ ai_stack_test_role }}/templates/tika-config.xml.j2"

    - name: OLLAMA_NO_CLOUD survives an empty ai_stack_ollama_env
      ansible.builtin.assert:
        that:
          - >-
            (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/compose-noenv.yaml') | from_yaml)
            .services['ollama-cpu'].environment == {'OLLAMA_NO_CLOUD': '1'}
        quiet: true

    - name: No pinned address is the live gateway, per case
      ansible.builtin.include_tasks: gateway_case.yml
      loop:
        - {name: default-gateway, gateway: '172.20.0.1 ', pins: {gpu-broker: 172.20.0.3, open-webui: 172.20.0.4}, ok: true}
        - {name: no-network-yet, gateway: '', pins: {gpu-broker: 172.20.0.3, open-webui: 172.20.0.4}, ok: true}
        - {name: webui-on-odd-gateway, gateway: '172.20.0.254 ', pins: {gpu-broker: 172.20.0.3, open-webui: 172.20.0.254},
           ok: false}
        - {name: broker-on-odd-gateway, gateway: '172.20.0.254 ', pins: {gpu-broker: 172.20.0.254, open-webui: 172.20.0.4},
           ok: false}
        - {name: two-gateways, gateway: '172.20.0.1 172.20.0.4 ', pins: {open-webui: 172.20.0.4}, ok: false}
      loop_control:
        loop_var: gw_case
        label: "{{ gw_case.name }}"

    - name: Compose runs compose.yaml alone, and an override file in the stack dir is refused
      vars:
        st: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/stack.yml') | from_yaml }}"
        up: "{{ (st[0].block | selectattr('name', 'equalto', 'Stack is up and healthy') | first)['community.docker.docker_compose_v2'] }}"
        mt: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/main.yml') | from_yaml }}"
        finder: "{{ (mt | selectattr('name', 'search', 'look for Compose override files') | first)['ansible.builtin.find'] }}"
        guard: "{{ mt | selectattr('name', 'search', 'no other Compose file') | first }}"
        names: "{{ mt | map(attribute='name') | list }}"
        helper: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/templates/homelab-ai-stack-start.sh.j2') }}"
      ansible.builtin.assert:
        that:
          - up.files == ['compose.yaml']
          - "'compose.override.yaml' in finder.patterns and 'compose.override.yml' in finder.patterns"
          - "'docker-compose.override.yaml' in finder.patterns and 'docker-compose.override.yml' in finder.patterns"
          - finder.paths == '{{ "{{" }} ai_stack_dir {{ "}}" }}'
          - guard['ansible.builtin.assert'].that == ['ai_stack_compose_overrides.files | length == 0']
          - guard.when is not defined
          - names.index(guard.name) < names.index('Stack up, bindings healed, under the stack lock')
          # The boot helper's compose call names the file too (-f), so it never merges an override either.
          - helper is search('docker compose -f "\\$COMPOSE_FILE" up')
        quiet: true

    # ---- 1j. Pre-seeded rerankers (§12.30) -----------------------------------------------------------
    - name: The pinned models, the seed folder, the binds and the seeding tasks
      vars:
        hf: "{{ lookup('ansible.builtin.file', ai_stack_test_role ~ '/tasks/hf_models.yml') | from_yaml }}"
        names: "{{ hf | map(attribute='name') | list }}"
        fetch: "{{ (hf | selectattr('name', 'search', 'fetch the missing') | first) }}"
        verify: "{{ (hf | selectattr('name', 'search', 'every fetched file') | first) }}"
        drop: "{{ (hf | selectattr('name', 'search', 'loses refs/main first') | first) }}"
        refs: "{{ (hf | selectattr('name', 'search', 'refs/main names') | first) }}"
        # The key has dots, so no map(attribute=...): a loop reads it.
        stats: >-
          {%- set out = [] -%}
          {%- for t in hf -%}{%- if 'ansible.builtin.stat' in t -%}{%- set _ = out.append(t['ansible.builtin.stat']) -%}{%- endif -%}{%- endfor -%}
          {{ out }}
        modules: >-
          {%- set out = [] -%}
          {%- for t in hf -%}{%- set _ = out.append((t.keys() | select('match', '^ansible[.]builtin[.]') | first)) -%}{%- endfor -%}
          {{ out }}
      ansible.builtin.assert:
        that:
          # R16-3: the canonical names (Hugging Face renamed ms-marco-MiniLM-L-6-v2; same commit and files).
          - ai_stack_hf_models | map(attribute='repo') | list == ['cross-encoder/ms-marco-MiniLM-L6-v2', 'BAAI/bge-reranker-base']
          - ai_stack_hf_models[0].revision == '233902d25c440f23af6f7d6e94d2946bac0bee0a'
          - ai_stack_hf_models[1].revision == '2cfc18c9415c912f9d8155881c133215df768a70'
          # The weights (Hugging Face's LFS SHA-256 at the pinned revision).
          - >-
            (ai_stack_hf_models[0].files | selectattr('name', 'equalto', 'model.safetensors') | first).sha256
            == '821d1aa69520101d6e0737f78a042ae25b19e5cb9160701909d10434f4aeb0ae'
          - >-
            (ai_stack_hf_models[1].files | selectattr('name', 'equalto', 'model.safetensors') | first).sha256
            == 'ced967c45fd1902eb92716c9ceeca7c95a936770ea9db611f5a841b926e33fbd'
          - ai_stack_hf_model_dirs == ['models--cross-encoder--ms-marco-MiniLM-L6-v2', 'models--BAAI--bge-reranker-base']
          # R16-1: root's folder on the host, outside Docker's volumes; bound read-only into open-webui's cache.
          - ai_stack_hf_seed_dir == '/var/lib/homelab-ai/hf-models'
          - ai_stack_hf_owner == 'root' and ai_stack_hf_group == 'root'
          - ai_stack_hf_container_cache == '/app/backend/data/cache/embedding/models'
          - ai_stack_hf_base_url == 'https://huggingface.co'
          - ai_stack_hf_dirs[:2] == ['/var/lib/homelab-ai', '/var/lib/homelab-ai/hf-models']
          - ai_stack_hf_files | length == 12
          - >-
            ai_stack_hf_files[1].path == '/var/lib/homelab-ai/hf-models/models--cross-encoder--ms-marco-MiniLM-L6-v2/snapshots/'
            ~ '233902d25c440f23af6f7d6e94d2946bac0bee0a/model.safetensors'
          # Nothing in the seeding names Docker or a volume (R16-4: the volume mount-point assert is gone with it).
          - hf | to_json is not search('docker|volume')
          # Every stat looks at the link itself; the file stats hash with SHA-256.
          - stats | map(attribute='follow') | list == [false] * 4
          - stats | selectattr('get_checksum') | map(attribute='checksum_algorithm') | list == ['sha256'] * 2
          # Fetched with the pinned hash checked (get_url), from the pinned revision only, then hashed again.
          - fetch['ansible.builtin.get_url'].checksum == 'sha256:{{ "{{" }} item.sha256 {{ "}}" }}'
          - >-
            fetch['ansible.builtin.get_url'].url is match('^[{][{] ai_stack_hf_base_url [}][}]/[{][{] item.repo [}][}]/'
            ~ 'resolve/[{][{] item.revision [}][}]/[{][{] item.name [}][}]$')
          - fetch['ansible.builtin.get_url'].dest == '{{ "{{" }} item.path {{ "}}" }}'
          - fetch['ansible.builtin.get_url'].force is not defined
          - fetch['ansible.builtin.get_url'].mode == '0644'
          - fetch.loop == '{{ "{{" }} ai_stack_hf_fetch {{ "}}" }}'
          - verify['ansible.builtin.assert'].that is contains('item.stat.checksum == item.item.sha256')
          - verify.when == 'not ansible_check_mode'
          - (hf | selectattr('name', 'search', 'hash the fetched files again') | first).when == 'not ansible_check_mode'
          - refs.when is not defined
          # R16-5: refs/main dropped before any download, written last.
          - drop['ansible.builtin.file'].state == 'absent'
          - drop.loop is search('ai_stack_hf_stale [|] map[(]attribute=.dir.[)] [|] unique')
          - names.index(drop.name) < names.index(fetch.name) < names.index(verify.name) < names.index(refs.name)
          - names[-1] == refs.name
          - refs['ansible.builtin.copy'].content == '{{ "{{" }} item.revision {{ "}}" }}'
          - modules | select('match', '^ansible[.]builtin[.](command|shell|raw)$') | list | length == 0
        fail_msg: "{{ [names, modules, stats] | to_json }}"
        quiet: true

    - name: A well-formed sample model for the preflight cases
      ansible.builtin.set_fact:
        ai_stack_test_hf_sample:
          repo: org/model
          revision: cccccccccccccccccccccccccccccccccccccccc
          files:
            - {name: config.json, size: 1, sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
            - {name: model.safetensors, size: 2, sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}

    - name: Pinned models and the expected reranker, per case (the role's preflight)
      ansible.builtin.include_tasks: hf_case.yml
      loop:
        - {name: role-default, models: "{{ ai_stack_hf_models }}", reranker: "", ok: true}
        - {name: e2-minilm, models: "{{ ai_stack_hf_models }}", reranker: cross-encoder/ms-marco-MiniLM-L6-v2,
           hybrid: true, ok: true}
        # The old name (Hugging Face redirects it) isn't the pinned one: refused.
        - {name: e2-old-name, models: "{{ ai_stack_hf_models }}", reranker: cross-encoder/ms-marco-MiniLM-L-6-v2, ok: false}
        - {name: e3-bge, models: "{{ ai_stack_hf_models }}", reranker: BAAI/bge-reranker-base, hybrid: true, ok: true}
        - {name: unseeded-reranker, models: "{{ ai_stack_hf_models }}", reranker: BAAI/bge-reranker-large, ok: false}
        - {name: good-sample, models: "{{ [ai_stack_test_hf_sample] }}", reranker: "", ok: true}
        - {name: short-revision, models: "{{ [ai_stack_test_hf_sample | combine({'revision': 'main'})] }}", reranker: "", ok: false}
        - name: dotdot-repo
          models: "{{ [ai_stack_test_hf_sample | combine({'repo': 'org/..x'})] }}"
          reranker: ""
          ok: false
        # Passes the name pattern but holds '..' (Hugging Face refuses such names anyway).
        - name: dotdot-inside-repo
          models: "{{ [ai_stack_test_hf_sample | combine({'repo': 'org/x..y'})] }}"
          reranker: ""
          ok: false
        - name: repo-without-org
          models: "{{ [ai_stack_test_hf_sample | combine({'repo': 'model'})] }}"
          reranker: ""
          ok: false
        - name: bad-sha
          models: >-
            {{ [ai_stack_test_hf_sample | combine({'files': [ai_stack_test_hf_sample.files[0] | combine({'sha256': 'xyz'}),
                                                         ai_stack_test_hf_sample.files[1]]})] }}
          reranker: ""
          ok: false
        - name: path-in-file-name
          models: >-
            {{ [ai_stack_test_hf_sample | combine({'files': [ai_stack_test_hf_sample.files[0] | combine({'name': '../config.json'}),
                                                         ai_stack_test_hf_sample.files[1]]})] }}
          reranker: ""
          ok: false
        # A third file with a path in its name (config and weights are fine): only the name check catches it.
        - name: extra-file-with-path
          models: >-
            {{ [ai_stack_test_hf_sample | combine({'files': ai_stack_test_hf_sample.files
                                         + [{'name': '../evil', 'size': 1, 'sha256': 'dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd'}]})] }}
          reranker: ""
          ok: false
        - {name: no-weights, models: "{{ [ai_stack_test_hf_sample | combine({'files': ai_stack_test_hf_sample.files[:1]})] }}", reranker: "", ok: false}
        - {name: duplicate-repo, models: "{{ [ai_stack_test_hf_sample, ai_stack_test_hf_sample] }}", reranker: "", ok: false}
        # R16-1: the seed folder is a plain absolute path with a parent below /, never under Docker's folders.
        - {name: seed-elsewhere, models: [], reranker: "", seed_dir: /srv/hf/models, ok: true}
        - {name: seed-in-docker-volumes, models: [], reranker: "", seed_dir: /var/lib/docker/volumes/ai_open-webui-data/_data, ok: false}
        - {name: seed-is-docker-dir, models: [], reranker: "", seed_dir: /var/lib/docker, ok: false}
        - {name: seed-relative, models: [], reranker: "", seed_dir: var/lib/homelab-ai/hf-models, ok: false}
        - {name: seed-top-level, models: [], reranker: "", seed_dir: /hf-models, ok: false}
        - {name: seed-trailing-slash, models: [], reranker: "", seed_dir: /var/lib/homelab-ai/hf-models/, ok: false}
        - {name: seed-dotdot, models: [], reranker: "", seed_dir: /var/lib/homelab-ai/../docker/x, ok: false}
        - {name: seed-not-a-string, models: [], reranker: "", seed_dir: [/var/lib/homelab-ai/hf-models], ok: false}
        - {name: cache-relative, models: [], reranker: "", cache: app/backend/data/cache, ok: false}
        - {name: cache-dotdot, models: [], reranker: "", cache: /app/backend/data/../../etc, ok: false}
        - {name: cache-not-a-string, models: [], reranker: "", cache: [/app], ok: false}
      loop_control:
        loop_var: hf_case
        label: "{{ hf_case.name }}"

    # ---- 1k. Seeding (§12.30, R16): a scratch seed folder, a local server in place of huggingface.co ------
    - name: HF seed | the test user's groups
      ansible.builtin.command:
        argv: [id, -Gn]
      register: ai_stack_test_hf_groups
      changed_when: false

    # The seeding's group is a supplementary group of the test user where there is one, so owner and group
    # differ by name (as root:root can't show).
    - name: HF seed | two sample models, the scratch seed folder, and who owns it
      ansible.builtin.set_fact:
        ai_stack_test_hf_seed: "{{ ai_stack_test_tmp.path }}/hf-parent/hf-models"
        ai_stack_test_hf_user: "{{ ai_stack_test_cred_stat.stat.pw_name }}"
        ai_stack_test_hf_group: >-
          {{ (ai_stack_test_hf_groups.stdout.split() | reject('equalto', ai_stack_test_cred_stat.stat.gr_name) | list
              + [ai_stack_test_cred_stat.stat.gr_name]) | first }}
        ai_stack_test_hf_content:
          org/model-a/config.json: config-a
          org/model-a/model.safetensors: weights-a
          org/model-b/config.json: config-b
          org/model-b/model.safetensors: weights-b
        ai_stack_test_hf_models:
          - repo: org/model-a
            revision: "{{ 'a' * 40 }}"
            files:
              - {name: config.json, size: 8, sha256: "{{ 'config-a' | hash('sha256') }}"}
              - {name: model.safetensors, size: 9, sha256: "{{ 'weights-a' | hash('sha256') }}"}
          - repo: org/model-b
            revision: "{{ 'b' * 40 }}"
            files:
              - {name: config.json, size: 8, sha256: "{{ 'config-b' | hash('sha256') }}"}
              - {name: model.safetensors, size: 9, sha256: "{{ 'weights-b' | hash('sha256') }}"}

    - name: HF seed | where each file and refs/main lands
      vars:
        a_dir: "{{ ai_stack_test_hf_seed }}/models--org--model-a"
        b_dir: "{{ ai_stack_test_hf_seed }}/models--org--model-b"
      ansible.builtin.set_fact:
        ai_stack_test_hf_paths:
          a_cfg: "{{ a_dir }}/snapshots/{{ 'a' * 40 }}/config.json"
          a_w: "{{ a_dir }}/snapshots/{{ 'a' * 40 }}/model.safetensors"
          a_ref: "{{ a_dir }}/refs/main"
          b_cfg: "{{ b_dir }}/snapshots/{{ 'b' * 40 }}/config.json"
          b_w: "{{ b_dir }}/snapshots/{{ 'b' * 40 }}/model.safetensors"
          b_ref: "{{ b_dir }}/refs/main"
        ai_stack_test_hf_dirs:
          - "{{ ai_stack_test_tmp.path }}/hf-parent"
          - "{{ ai_stack_test_hf_seed }}"
          - "{{ a_dir }}"
          - "{{ a_dir }}/refs"
          - "{{ a_dir }}/snapshots"
          - "{{ a_dir }}/snapshots/{{ 'a' * 40 }}"

    - name: HF seed | the role's file and folder lists for the samples
      vars:
        ai_stack_hf_models: "{{ ai_stack_test_hf_models }}"
        ai_stack_hf_seed_dir: "{{ ai_stack_test_hf_seed }}"
      ansible.builtin.assert:
        that:
          - ai_stack_hf_files | map(attribute='path') | list
            == [ai_stack_test_hf_paths.a_cfg, ai_stack_test_hf_paths.a_w, ai_stack_test_hf_paths.b_cfg, ai_stack_test_hf_paths.b_w]
          - ai_stack_hf_files | map(attribute='dir') | unique | list == ['models--org--model-a', 'models--org--model-b']
          - ai_stack_hf_dirs[:6] == ai_stack_test_hf_dirs
          - ai_stack_hf_dirs | length == 10
          - ai_stack_hf_dirs[6:] | map('regex_replace', 'model-b', 'model-a') | map('regex_replace', 'b{40}', 'a' * 40) | list
            == ai_stack_test_hf_dirs[2:]
        fail_msg: "{{ [ai_stack_hf_files, ai_stack_hf_dirs] | to_json }}"
        quiet: true

    - name: HF seed | the served files' folders
      ansible.builtin.file:
        path: "{{ ai_stack_test_tmp.path }}/hf-srv/{{ item.repo }}/resolve/{{ item.revision }}"
        state: directory
        mode: "0755"
      loop: "{{ ai_stack_test_hf_models }}"
      loop_control:
        label: "{{ item.repo }}"

    - name: HF seed | the served files
      ansible.builtin.copy:
        content: "{{ ai_stack_test_hf_content[item.0.repo ~ '/' ~ item.1.name] }}"
        dest: "{{ ai_stack_test_tmp.path }}/hf-srv/{{ item.0.repo }}/resolve/{{ item.0.revision }}/{{ item.1.name }}"
        mode: "0644"
      loop: "{{ ai_stack_test_hf_models | subelements('files') }}"
      loop_control:
        label: "{{ item.0.repo }}/{{ item.1.name }}"

    - name: HF seed | the seed folder's parent (the test user's, 0755)
      ansible.builtin.file:
        path: "{{ ai_stack_test_tmp.path }}/hf-parent"
        state: directory
        mode: "0755"

    - name: HF seed | a free local port
      ansible.builtin.command:
        argv: [python3, -c, "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])"]
      register: ai_stack_test_hf_port
      changed_when: false

    - name: HF seed | the stand-in server, and the cases (it is stopped at the end, whatever happens)
      vars:
        ai_stack_test_hf_url: "http://127.0.0.1:{{ ai_stack_test_hf_port.stdout }}"
        ai_stack_test_hf_pidfile: "{{ ai_stack_test_tmp.path }}/hf-srv.pid"
        ai_stack_test_hf_playbook: "{{ ansible_playbook_python | dirname }}/ansible-playbook"
        ai_stack_test_hf_check_env:
          ANSIBLE_STDOUT_CALLBACK: ansible.posix.json
          ANSIBLE_NOCOLOR: "1"
        ai_stack_test_hf_check_argv:
          - "{{ ai_stack_test_hf_playbook }}"
          - -i
          - localhost,
          - -c
          - local
          - --check
          - "{{ ai_stack_test_role }}/tests/hf_check_play.yml"
          - -e
          - "@{{ ai_stack_test_tmp.path }}/hf-check-vars.json"
      block:
        # timeout(1) is the backstop if the play dies before the always: below.
        - name: HF seed | start the stand-in server
          ansible.builtin.shell:
            cmd: >-
              echo $$ > {{ ai_stack_test_hf_pidfile | quote }} &&
              exec timeout 600 python3 -m http.server --bind 127.0.0.1
              --directory {{ (ai_stack_test_tmp.path ~ '/hf-srv') | quote }} {{ ai_stack_test_hf_port.stdout }}
              > {{ (ai_stack_test_tmp.path ~ '/hf-srv.log') | quote }} 2>&1
          async: 600
          poll: 0
          changed_when: false

        - name: HF seed | the server answers
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ ai_stack_test_hf_port.stdout | int }}"
            timeout: 20

        - name: HF seed | vars for the nested check runs
          ansible.builtin.copy:
            content: >-
              {{ {'ai_stack_hf_models': ai_stack_test_hf_models, 'ai_stack_hf_seed_dir': ai_stack_test_hf_seed,
                  'ai_stack_hf_owner': ai_stack_test_hf_user, 'ai_stack_hf_group': ai_stack_test_hf_group,
                  'ai_stack_hf_base_url': ai_stack_test_hf_url} | to_json }}
            dest: "{{ ai_stack_test_tmp.path }}/hf-check-vars.json"
            mode: "0600"

        - name: HF seed | a check run on a fresh host passes (nothing to fetch into yet)
          ansible.builtin.command:
            argv: "{{ ai_stack_test_hf_check_argv }}"
            chdir: "{{ ai_stack_test_repo }}"
          environment: "{{ ai_stack_test_hf_check_env }}"
          register: ai_stack_test_hf_check_fresh
          changed_when: false

        - name: HF seed | look for the seed folder after the check run
          ansible.builtin.stat:
            path: "{{ ai_stack_test_hf_seed }}"
          register: ai_stack_test_hf_seed_after_check

        - name: HF seed | the check run created nothing
          ansible.builtin.assert:
            that:
              - not ai_stack_test_hf_seed_after_check.stat.exists
              - (ai_stack_test_hf_check_fresh.stdout | from_json).stats.localhost.failures == 0
            fail_msg: "{{ (ai_stack_test_hf_check_fresh.stdout | from_json).stats | to_json }}"
            quiet: true

        - name: HF seed | first run seeds both models
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: fresh, ok: true}

        - name: HF seed | every file has its pinned content, 0644; refs/main names the revision
          ansible.builtin.assert:
            that:
              - hf_on_disk.a_cfg.checksum == 'config-a' | hash('sha256')
              - hf_on_disk.a_w.checksum == 'weights-a' | hash('sha256')
              - hf_on_disk.b_cfg.checksum == 'config-b' | hash('sha256')
              - hf_on_disk.b_w.checksum == 'weights-b' | hash('sha256')
              - hf_on_disk.a_ref.checksum == ('a' * 40) | hash('sha256')
              - hf_on_disk.b_ref.checksum == ('b' * 40) | hash('sha256')
              - hf_on_disk.values() | map(attribute='mode') | unique | list == ['0644']
              - hf_on_disk.values() | map(attribute='islnk') | unique | list == [false]
              - hf_on_disk.values() | map(attribute='pw_name') | unique | list == [ai_stack_test_hf_user]
              - hf_on_disk.values() | map(attribute='gr_name') | unique | list == [ai_stack_test_hf_group]
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        - name: HF seed | the folders are 0755
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop: "{{ ai_stack_test_hf_dirs[1:] }}"
          register: ai_stack_test_hf_dir_modes

        - name: HF seed | each folder is a real directory, 0755, in the seeding's group
          ansible.builtin.assert:
            that:
              - ai_stack_test_hf_dir_modes.results | map(attribute='stat.mode') | unique | list == ['0755']
              - ai_stack_test_hf_dir_modes.results | map(attribute='stat.isdir') | unique | list == [true]
              - ai_stack_test_hf_dir_modes.results | map(attribute='stat.gr_name') | unique | list == [ai_stack_test_hf_group]
            quiet: true

        - name: HF seed | a check run on the complete seed changes nothing
          ansible.builtin.command:
            argv: "{{ ai_stack_test_hf_check_argv }}"
            chdir: "{{ ai_stack_test_repo }}"
          environment: "{{ ai_stack_test_hf_check_env }}"
          register: ai_stack_test_hf_check_full
          changed_when: false

        - name: HF seed | nothing would change
          vars:
            stats: "{{ (ai_stack_test_hf_check_full.stdout | from_json).stats.localhost }}"
          ansible.builtin.assert:
            that:
              - stats.changed == 0
              - stats.failures == 0
            fail_msg: "{{ stats | to_json }}"
            quiet: true

        # R16-5: model-a's weights differ, and the server's copy differs from the pin too, so the fetch fails.
        # refs/main must be gone already (removed before any download); model-b keeps its refs/main untouched.
        - name: HF seed | model-a's weights tampered with locally, the server's copy wrong as well
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.dest }}"
            mode: "0644"
          loop:
            - {dest: "{{ ai_stack_test_hf_paths.a_w }}", content: tampered}
            - {dest: "{{ ai_stack_test_tmp.path }}/hf-srv/org/model-a/resolve/{{ 'a' * 40 }}/model.safetensors", content: wrong}
          loop_control:
            label: "{{ item.dest | basename }}"

        - name: HF seed | both refs/main dated 2001 (a rewrite shows)
          ansible.builtin.file:
            path: "{{ item }}"
            state: file
            modification_time: "200101010000.00"
            modification_time_format: "%Y%m%d%H%M.%S"
          loop:
            - "{{ ai_stack_test_hf_paths.a_ref }}"
            - "{{ ai_stack_test_hf_paths.b_ref }}"

        - name: HF seed | the fetch fails on the hash
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: wrong-download, ok: false, error: did not match}

        - name: HF seed | model-a has no refs/main and its bad download never landed; model-b is untouched
          ansible.builtin.assert:
            that:
              - not hf_on_disk.a_ref.exists
              - hf_on_disk.a_w.checksum == 'tampered' | hash('sha256')
              - hf_on_disk.a_cfg.checksum == 'config-a' | hash('sha256')
              - hf_on_disk.b_ref.checksum == ('b' * 40) | hash('sha256')
              - (hf_on_disk.b_ref.mtime | int) < 1000000000
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        - name: HF seed | the server has the right weights again
          ansible.builtin.copy:
            content: weights-a
            dest: "{{ ai_stack_test_tmp.path }}/hf-srv/org/model-a/resolve/{{ 'a' * 40 }}/model.safetensors"
            mode: "0644"

        - name: HF seed | the next run fetches them and writes refs/main again
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: repaired, ok: true}

        - name: HF seed | model-a complete again; model-b's refs/main still from 2001 (never removed)
          ansible.builtin.assert:
            that:
              - hf_on_disk.a_w.checksum == 'weights-a' | hash('sha256')
              - hf_on_disk.a_w.mode == '0644'
              - hf_on_disk.a_ref.checksum == ('a' * 40) | hash('sha256')
              - (hf_on_disk.b_ref.mtime | int) < 1000000000
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        # A check run where model-b's config.json is gone and its refs/main is stale: it reports exactly those
        # (a HEAD for the file, refs/main for model-b) and changes nothing.
        - name: HF seed | model-b's config.json gone, its refs/main says old
          ansible.builtin.copy:
            content: old
            dest: "{{ ai_stack_test_hf_paths.b_ref }}"
            mode: "0644"

        - name: HF seed | remove model-b's config.json
          ansible.builtin.file:
            path: "{{ ai_stack_test_hf_paths.b_cfg }}"
            state: absent

        - name: HF seed | a check run on the stale seed
          ansible.builtin.command:
            argv: "{{ ai_stack_test_hf_check_argv }}"
            chdir: "{{ ai_stack_test_repo }}"
          environment: "{{ ai_stack_test_hf_check_env }}"
          register: ai_stack_test_hf_check_stale
          changed_when: false

        - name: HF seed | what is on disk after the check run
          ansible.builtin.include_tasks: hf_seed_state.yml

        - name: HF seed | the check run reports the fetch and the refs/main for model-b only, and writes nothing
          vars:
            run: "{{ ai_stack_test_hf_check_stale.stdout | from_json }}"
            fetch: "{{ run.plays[0].tasks | selectattr('task.name', 'search', 'fetch the missing') | first }}"
            refs: "{{ run.plays[0].tasks | selectattr('task.name', 'search', 'refs/main names') | first }}"
          ansible.builtin.assert:
            that:
              - run.stats.localhost.failures == 0
              - fetch.hosts.localhost.results | selectattr('changed') | map(attribute='item.path') | list == [ai_stack_test_hf_paths.b_cfg]
              - refs.hosts.localhost.results | selectattr('changed') | map(attribute='item.repo') | list == ['org/model-b']
              - not hf_on_disk.b_cfg.exists
              - hf_on_disk.b_ref.checksum == 'old' | hash('sha256')
            fail_msg: "{{ [run.stats, hf_on_disk] | to_json }}"
            quiet: true

        # A missing file (gone since the check run above): model-b gets it back and a new refs/main.
        - name: HF seed | the next run fetches it
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: missing-file, ok: true}

        - name: HF seed | model-b complete, its refs/main rewritten
          ansible.builtin.assert:
            that:
              - hf_on_disk.b_cfg.checksum == 'config-b' | hash('sha256')
              - hf_on_disk.b_ref.checksum == ('b' * 40) | hash('sha256')
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        # Only the mode or group is off (the hash matches): fixed in place, no download, refs/main kept. The
        # group case needs a second group of the test user (a no-op without one).
        - name: HF seed | model-a's config.json group-writable, model-b's weights in another group, both refs/main dated 2001
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: file
            mode: "{{ item.mode }}"
            group: "{{ item.group }}"
            modification_time: "{{ item.mtime }}"
            modification_time_format: "%Y%m%d%H%M.%S"
          loop:
            - {path: "{{ ai_stack_test_hf_paths.a_cfg }}", mode: "0664", group: "{{ ai_stack_test_hf_group }}", mtime: preserve}
            - {path: "{{ ai_stack_test_hf_paths.b_w }}", mode: "0644", group: "{{ ai_stack_test_hf_other_group }}", mtime: preserve}
            - {path: "{{ ai_stack_test_hf_paths.a_ref }}", mode: "0644", group: "{{ ai_stack_test_hf_group }}", mtime: "200101010000.00"}
            - {path: "{{ ai_stack_test_hf_paths.b_ref }}", mode: "0644", group: "{{ ai_stack_test_hf_group }}", mtime: "200101010000.00"}
          loop_control:
            label: "{{ item.path | basename }}"
          vars:
            ai_stack_test_hf_other_group: >-
              {{ (ai_stack_test_hf_groups.stdout.split() | reject('equalto', ai_stack_test_hf_group) | list + [ai_stack_test_hf_group]) | first }}

        - name: HF seed | the next run fixes the mode and the group
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: mode-and-group-drift, ok: true}

        - name: HF seed | 0644 and the test user's group again, the content as pinned, refs/main never removed
          ansible.builtin.assert:
            that:
              - hf_on_disk.a_cfg.mode == '0644'
              - hf_on_disk.a_cfg.checksum == 'config-a' | hash('sha256')
              - hf_on_disk.b_w.gr_name == ai_stack_test_hf_group
              - hf_on_disk.b_w.checksum == 'weights-b' | hash('sha256')
              - (hf_on_disk.a_ref.mtime | int) < 1000000000
              - (hf_on_disk.b_ref.mtime | int) < 1000000000
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        # Folders that aren't root's (here: the test user's), or are group-writable, are refused.
        - name: HF seed | another owner is refused
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: wrong-owner, ok: false, owner: root, error: "isn't a real directory owned by root"}

        - name: HF seed | model-a's folder group-writable
          ansible.builtin.file:
            path: "{{ ai_stack_test_hf_dirs[2] }}"
            state: directory
            mode: "0775"

        - name: HF seed | a group-writable folder is refused
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: group-writable, ok: false, error: closed to group and other}

        - name: HF seed | model-a's folder 0755 again
          ansible.builtin.file:
            path: "{{ ai_stack_test_hf_dirs[2] }}"
            state: directory
            mode: "0755"

        # A plain file where a folder belongs (root's and 0644 would pass the owner and mode checks): refused.
        - name: HF seed | model-a's refs folder replaced by a file (and model-a needs a fetch)
          ansible.builtin.command:
            argv: [sh, -c, 'rm -f "$2" && mv "$1" "$1.real" && echo x > "$1" && chmod 0644 "$1"', sh,
                   "{{ ai_stack_test_hf_dirs[3] }}", "{{ ai_stack_test_hf_paths.a_cfg }}"]
          changed_when: true

        - name: HF seed | a file in place of a folder is refused
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: file-for-folder, ok: false, error: Refusing to write through it}

        - name: HF seed | look at the file
          ansible.builtin.stat:
            path: "{{ ai_stack_test_hf_dirs[3] }}"
            get_checksum: true
            checksum_algorithm: sha256
          register: ai_stack_test_hf_refs_file

        - name: HF seed | the file is untouched and nothing was fetched
          ansible.builtin.assert:
            that:
              - ai_stack_test_hf_refs_file.stat.isreg
              - ai_stack_test_hf_refs_file.stat.checksum == 'x\n' | hash('sha256')
              - not hf_on_disk.a_cfg.exists
            quiet: true

        - name: HF seed | the refs folder back
          ansible.builtin.command:
            argv: [sh, -c, 'rm "$1" && mv "$1.real" "$1"', sh, "{{ ai_stack_test_hf_dirs[3] }}"]
          changed_when: true

        # R16-1: a symlink anywhere on the path, from the seed folder's parent down to the pinned snapshot.
        - name: HF seed | a symlinked folder on the path is refused, and nothing is written through it
          ansible.builtin.include_tasks: hf_seed_link_case.yml
          loop: "{{ ai_stack_test_hf_dirs }}"
          loop_control:
            loop_var: hf_link_case

        - name: HF seed | a clean run repairs model-a after the link cases
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: after-links, ok: true}

        - name: HF seed | model-a complete again
          ansible.builtin.assert:
            that:
              - hf_on_disk.a_cfg.checksum == 'config-a' | hash('sha256')
              - hf_on_disk.a_ref.checksum == ('a' * 40) | hash('sha256')
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        # refs/main is a folder (with something in it): refused, never removed.
        - name: HF seed | refs/main is a folder holding a file (and model-a needs a fetch)
          ansible.builtin.command:
            argv: [sh, -c, 'rm -f "$1" "$2" && mkdir "$1" && echo keep > "$1/keep"', sh, "{{ ai_stack_test_hf_paths.a_ref }}",
                   "{{ ai_stack_test_hf_paths.a_cfg }}"]
          changed_when: true

        - name: HF seed | a folder at refs/main is refused
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: refs-main-folder, ok: false, error: isn't a regular file}

        - name: HF seed | look in the refs/main folder
          ansible.builtin.stat:
            path: "{{ ai_stack_test_hf_paths.a_ref }}/keep"
          register: ai_stack_test_hf_keep

        - name: HF seed | the folder and its file are still there
          ansible.builtin.assert:
            that:
              - ai_stack_test_hf_keep.stat.exists
              - hf_on_disk.a_ref.isdir
              - not hf_on_disk.a_cfg.exists
            quiet: true

        - name: HF seed | remove the refs/main folder
          ansible.builtin.file:
            path: "{{ ai_stack_test_hf_paths.a_ref }}"
            state: absent

        # Symlinked files: refs/main pointing at a victim file, and a snapshot file pointing at a file with the
        # pinned content (a stat that followed it would find the right hash).
        - name: HF seed | victim files
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ ai_stack_test_tmp.path }}/{{ item.name }}"
            mode: "0644"
          loop:
            - {name: victim-ref, content: victim}
            - {name: victim-cfg, content: config-b}
          loop_control:
            label: "{{ item.name }}"

        - name: HF seed | refs/main is a symlink (and model-a needs a fetch)
          ansible.builtin.command:
            argv: [sh, -c, 'rm -f "$1" "$3" && ln -s "$2" "$1"', sh, "{{ ai_stack_test_hf_paths.a_ref }}",
                   "{{ ai_stack_test_tmp.path }}/victim-ref", "{{ ai_stack_test_hf_paths.a_cfg }}"]
          changed_when: true

        - name: HF seed | a symlinked refs/main is refused
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: link-refs-main, ok: false, error: isn't a regular file}

        - name: HF seed | refs/main still the link, its target untouched, config.json not fetched
          ansible.builtin.assert:
            that:
              - hf_on_disk.a_ref.islnk
              - lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/victim-ref') == 'victim'
              - not hf_on_disk.a_cfg.exists
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        - name: HF seed | model-b's config.json is a symlink to a file with the pinned content
          ansible.builtin.command:
            argv: [sh, -c, 'rm "$1" && ln -s "$2" "$1" && rm "$3"', sh, "{{ ai_stack_test_hf_paths.b_cfg }}",
                   "{{ ai_stack_test_tmp.path }}/victim-cfg", "{{ ai_stack_test_hf_paths.a_ref }}"]
          changed_when: true

        - name: HF seed | a symlinked snapshot file is refused
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: link-snapshot-file, ok: false, error: isn't a regular file}

        - name: HF seed | the link is still there, model-a still unfetched
          ansible.builtin.assert:
            that:
              - hf_on_disk.b_cfg.islnk
              - not hf_on_disk.a_cfg.exists
              - not hf_on_disk.a_ref.exists
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true

        - name: HF seed | remove the link
          ansible.builtin.file:
            path: "{{ ai_stack_test_hf_paths.b_cfg }}"
            state: absent

        - name: HF seed | a clean run seeds everything again
          ansible.builtin.include_tasks: hf_seed_case.yml
          vars:
            hf_seed_case: {name: final, ok: true}

        - name: HF seed | complete, nothing a link
          ansible.builtin.assert:
            that:
              - hf_on_disk.a_cfg.checksum == 'config-a' | hash('sha256')
              - hf_on_disk.b_cfg.checksum == 'config-b' | hash('sha256')
              - hf_on_disk.a_ref.checksum == ('a' * 40) | hash('sha256')
              - hf_on_disk.b_ref.checksum == ('b' * 40) | hash('sha256')
              - hf_on_disk.values() | map(attribute='islnk') | unique | list == [false]
              - lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/victim-cfg') == 'config-b'
            fail_msg: "{{ hf_on_disk | to_json }}"
            quiet: true
      always:
        - name: HF seed | stop the stand-in server
          ansible.builtin.command:
            argv: [sh, -c, 'test ! -s "$1" || kill "$(cat "$1")" 2>/dev/null || true', sh, "{{ ai_stack_test_hf_pidfile }}"]
          changed_when: false

    - name: Pinned addresses that don't fit are refused
      ansible.builtin.assert:
        that:
          - (ai_stack_network_subnet | ai_stack_pinned_ip_problems(item.pins)) | length > 0
        fail_msg: "{{ item.name }} was accepted"
        quiet: true
      loop:
        - {name: outside, pins: {gpu-broker: 172.21.0.3}}
        - {name: gateway, pins: {gpu-broker: 172.20.0.1}}
        - {name: webui-on-gateway, pins: {open-webui: 172.20.0.1}}
        - {name: network, pins: {gpu-broker: 172.20.0.0}}
        - {name: broadcast, pins: {gpu-broker: 172.20.0.255}}
        - {name: duplicate, pins: {gpu-broker: 172.20.0.3, open-webui: 172.20.0.3}}
        - {name: not-an-ip, pins: {gpu-broker: broker}}
      loop_control:
        label: "{{ item.name }}"

    # ---- 2. gpu-broker.json ---------------------------------------------------------------------------
    # inventory/group_vars/all/main.yml sets both model names, so "unset" cases undefine them per task.
    - name: Broker config, no models set
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/none.json"
        mode: "0644"
      vars:
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_cpu_model: "{{ undef(hint='unset in this case') }}"
        ai_gpu_model: "{{ undef(hint='unset in this case') }}"

    - name: Broker config, only the CPU model set
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/cpu-only.json"
        mode: "0644"
      vars:
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_cpu_model: qwen3:1.7b
        ai_gpu_model: "{{ undef(hint='unset in this case') }}"

    - name: Broker config, only the GPU model set
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/gpu-only.json"
        mode: "0644"
      vars:
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_gpu_model: qwen3:8b
        ai_cpu_model: "{{ undef(hint='unset in this case') }}"

    - name: Broker config, both models set
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/both.json"
        mode: "0644"
      vars:
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_cpu_model: qwen3:1.7b
        ai_gpu_model: qwen3:8b

    # §12.22: the embed alias, alone and next to the chat alias (apps/gpu-broker already takes any number).
    - name: Broker config, only the embedding model set
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/embed-only.json"
        mode: "0644"
      vars:
        ai_embed_model: nomic-embed-text:v1.5
        ai_cpu_model: "{{ undef(hint='unset in this case') }}"
        ai_gpu_model: "{{ undef(hint='unset in this case') }}"

    - name: Broker config, chat models and the embedding model set
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/all.json"
        mode: "0644"
      vars:
        ai_embed_model: nomic-embed-text:v1.5
        ai_cpu_model: qwen3:1.7b
        ai_gpu_model: qwen3:8b

    # The fixed GPU context (apps/gpu-broker gpu_num_ctx) follows the shared ai_gpu_num_ctx (group_vars/all sets
    # 32768, so every config above has it); with that unset it is null.
    - name: Broker config, both models, ai_gpu_num_ctx unset
      ansible.builtin.copy:
        content: "{{ ai_stack_broker_config_content }}"
        dest: "{{ ai_stack_test_tmp.path }}/ctx-unset.json"
        mode: "0644"
      vars:
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_cpu_model: qwen3:1.7b
        ai_gpu_model: qwen3:8b
        ai_gpu_num_ctx: "{{ undef(hint='unset in this case') }}"

    - name: The broker's own --check accepts every config
      ansible.builtin.command:
        argv:
          - "{{ ai_stack_test_python }}"
          - -m
          - gpu_broker
          - --config
          - "{{ ai_stack_test_tmp.path }}/{{ item }}.json"
          - --check
        chdir: "{{ ai_stack_test_broker_dir }}"
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      register: ai_stack_test_check
      changed_when: false
      loop: [none, cpu-only, gpu-only, both, embed-only, all, ctx-unset]

    - name: The broker's --check really rejects a bad config (the check is not a no-op)
      ansible.builtin.copy:
        content: '{"gate_url": "http://100.64.0.20:11500", "gpu_url": "http://100.64.0.20:11434", "cpu_url": "x", "nope": 1}'
        dest: "{{ ai_stack_test_tmp.path }}/bad.json"
        mode: "0644"

    - name: Run --check on the bad config
      ansible.builtin.command:
        argv: ["{{ ai_stack_test_python }}", -m, gpu_broker, --config, "{{ ai_stack_test_tmp.path }}/bad.json", --check]
        chdir: "{{ ai_stack_test_broker_dir }}"
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      register: ai_stack_test_bad
      changed_when: false
      failed_when: ai_stack_test_bad.rc != 2

    - name: Configs have the right URLs and aliases only when both models are set
      vars:
        cfg_none: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/none.json') | from_json }}"
        cpu_only: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/cpu-only.json') | from_json }}"
        gpu_only: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/gpu-only.json') | from_json }}"
        both: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/both.json') | from_json }}"
        embed_only: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/embed-only.json') | from_json }}"
        all_set: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/all.json') | from_json }}"
        both_text: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/both.json') }}"
        unset_text: "{{ lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/ctx-unset.json') }}"
        ctx_unset: "{{ unset_text | from_json }}"
      ansible.builtin.assert:
        that:
          - ai_stack_test_check.results | map(attribute='stdout') | select('search', ' OK ') | list | length == 7
          - >-
            embed_only.aliases == {'embed': {'gpu': 'nomic-embed-text:v1.5', 'cpu': 'nomic-embed-text:v1.5'}}
          - >-
            all_set.aliases == {'assistant': {'gpu': 'qwen3:8b', 'cpu': 'qwen3:1.7b'},
                                'embed': {'gpu': 'nomic-embed-text:v1.5', 'cpu': 'nomic-embed-text:v1.5'}}
          - ai_stack_test_check.results[5].stdout is search('\(2 aliases\)')
          - >-
            cfg_none == {'gate_url': 'http://100.64.0.20:11500', 'gpu_url': 'http://100.64.0.20:11434',
                         'cpu_url': 'http://ollama-cpu:11434', 'aliases': {}, 'management_clients': ['172.20.0.4'],
                         'gpu_num_ctx': 32768}
          # §12.23: open-webui's pinned address is the only management client, in every config.
          - >-
            [cpu_only, gpu_only, both, embed_only, all_set] | map(attribute='management_clients') | unique | list
            == [['172.20.0.4']]
          - cpu_only.aliases == {}
          - gpu_only.aliases == {}
          - >-
            both.aliases == {'assistant': {'gpu': 'qwen3:8b', 'cpu': 'qwen3:1.7b'}}
          - both.gate_url == cfg_none.gate_url and both.cpu_url == cfg_none.cpu_url
          - ai_stack_test_check.results[3].stdout is search('\(1 aliases\)')
          # gpu_num_ctx: the shared ai_gpu_num_ctx as a JSON number (unquoted), null when that is unset; never
          # cpu_num_ctx.
          - ai_gpu_num_ctx == 32768
          - ai_stack_broker_gpu_num_ctx == 32768 and ai_stack_broker_gpu_num_ctx is integer
          - >-
            [cfg_none, cpu_only, gpu_only, both, embed_only, all_set] | map(attribute='gpu_num_ctx') | unique | list == [32768]
          - both.gpu_num_ctx is integer and both.gpu_num_ctx is not boolean
          - >-
            both_text is search('\n  "gpu_num_ctx": 32768,\n')
          - ctx_unset.gpu_num_ctx is none
          - >-
            unset_text is search('\n  "gpu_num_ctx": null,\n')
          - >-
            ctx_unset | combine({'gpu_num_ctx': 32768}) == both
          - >-
            [cfg_none, cpu_only, gpu_only, both, embed_only, all_set, ctx_unset] | selectattr('cpu_num_ctx', 'defined') | list | length == 0
        fail_msg: "{{ [cfg_none, cpu_only, gpu_only, both, ctx_unset, ai_stack_test_check.results | map(attribute='stdout') | list] | to_json }}"
        quiet: true

    - name: The config hash follows the config content
      vars:
        ai_embed_model: "{{ undef(hint='unset in this case') }}"
        ai_cpu_model: "{{ undef(hint='unset in this case') }}"
        ai_gpu_model: "{{ undef(hint='unset in this case') }}"
        hash_none: "{{ ai_stack_broker_config_hash }}"
      ansible.builtin.assert:
        that:
          - hash_none == (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/none.json') ~ '\n') | hash('sha256')
          - hash_none != ((lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/both.json') ~ '\n') | hash('sha256'))
          # Changing the GPU context changes the config, so the broker is recreated with it.
          - >-
            (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/both.json') ~ '\n') | hash('sha256')
            != (lookup('ansible.builtin.file', ai_stack_test_tmp.path ~ '/ctx-unset.json') ~ '\n') | hash('sha256')
        quiet: true

    - name: Broker GPU context, per ai_gpu_num_ctx case (the role's preflight)
      ansible.builtin.include_tasks: num_ctx_case.yml
      loop:
        - {name: null-value, value: null, ok: true}
        - {name: group-vars-32768, value: 32768, ok: true}
        - {name: minimum, value: 2048, ok: true}
        - {name: maximum, value: 262144, ok: true}
        - {name: below, value: 2047, ok: false}
        - {name: above, value: 262145, ok: false}
        - {name: zero, value: 0, ok: false}
        - {name: quoted, value: "32768", ok: false}
        - {name: boolean, value: true, ok: false}
        - {name: float, value: 32768.0, ok: false}
        - {name: list, value: [32768], ok: false}
      loop_control:
        loop_var: num_ctx_case
        label: "{{ num_ctx_case.name }}"

    # ---- 3. boot helper -------------------------------------------------------------------------------
    - name: The boot helper checks exactly the services compose publishes
      vars:
        compose: "{{ ai_stack_test_compose_raw.content | b64decode | from_yaml }}"
        from_compose: >-
          {{ compose.services | dict2items | selectattr('value.ports', 'defined')
             | map(attribute='value') | map(attribute='ports') | flatten
             | map('replace', tailnet_ip ~ ':', '') | list }}
        from_compose_names: >-
          {{ compose.services | dict2items | selectattr('value.ports', 'defined') | map(attribute='key') | list }}
        from_vars: "{{ ai_stack_tailnet_publishes | map(attribute='spec') | list }}"
      ansible.builtin.assert:
        that:
          - from_vars | length == 2
          - from_vars | map('regex_replace', '^[^:]+:', '') | list == from_compose
          - from_vars | map('regex_replace', ':.*$', '') | list == from_compose_names
          # The helper addresses containers by service name.
          - from_compose_names | map('extract', compose.services) | map(attribute='container_name') | list
            == from_compose_names
        fail_msg: "{{ [from_vars, from_compose, from_compose_names] | to_json }}"
        quiet: true

    - name: Fake bin directory
      ansible.builtin.file:
        path: "{{ ai_stack_test_tmp.path }}/bin"
        state: directory
        mode: "0755"

    # ip: prints the tailnet address only when FAKE_IP_HAS_ADDR=1.
    # docker: logs every call and plays the containers described in FAKE_STATE_DIR:
    #   names              the project's containers (`docker ps`)
    #   <name>.inspect     "<status>|<start error>" (`docker inspect`)
    #   <name>.port        `docker port` output; absent = no binding (exit 1, like Docker)
    #   <name>.port.fixed  what a recreate binds (`docker compose ... up`), unless FAKE_COMPOSE_NOFIX=1
    # FAKE_COMPOSE_FAIL=1 makes `docker compose` fail. `docker compose` also logs "UNLOCKED compose" if the
    # stack lock (FAKE_LOCK) is free while it runs.
    - name: Fake ip and docker
      ansible.builtin.copy:
        dest: "{{ ai_stack_test_tmp.path }}/bin/{{ item.name }}"
        mode: "0755"
        content: "{{ item.content }}"
      loop:
        - name: ip
          content: |
            #!/bin/sh
            echo "1: lo    inet 127.0.0.1/8 scope host lo"
            echo "2: eno1    inet 192.0.2.10/24 brd 192.0.2.255 scope global eno1"
            if [ "${FAKE_IP_HAS_ADDR:-0}" = 1 ]; then
              echo "3: tailscale0    inet 100.64.0.10/32 scope global tailscale0"
            fi
        - name: docker
          content: |
            #!/bin/sh
            echo "$*" >> "$FAKE_DOCKER_LOG"
            D=$FAKE_STATE_DIR
            case "$1" in
              ps) cat "$D/names" ;;
              inspect)
                for last; do :; done
                cat "$D/$last.inspect" ;;
              port)
                if [ ! -f "$D/$2.port" ]; then
                  echo "Error: No public port '$3' published for $2" >&2
                  exit 1
                fi
                cat "$D/$2.port" ;;
              compose)
                # The helper must hold the stack lock while it recreates.
                if flock --nonblock "$FAKE_LOCK" true; then echo "UNLOCKED compose" >> "$FAKE_DOCKER_LOG"; fi
                if [ "${FAKE_COMPOSE_FAIL:-0}" = 1 ]; then
                  echo "compose: simulated failure" >&2
                  exit 1
                fi
                svcs=0
                for a; do
                  if [ "$svcs" = 1 ] && [ "${FAKE_COMPOSE_NOFIX:-0}" != 1 ]; then
                    cp "$D/$a.port.fixed" "$D/$a.port"
                  fi
                  if [ "$a" = --no-deps ]; then svcs=1; fi
                done ;;
              *) exit 99 ;;
            esac
      loop_control:
        label: "{{ item.name }}"

    - name: Render the boot helper with the fake PATH
      ansible.builtin.template:
        src: "{{ ai_stack_test_role }}/templates/homelab-ai-stack-start.sh.j2"
        dest: "{{ ai_stack_test_tmp.path }}/start.sh"
        mode: "0755"
      vars:
        ai_stack_start_path: "{{ ai_stack_test_tmp.path }}/bin:/usr/bin:/bin"
        ai_stack_tailnet_wait_seconds: 2
        ai_stack_lock_file: "{{ ai_stack_test_tmp.path }}/stack.lock"
        ai_stack_lock_wait: 1

    - name: The rendered helper is valid sh
      ansible.builtin.command:
        argv: [sh, -n, "{{ ai_stack_test_tmp.path }}/start.sh"]
      changed_when: false

    # Each case: the containers' states, the expected exit status, the expected compose call (or none).
    - name: Boot helper cases
      ansible.builtin.include_tasks: boot_case.yml
      loop:
        - name: broker-up-without-binding
          containers:
            gpu-broker: { status: running, port: false }
            open-webui: { status: running, port: true }
          rc: 0
          compose: [gpu-broker]
        - name: both-up-without-binding
          containers:
            gpu-broker: { status: running, port: false }
            open-webui: { status: running, port: false }
          rc: 0
          compose: [gpu-broker, open-webui]
        - name: restarting-without-binding
          containers:
            gpu-broker: { status: running, port: true }
            open-webui: { status: restarting, port: false }
          rc: 0
          compose: [open-webui]
        - name: all-bound
          containers:
            gpu-broker: { status: running, port: true }
            open-webui: { status: running, port: true }
          rc: 0
          compose: []
        - name: stopped-on-purpose
          containers:
            gpu-broker: { status: exited, port: false }
            open-webui: { status: exited, port: false }
          rc: 0
          compose: []
        - name: one-stopped-one-unbound
          containers:
            gpu-broker: { status: exited, port: false }
            open-webui: { status: running, port: false }
          rc: 0
          compose: [open-webui]
        - name: refused-start
          containers:
            gpu-broker: { status: exited, port: false, error: "cannot assign requested address" }
            open-webui: { status: running, port: true }
          rc: 0
          compose: [gpu-broker]
        - name: removed
          containers:
            open-webui: { status: running, port: true }
          rc: 0
          compose: []
        - name: compose-fails
          containers:
            gpu-broker: { status: running, port: false }
            open-webui: { status: running, port: true }
          env: { FAKE_COMPOSE_FAIL: "1" }
          rc: 1
          compose: [gpu-broker]
          stderr: "docker compose up --force-recreate failed for: gpu-broker"
        - name: recreate-does-not-bind
          containers:
            gpu-broker: { status: running, port: false }
            open-webui: { status: running, port: true }
          env: { FAKE_COMPOSE_NOFIX: "1" }
          rc: 1
          compose: [gpu-broker]
          stderr: "gpu-broker: recreated but 100.64.0.10:11434 is still not bound"
        - name: wrong-address-bound
          containers:
            gpu-broker: { status: running, port: true, port_text: "0.0.0.0:11434" }
            open-webui: { status: running, port: true }
          rc: 0
          compose: [gpu-broker]
        # --heal (the playbook's step): the same decisions, no address wait.
        - name: heal-recreates
          args: [--heal]
          containers:
            gpu-broker: { status: running, port: false }
            open-webui: { status: running, port: true }
          rc: 0
          compose: [gpu-broker]
        - name: heal-healthy-host
          args: [--heal]
          containers:
            gpu-broker: { status: running, port: true }
            open-webui: { status: running, port: true }
          rc: 0
          compose: []
        - name: heal-compose-fails
          args: [--heal]
          containers:
            gpu-broker: { status: running, port: true }
            open-webui: { status: running, port: false }
          env: { FAKE_COMPOSE_FAIL: "1" }
          rc: 1
          compose: [open-webui]
          stderr: "docker compose up --force-recreate failed for: open-webui"
        - name: heal-dry-run
          args: [--heal, --dry-run]
          dry: true
          containers:
            gpu-broker: { status: running, port: false }
            open-webui: { status: running, port: false }
          rc: 0
          compose: [gpu-broker, open-webui]
        - name: heal-no-address
          args: [--heal]
          env: { FAKE_IP_HAS_ADDR: "0" }
          containers:
            gpu-broker: { status: running, port: false }
          rc: 1
          compose: []
          no_docker: true
          stderr: "is not on this host after 0s"
        - name: bad-option
          args: [--dry-run]
          containers:
            gpu-broker: { status: running, port: false }
          rc: 2
          compose: []
          no_docker: true
          stderr: "--dry-run needs --heal"
      loop_control:
        loop_var: ai_stack_case
        label: "{{ ai_stack_case.name }}"
      vars:
        ai_stack_case_dir: "{{ ai_stack_test_tmp.path }}/case-{{ ai_stack_case.name }}"
        ai_stack_case_lock: "{{ ai_stack_test_tmp.path }}/stack.lock"
        ai_stack_case_ports: { gpu-broker: 11434, open-webui: 8080 }

    # The lock: while something else holds it, the helper gives up after the bounded wait (ai_stack_lock_wait,
    # 1 s here) and calls no Docker command; a dry run doesn't need the lock.
    - name: Lock case | state directory
      ansible.builtin.file:
        path: "{{ ai_stack_test_tmp.path }}/lock-case"
        state: directory
        mode: "0755"

    - name: Lock case | containers for the lock tests
      ansible.builtin.copy:
        dest: "{{ ai_stack_test_tmp.path }}/lock-case/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - { name: names, content: "gpu-broker\nopen-webui\n" }
        - { name: gpu-broker.inspect, content: "running|\n" }
        - { name: open-webui.inspect, content: "running|\n" }
        - { name: open-webui.port, content: "100.64.0.10:8080\n" }
        - { name: gpu-broker.port.fixed, content: "100.64.0.10:11434\n" }
      loop_control:
        label: "{{ item.name }}"

    - name: Lock case | helper while another process holds the lock
      ansible.builtin.command:
        argv: [flock, "{{ ai_stack_test_tmp.path }}/stack.lock", "{{ ai_stack_test_tmp.path }}/start.sh", --heal]
      environment:
        FAKE_IP_HAS_ADDR: "1"
        FAKE_STATE_DIR: "{{ ai_stack_test_tmp.path }}/lock-case"
        FAKE_LOCK: "{{ ai_stack_test_tmp.path }}/stack.lock"
        FAKE_DOCKER_LOG: "{{ ai_stack_test_tmp.path }}/lock-case/docker-heal.log"
      register: ai_stack_test_locked
      changed_when: false
      failed_when: ai_stack_test_locked.rc != 1

    - name: Lock case | a dry run while the lock is held
      ansible.builtin.command:
        argv: [flock, "{{ ai_stack_test_tmp.path }}/stack.lock", "{{ ai_stack_test_tmp.path }}/start.sh", --heal, --dry-run]
      environment:
        FAKE_IP_HAS_ADDR: "1"
        FAKE_STATE_DIR: "{{ ai_stack_test_tmp.path }}/lock-case"
        FAKE_LOCK: "{{ ai_stack_test_tmp.path }}/stack.lock"
        FAKE_DOCKER_LOG: "{{ ai_stack_test_tmp.path }}/lock-case/docker-dry.log"
      register: ai_stack_test_locked_dry
      changed_when: false

    - name: Lock case | look for Docker calls from the timed-out run
      ansible.builtin.stat:
        path: "{{ ai_stack_test_tmp.path }}/lock-case/docker-heal.log"
      register: ai_stack_test_locked_log

    - name: Lock case | a held lock times out cleanly; a dry run doesn't wait for it
      ansible.builtin.assert:
        that:
          - ai_stack_test_locked.stderr is search('could not take the stack lock .* within 1s')
          - not ai_stack_test_locked_log.stat.exists
          - ai_stack_test_locked_dry.rc == 0
          - ai_stack_test_locked_dry.stdout is search(ai_stack_heal_changed_re, multiline=True)
          - ai_stack_test_locked_dry.stdout is search('^WOULD-RECREATE gpu-broker$', multiline=True)
        fail_msg: "{{ [ai_stack_test_locked.stderr, ai_stack_test_locked_dry.stdout] | to_json }}"
        quiet: true

    - name: Boot helper, address never appears
      ansible.builtin.command:
        argv: ["{{ ai_stack_test_tmp.path }}/start.sh"]
      environment:
        FAKE_IP_HAS_ADDR: "0"
        FAKE_STATE_DIR: "{{ ai_stack_test_tmp.path }}"
        FAKE_DOCKER_LOG: "{{ ai_stack_test_tmp.path }}/docker-absent.log"
      register: ai_stack_test_start_noaddr
      changed_when: false
      failed_when: ai_stack_test_start_noaddr.rc != 1

    - name: Look for a docker log from the no-address run
      ansible.builtin.stat:
        path: "{{ ai_stack_test_tmp.path }}/docker-absent.log"
      register: ai_stack_test_absent_log

    - name: Without the address the helper gives up after the bounded wait and never calls Docker
      ansible.builtin.assert:
        that:
          - ai_stack_test_start_noaddr.stderr is search('not on this host after 2s')
          - not ai_stack_test_absent_log.stat.exists
        quiet: true

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ ai_stack_test_tmp.path }}"
        state: absent
