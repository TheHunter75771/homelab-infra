---
# Install one source tree into a dedicated directory and prune everything else there.
# Params: mission_control_tree_src (controller dir), mission_control_tree_dest (absolute, basename must be
# mission_control_tree_name, since it is pruned), mission_control_tree_include (regex on the relative path).
# Never deployed: symlinks, __pycache__, test/tests and node_modules anywhere in the tree.
- name: Tree | the destination is a dedicated directory for {{ mission_control_tree_name }}
  ansible.builtin.assert:
    that:
      - mission_control_tree_dest is abs
      - mission_control_tree_dest | basename == mission_control_tree_name
    fail_msg: "{{ mission_control_tree_dest }} must be an absolute path ending in /{{ mission_control_tree_name }} (it is pruned)."
    quiet: true

- name: Tree | source files of {{ mission_control_tree_name }}
  vars:
    mission_control_tree_entries: "{{ query('community.general.filetree', mission_control_tree_src) }}"
    mission_control_tree_skip: '(^|/)(__pycache__|tests?|node_modules)(/|$)'
  ansible.builtin.set_fact:
    mission_control_tree_files: >-
      {{ mission_control_tree_entries | selectattr('state', 'equalto', 'file') | map(attribute='path')
         | select('search', mission_control_tree_include) | reject('search', mission_control_tree_skip) | sort }}
    mission_control_tree_dirs: >-
      {{ mission_control_tree_entries | selectattr('state', 'equalto', 'directory') | map(attribute='path')
         | reject('search', mission_control_tree_skip) | sort }}

- name: Tree | there are files to install for {{ mission_control_tree_name }}
  ansible.builtin.assert:
    that: mission_control_tree_files | length > 0
    fail_msg: No files matching {{ mission_control_tree_include }} under {{ mission_control_tree_src }}.
    quiet: true

- name: Tree | the destination and its subdirectories are real directories (before any write)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    mission_control_guard_dirs: >-
      {{ [mission_control_tree_dest] + (mission_control_tree_dirs | map('regex_replace', '^', mission_control_tree_dest ~ '/') | list) }}

- name: Tree | directories of {{ mission_control_tree_name }}
  ansible.builtin.file:
    path: "{{ (mission_control_tree_dest ~ '/' ~ item) | regex_replace('/$', '') }}"
    state: directory
    owner: "{{ mission_control_owner }}"
    group: "{{ mission_control_owner }}"
    mode: "0755"
  loop: "{{ [''] + mission_control_tree_dirs }}"
  register: mission_control_tree_mkdirs

- name: Tree | files of {{ mission_control_tree_name }}
  ansible.builtin.copy:
    src: "{{ mission_control_tree_src }}/{{ item }}"
    dest: "{{ mission_control_tree_dest }}/{{ item }}"
    owner: "{{ mission_control_owner }}"
    group: "{{ mission_control_owner }}"
    mode: "0644"
  loop: "{{ mission_control_tree_files }}"
  register: mission_control_tree_copied
  notify: Restart mission-control

- name: Tree | the destination is still a real directory (before the find and prune)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    mission_control_guard_dirs: >-
      {{ [mission_control_tree_dest] + (mission_control_tree_dirs | map('regex_replace', '^', mission_control_tree_dest ~ '/') | list) }}

- name: Tree | installed files of {{ mission_control_tree_name }}
  ansible.builtin.find:
    paths: "{{ mission_control_tree_dest }}"
    recurse: true
    follow: false
    file_type: any
    hidden: true
  register: mission_control_tree_found

- name: Tree | anything else is removed from {{ mission_control_tree_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ mission_control_tree_found.files | map(attribute='path') | reject('in', mission_control_tree_wanted) | sort }}"
  vars:
    mission_control_tree_wanted: >-
      {{ (mission_control_tree_dirs + mission_control_tree_files) | map('regex_replace', '^', mission_control_tree_dest ~ '/') | list }}
  register: mission_control_tree_pruned
  notify: Restart mission-control
