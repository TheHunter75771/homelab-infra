---
# verify_check_config.yml through the fake systemd-run (it prints MC_TEST_PROBE_OUT): cc_case = {name, out, want}.
# CONFIG in `out` becomes the config path. The recorded argv must carry the units' whole sandbox and MC1's
# `check-config` through the launcher.
- name: Verify check-config | the canned output for {{ cc_case.name }}
  ansible.builtin.copy:
    content: "{{ cc_case.out | replace('CONFIG', mission_control_config_file) }}\n"
    dest: "{{ test_tmp }}/probe.out"
    mode: "0600"

- name: Verify check-config for {{ cc_case.name }}
  block:
    - name: Verify check-config | verify_check_config.yml for {{ cc_case.name }}
      ansible.builtin.include_tasks: ../tasks/verify_check_config.yml
    - name: Passed
      ansible.builtin.set_fact:
        test_cc_got: pass
  rescue:
    - name: Failed
      ansible.builtin.set_fact:
        test_cc_got: "{{ 'fail' if ansible_failed_task.name == 'Verify | check-config passed' else 'error: ' ~ ansible_failed_task.name }}"

- name: Verify check-config | outcome and argv for {{ cc_case.name }}
  vars:
    argv: "{{ lookup('ansible.builtin.file', test_tmp ~ '/systemd-run.args').splitlines() }}"
  ansible.builtin.assert:
    that:
      - test_cc_got == cc_case.want
      - (mission_control_sandbox | map('regex_replace', '^', '--property=') | list) | reject('in', argv) | list == []
      - argv[-5] == '--'
      - argv[-4:] == mission_control_check_config_argv
      - mission_control_check_config_argv[-1] == 'check-config'
    fail_msg: "{{ cc_case.name }}: {{ test_cc_got }}, want {{ cc_case.want }}; argv {{ argv }}"
    quiet: true
