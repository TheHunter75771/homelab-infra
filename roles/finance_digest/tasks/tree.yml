---
# Install one Python package into a dedicated directory and prune everything else there.
# Params: finance_digest_tree_src (controller dir), finance_digest_tree_dest (absolute, basename must be
# finance_digest_tree_name, since it is pruned). Only *.py files are installed. Never deployed: symlinks,
# __pycache__, test/tests and node_modules anywhere in the tree.
- name: Tree | the destination is a dedicated directory for {{ finance_digest_tree_name }}
  ansible.builtin.assert:
    that:
      - finance_digest_tree_dest is abs
      - finance_digest_tree_dest | basename == finance_digest_tree_name
    fail_msg: "{{ finance_digest_tree_dest }} must be an absolute path ending in /{{ finance_digest_tree_name }} (it is pruned)."
    quiet: true

- name: Tree | source files of {{ finance_digest_tree_name }}
  vars:
    finance_digest_tree_entries: "{{ query('community.general.filetree', finance_digest_tree_src) }}"
    finance_digest_tree_skip: '(^|/)(__pycache__|tests?|node_modules)(/|$)'
  ansible.builtin.set_fact:
    finance_digest_tree_files: >-
      {{ finance_digest_tree_entries | selectattr('state', 'equalto', 'file') | map(attribute='path')
         | select('search', '[.]py$') | reject('search', finance_digest_tree_skip) | sort }}
    finance_digest_tree_dirs: >-
      {{ finance_digest_tree_entries | selectattr('state', 'equalto', 'directory') | map(attribute='path')
         | reject('search', finance_digest_tree_skip) | sort }}

- name: Tree | there are files to install for {{ finance_digest_tree_name }}
  ansible.builtin.assert:
    that: finance_digest_tree_files | length > 0
    fail_msg: No *.py files under {{ finance_digest_tree_src }}.
    quiet: true

- name: Tree | the destination and its subdirectories are real directories (before any write)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    finance_digest_guard_dirs: >-
      {{ [finance_digest_tree_dest] + (finance_digest_tree_dirs | map('regex_replace', '^', finance_digest_tree_dest ~ '/') | list) }}

- name: Tree | directories of {{ finance_digest_tree_name }}
  ansible.builtin.file:
    path: "{{ (finance_digest_tree_dest ~ '/' ~ item) | regex_replace('/$', '') }}"
    state: directory
    owner: "{{ finance_digest_owner }}"
    group: "{{ finance_digest_owner }}"
    mode: "0755"
  loop: "{{ [''] + finance_digest_tree_dirs }}"

- name: Tree | files of {{ finance_digest_tree_name }}
  ansible.builtin.copy:
    src: "{{ finance_digest_tree_src }}/{{ item }}"
    dest: "{{ finance_digest_tree_dest }}/{{ item }}"
    owner: "{{ finance_digest_owner }}"
    group: "{{ finance_digest_owner }}"
    mode: "0644"
    follow: false
  loop: "{{ finance_digest_tree_files }}"

- name: Tree | the destination is still a real directory (before the find and prune)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    finance_digest_guard_dirs: >-
      {{ [finance_digest_tree_dest] + (finance_digest_tree_dirs | map('regex_replace', '^', finance_digest_tree_dest ~ '/') | list) }}

- name: Tree | installed files of {{ finance_digest_tree_name }}
  ansible.builtin.find:
    paths: "{{ finance_digest_tree_dest }}"
    recurse: true
    follow: false
    file_type: any
    hidden: true
  register: finance_digest_tree_found

- name: Tree | anything else is removed from {{ finance_digest_tree_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ finance_digest_tree_found.files | map(attribute='path') | reject('in', finance_digest_tree_wanted) | sort }}"
  vars:
    finance_digest_tree_wanted: >-
      {{ (finance_digest_tree_dirs + finance_digest_tree_files) | map('regex_replace', '^', finance_digest_tree_dest ~ '/') | list }}
