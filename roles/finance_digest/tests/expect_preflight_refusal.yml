---
# One refusal case for test_finance_digest.yml: case = {name, vars, task}. The case's vars are passed as include
# params (they outrank the test's set_fact values); every other input keeps its good value (test_good).
- name: Preflight refuses {{ case.name }}
  block:
    - name: Preflight with {{ case.name }}
      ansible.builtin.include_tasks: ../tasks/preflight.yml
      vars:
        moneyhub_url: "{{ case.vars.get('moneyhub_url', test_good.moneyhub_url) }}"
        tailnet_ip: "{{ case.vars.get('tailnet_ip', test_good.tailnet_ip) }}"
        finance_digest_broker_port: "{{ case.vars.get('finance_digest_broker_port', 11434) }}"
        finance_digest_ai_summary: "{{ case.vars.get('finance_digest_ai_summary', true) }}"
        finance_digest_timezone: "{{ case.vars.get('finance_digest_timezone', 'America/New_York') }}"
        finance_digest_randomized_delay: "{{ case.vars.get('finance_digest_randomized_delay', 120) }}"
        finance_digest_dns_stub: "{{ case.vars.get('finance_digest_dns_stub', '127.0.0.53') }}"
        finance_digest_config_extra: "{{ case.vars.get('finance_digest_config_extra', {}) }}"
        finance_digest_notion_token: "{{ case.vars.get('finance_digest_notion_token', '') }}"
        finance_digest_notion_page_id: "{{ case.vars.get('finance_digest_notion_page_id', '') }}"
        finance_digest_broker_ranges: "{{ case.vars.get('finance_digest_broker_ranges', test_good.broker_ranges) }}"
        searxng_subnet: "{{ case.vars.get('searxng_subnet', '172.29.16.0/28') }}"
        finance_digest_ip_deny_public: "{{ case.vars.get('finance_digest_ip_deny_public', test_good.ip_deny_public) }}"
        finance_digest_library_root: "{{ case.vars.get('finance_digest_library_root', test_good.library_root) }}"
        finance_digest_library_mount: "{{ case.vars.get('finance_digest_library_mount', test_good.library_mount) }}"
        finance_digest_library_forbidden_re: "{{ case.vars.get('finance_digest_library_forbidden_re', test_good.forbidden_re) }}"
        finance_digest_library_group: "{{ case.vars.get('finance_digest_library_group', test_good.library_group) }}"
        finance_digest_pkg_src: "{{ case.vars.get('finance_digest_pkg_src', test_good.pkg_src) }}"
        finance_digest_launcher_src: "{{ case.vars.get('finance_digest_launcher_src', test_good.launcher_src) }}"

    - name: Not reached
      ansible.builtin.set_fact:
        fd_test_refused_by: ""
  rescue:
    - name: Note which task refused
      ansible.builtin.set_fact:
        fd_test_refused_by: "{{ ansible_failed_task.name }}"

- name: Refused by the expected check for {{ case.name }}
  ansible.builtin.assert:
    that: fd_test_refused_by == case.task
    fail_msg: "{{ case.name }}: refused by '{{ fd_test_refused_by }}', expected '{{ case.task }}'"
    quiet: true
