# yamllint disable rule:document-start
# Test fixture: roles/stacks/templates rendered with placeholder identifiers (RFC 5737 addresses).
# Ansible managed
# Edge stack (docs/CONTRACTS.md §6): the Cloudflare tunnel, for public streaming only.
# Its one public hostname (path /watch*) points at http://jellyfin:8096 over hl-public;
# that route is set in the Cloudflare dashboard (docs/runbooks/cloudflare.md). Not deployed in rehearsal.
name: edge

services:
  cloudflared:
    image: "cloudflare/cloudflared:2026.5.0@sha256:59bab8d3aceec09bf6bdb07d6beca0225ca5cd7ab79436a87ea97978fe1dc4f9"
    container_name: cloudflared
    restart: unless-stopped
    # Token from .env (TUNNEL_TOKEN), so it never appears on the command line.
    # The metrics/ready endpoint stays inside the container (loopback) for the healthcheck.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    env_file:
      - .env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks:
      - hl-public
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      homelab.watch: "true"

networks:
  hl-public:
    external: true
