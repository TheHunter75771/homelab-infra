# yamllint disable rule:document-start
# Test fixture: roles/stacks/templates rendered with placeholder identifiers (RFC 5737 addresses).
# Ansible managed
# Media stack (docs/CONTRACTS.md §6). Every admin UI binds to 127.0.0.1 and is reached only through
# `tailscale serve` (role tailscale_serve). Jellyfin is also published on the LAN address for TVs and
# joins hl-public so the tunnel (edge stack) can reach it as http://jellyfin:8096.
# Docker starts only after the boot gate has verified the media drive, so there is no wait-for-media init.
name: media

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  labels:
    homelab.watch: "true"

x-lsio-env: &lsio_env
  PUID: "1001"
  PGID: "1002"
  UMASK: "002"
  TZ: "Etc/UTC"

# rslave: a remount of /media by the boot gate shows up inside running containers.
x-media-rw: &media_rw
  type: bind
  source: "/media"
  target: /data
  bind:
    propagation: rslave

services:
  jellyfin:
    <<: *common
    image: "lscr.io/linuxserver/jellyfin:10.11.9ubu2404-ls33@sha256:155fb51c745d1a2c28c8b300612bc728a5dd06097bbc62b8b1c76d174eb20366"
    container_name: jellyfin
    mem_limit: 2g
    environment: *lsio_env
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "991"
    ports:
      - "192.0.2.10:8096:8096"
      - "127.0.0.1:8096:8096"
    volumes:
      - "/srv/homelab/data/jellyfin:/config"
      - type: bind
        source: "/media"
        target: /data
        read_only: true
        bind:
          propagation: rslave
    networks:
      - default
      - hl-public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/watch/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  sonarr:
    <<: *common
    image: "lscr.io/linuxserver/sonarr:4.0.17.2952-ls312@sha256:0b5c4803f92456fb9b65bae8375716ea120b4ea17b3cced7da32b63f0085782b"
    container_name: sonarr
    mem_limit: 1g
    environment: *lsio_env
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - "/srv/homelab/data/sonarr:/config"
      - *media_rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/sonarr/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  radarr:
    <<: *common
    image: "lscr.io/linuxserver/radarr:6.1.1.10360-ls303@sha256:079e48870584baf2a3e7e43e7ba6d3c834555931851a59c82c51cc792d285caf"
    container_name: radarr
    mem_limit: 1g
    environment: *lsio_env
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - "/srv/homelab/data/radarr:/config"
      - *media_rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/radarr/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  prowlarr:
    <<: *common
    image: "lscr.io/linuxserver/prowlarr:2.3.5.5327-ls147@sha256:c9fe528f34b1fd3715438b6f6d6991d64e2965f2c055db36398bc66a0e7eab01"
    container_name: prowlarr
    mem_limit: 512m
    environment: *lsio_env
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - "/srv/homelab/data/prowlarr:/config"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/prowlarr/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  sabnzbd:
    <<: *common
    image: "lscr.io/linuxserver/sabnzbd:5.0.3-ls255@sha256:6b392fce45ed587ba7213259fbce6f9f725b157b746b36ec53d3f08ee415602e"
    container_name: sabnzbd
    mem_limit: 1g
    environment: *lsio_env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "/srv/homelab/data/sabnzbd:/config"
      - "/srv/homelab/downloads-incomplete:/incomplete-downloads"
      - *media_rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/sabnzbd/api?mode=version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  jellyseerr:
    <<: *common
    image: "fallenbagel/jellyseerr:2.7.3@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764"
    container_name: jellyseerr
    mem_limit: 512m
    environment:
      TZ: "Etc/UTC"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - "/srv/homelab/data/jellyseerr:/app/config"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5055/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  hl-public:
    external: true
