---
# Role inputs, checked before anything is written. The installed app's own loader validates the
# rendered config again (config.yml), so this only catches what would make the role itself wrong.
- name: Preflight | role inputs
  ansible.builtin.assert:
    that:
      - gaming_pc_tailnet_ip | default('') is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - not (ai_host_agent_ip_allowlist | bool) or ai_box_tailnet_ip | default('') is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - ai_host_agent_user is match('^[a-z_][a-z0-9_-]*$')
      - ai_host_agent_groups == ['systemd-journal']
      - ai_host_agent_port | int > 0 and ai_host_agent_port | int < 65536
      - ai_host_agent_sudo_exes is sequence and ai_host_agent_sudo_exes is not string
      - ai_host_agent_sudo_exes | length > 0
      - ai_host_agent_sudo_exes | reject('match', '^/[A-Za-z0-9_./-]+$') | list | length == 0
      - ai_host_agent_protect_proc in ['invisible', 'default']
      - ai_host_agent_config_extra is mapping
      # Keys the role owns; overriding them from the extras would break the unit or the contract.
      - ai_host_agent_config_extra.keys() | intersect(['binds', 'port', 'token_file', 'ollama_url']) | length == 0
    fail_msg: >-
      Check the ai_host_agent inputs: gaming_pc_tailnet_ip (and ai_box_tailnet_ip while
      ai_host_agent_ip_allowlist is on) must be IPv4 literals in host_vars; the account is aictl-agent
      with only systemd-journal; a valid port; sudo_exes a non-empty list of absolute paths;
      ai_host_agent_protect_proc invisible|default; ai_host_agent_config_extra can't set binds, port,
      token_file or ollama_url.
    quiet: true

- name: Preflight | read the group database
  ansible.builtin.getent:
    database: group

- name: Preflight | the supplementary groups exist
  ansible.builtin.assert:
    that: item in ansible_facts.getent_group
    fail_msg: Group {{ item }} is missing on this host (systemd creates systemd-journal).
    quiet: true
  loop: "{{ ai_host_agent_groups }}"

- name: Preflight | the app sources exist on the controller (module Y)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ai_host_agent_src_dir }}/{{ ai_host_agent_launcher }}"
    - "{{ ai_host_agent_src_dir }}/{{ ai_host_agent_package }}/__main__.py"
    - "{{ ai_host_agent_src_dir }}/{{ ai_host_agent_package }}/config.py"
  register: ai_host_agent_src_stat
  delegate_to: localhost
  become: false

- name: Preflight | require the app sources
  ansible.builtin.assert:
    that: ai_host_agent_src_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing on the controller:
      {{ ai_host_agent_src_stat.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
    quiet: true

# The firewall is module G's (role ollama_rocm, policy homelab-ai-only): this role only checks that
# the agent's port is one G guards, so the agent is never reachable from anyone but ai-box.
- name: Preflight | the agent port is in module G's firewalld policy list
  ansible.builtin.assert:
    that:
      - ollama_rocm_policy_extra_ports is defined
      - ollama_rocm_policy_extra_ports is sequence and ollama_rocm_policy_extra_ports is not string
      - ai_host_agent_port | int in (ollama_rocm_policy_extra_ports | map('int') | list)
    fail_msg: >-
      Port {{ ai_host_agent_port }} must be in ollama_rocm_policy_extra_ports (inventory
      group_vars/workstations_root), which role ollama_rocm turns into the ai-box-only firewalld policy;
      it is {{ ollama_rocm_policy_extra_ports | default('undefined') }}. Run playbooks/gaming-pc-ai.yml after changing it.
    quiet: true
