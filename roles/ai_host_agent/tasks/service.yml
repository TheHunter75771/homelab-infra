---
- name: Service | ai-host-agent unit (Y's hardened unit)
  ansible.builtin.template:
    src: ai-host-agent.service.j2
    dest: "{{ ai_host_agent_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for ai-host-agent
    - Restart ai-host-agent

- name: Service | load a changed unit and restart before enabling it
  ansible.builtin.meta: flush_handlers

- name: Service | ai-host-agent is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ ai_host_agent_unit_name }}"
    enabled: true
    state: started
  # On a first check run the unit file doesn't exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
