---
# Install one Python package into a dedicated directory and prune everything else there.
# Params: research_gate_tree_src (controller dir), research_gate_tree_dest (absolute, basename must be
# research_gate_tree_name, since it is pruned). Only *.py files are installed. Never deployed: symlinks,
# __pycache__, test/tests and node_modules anywhere in the tree.
- name: Tree | the destination is a dedicated directory for {{ research_gate_tree_name }}
  ansible.builtin.assert:
    that:
      - research_gate_tree_dest is abs
      - research_gate_tree_dest | basename == research_gate_tree_name
    fail_msg: "{{ research_gate_tree_dest }} must be an absolute path ending in /{{ research_gate_tree_name }} (it is pruned)."
    quiet: true

- name: Tree | source files of {{ research_gate_tree_name }}
  vars:
    research_gate_tree_entries: "{{ query('community.general.filetree', research_gate_tree_src) }}"
    research_gate_tree_skip: '(^|/)(__pycache__|tests?|node_modules)(/|$)'
  ansible.builtin.set_fact:
    research_gate_tree_files: >-
      {{ research_gate_tree_entries | selectattr('state', 'equalto', 'file') | map(attribute='path')
         | select('search', '[.]py$') | reject('search', research_gate_tree_skip) | sort }}
    research_gate_tree_dirs: >-
      {{ research_gate_tree_entries | selectattr('state', 'equalto', 'directory') | map(attribute='path')
         | reject('search', research_gate_tree_skip) | sort }}

- name: Tree | there are files to install for {{ research_gate_tree_name }}
  ansible.builtin.assert:
    that: research_gate_tree_files | length > 0
    fail_msg: No *.py files under {{ research_gate_tree_src }}.
    quiet: true

- name: Tree | the destination and its subdirectories are real directories (before any write)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    research_gate_guard_dirs: >-
      {{ [research_gate_tree_dest] + (research_gate_tree_dirs | map('regex_replace', '^', research_gate_tree_dest ~ '/') | list) }}

- name: Tree | directories of {{ research_gate_tree_name }}
  ansible.builtin.file:
    path: "{{ (research_gate_tree_dest ~ '/' ~ item) | regex_replace('/$', '') }}"
    state: directory
    owner: "{{ research_gate_owner }}"
    group: "{{ research_gate_owner }}"
    mode: "0755"
  loop: "{{ [''] + research_gate_tree_dirs }}"

- name: Tree | files of {{ research_gate_tree_name }}
  ansible.builtin.copy:
    src: "{{ research_gate_tree_src }}/{{ item }}"
    dest: "{{ research_gate_tree_dest }}/{{ item }}"
    owner: "{{ research_gate_owner }}"
    group: "{{ research_gate_owner }}"
    mode: "0644"
    follow: false
  loop: "{{ research_gate_tree_files }}"
  notify: Restart research-gate

- name: Tree | the destination is still a real directory (before the find and prune)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    research_gate_guard_dirs: >-
      {{ [research_gate_tree_dest] + (research_gate_tree_dirs | map('regex_replace', '^', research_gate_tree_dest ~ '/') | list) }}

- name: Tree | installed files of {{ research_gate_tree_name }}
  ansible.builtin.find:
    paths: "{{ research_gate_tree_dest }}"
    recurse: true
    follow: false
    file_type: any
    hidden: true
  register: research_gate_tree_found

- name: Tree | anything else is removed from {{ research_gate_tree_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ research_gate_tree_found.files | map(attribute='path') | reject('in', research_gate_tree_wanted) | sort }}"
  vars:
    research_gate_tree_wanted: >-
      {{ (research_gate_tree_dirs + research_gate_tree_files) | map('regex_replace', '^', research_gate_tree_dest ~ '/') | list }}
  notify: Restart research-gate
