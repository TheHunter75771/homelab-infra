---
# One symlink case for test_ai_control.yml: case = {name, root, link}. The scratch code root `root`
# gets real dirs up to `link`, which is made a symlink to a victim directory holding one sentinel.
# install.yml must refuse at a guard before writing anything, and the victim must be untouched.
- name: Guard case | set up the victim and the link for {{ case.name }}
  ansible.builtin.shell:
    cmd: |
      set -eu
      v="{{ test_tmp }}/victim-{{ case.name }}"
      mkdir -p "$v" "$(dirname "{{ case.link }}")"
      echo keep > "$v/sentinel"
      chmod 0700 "$v"
      ln -sfn "$v" "{{ case.link }}"
    executable: /bin/bash
  changed_when: true

- name: Guard case | install through the link for {{ case.name }}
  block:
    - name: Guard case | install for {{ case.name }}
      ansible.builtin.include_tasks: ../tasks/install.yml
      vars:
        ai_control_app_dir: "{{ case.root }}"
        ai_control_server_dir: "{{ case.root }}/server"
        ai_control_web_dir: "{{ case.root }}/web"
        ai_control_helper_script: "{{ test_tmp }}/sbin/aictl-helper-{{ case.name }}"

    - name: Guard case | not reached for {{ case.name }}
      ansible.builtin.set_fact:
        ctl_test_guard_by: ""
  rescue:
    - name: Guard case | note which task refused for {{ case.name }}
      ansible.builtin.set_fact:
        ctl_test_guard_by: "{{ ansible_failed_task.name }}"

- name: Guard case | list the victim for {{ case.name }}
  ansible.builtin.find:
    paths: "{{ test_tmp }}/victim-{{ case.name }}"
    recurse: true
    hidden: true
    file_type: any
  register: ctl_test_victim

- name: Guard case | stat the victim for {{ case.name }}
  ansible.builtin.stat:
    path: "{{ test_tmp }}/victim-{{ case.name }}"
  register: ctl_test_victim_dir

- name: Guard case | refused by a guard, victim untouched for {{ case.name }}
  ansible.builtin.assert:
    that:
      - ctl_test_guard_by == 'Guard | each pruned directory is absent or a real directory (never a symlink)'
      - ctl_test_victim.files | map(attribute='path') | map('basename') | list == ['sentinel']
      - ctl_test_victim_dir.stat.mode == '0700'
    fail_msg: "refused by '{{ ctl_test_guard_by }}'; victim holds {{ ctl_test_victim.files | map(attribute='path') | list }}"
    quiet: true
