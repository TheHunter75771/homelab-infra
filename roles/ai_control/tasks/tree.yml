---
# Install one source tree into a dedicated directory and prune everything else there.
# Params: ai_control_tree_src (controller dir), ai_control_tree_dest (absolute, basename must be
# ai_control_tree_name, since it is pruned), ai_control_tree_include (regex on the relative path).
# Never deployed: symlinks, __pycache__, test/tests and node_modules anywhere in the tree.
- name: Tree | the destination is a dedicated directory for {{ ai_control_tree_name }}
  ansible.builtin.assert:
    that:
      - ai_control_tree_dest is abs
      - ai_control_tree_dest | basename == ai_control_tree_name
    fail_msg: "{{ ai_control_tree_dest }} must be an absolute path ending in /{{ ai_control_tree_name }} (it is pruned)."
    quiet: true

- name: Tree | source files of {{ ai_control_tree_name }}
  vars:
    ai_control_tree_entries: "{{ query('community.general.filetree', ai_control_tree_src) }}"
    ai_control_tree_skip: '(^|/)(__pycache__|tests?|node_modules)(/|$)'
  ansible.builtin.set_fact:
    ai_control_tree_files: >-
      {{ ai_control_tree_entries | selectattr('state', 'equalto', 'file') | map(attribute='path')
         | select('search', ai_control_tree_include) | reject('search', ai_control_tree_skip) | sort }}
    ai_control_tree_dirs: >-
      {{ ai_control_tree_entries | selectattr('state', 'equalto', 'directory') | map(attribute='path')
         | reject('search', ai_control_tree_skip) | sort }}

- name: Tree | there are files to install for {{ ai_control_tree_name }}
  ansible.builtin.assert:
    that: ai_control_tree_files | length > 0
    fail_msg: No files matching {{ ai_control_tree_include }} under {{ ai_control_tree_src }}.
    quiet: true

- name: Tree | the destination and its subdirectories are real directories (before any write)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    ai_control_guard_dirs: "{{ [ai_control_tree_dest] + (ai_control_tree_dirs | map('regex_replace', '^', ai_control_tree_dest ~ '/') | list) }}"

- name: Tree | directories of {{ ai_control_tree_name }}
  ansible.builtin.file:
    path: "{{ (ai_control_tree_dest ~ '/' ~ item) | regex_replace('/$', '') }}"
    state: directory
    owner: "{{ ai_control_owner }}"
    group: "{{ ai_control_owner }}"
    mode: "0755"
  loop: "{{ [''] + ai_control_tree_dirs }}"
  register: ai_control_tree_mkdirs

- name: Tree | files of {{ ai_control_tree_name }}
  ansible.builtin.copy:
    src: "{{ ai_control_tree_src }}/{{ item }}"
    dest: "{{ ai_control_tree_dest }}/{{ item }}"
    owner: "{{ ai_control_owner }}"
    group: "{{ ai_control_owner }}"
    mode: "0644"
  loop: "{{ ai_control_tree_files }}"
  register: ai_control_tree_copied
  notify: Restart ai-control

- name: Tree | the destination is still a real directory (before the find and prune)
  ansible.builtin.include_tasks: guard_dirs.yml
  vars:
    ai_control_guard_dirs: "{{ [ai_control_tree_dest] + (ai_control_tree_dirs | map('regex_replace', '^', ai_control_tree_dest ~ '/') | list) }}"

- name: Tree | installed files of {{ ai_control_tree_name }}
  ansible.builtin.find:
    paths: "{{ ai_control_tree_dest }}"
    recurse: true
    follow: false
    file_type: any
    hidden: true
  register: ai_control_tree_found

- name: Tree | anything else is removed from {{ ai_control_tree_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ai_control_tree_found.files | map(attribute='path') | reject('in', ai_control_tree_wanted) | sort }}"
  vars:
    ai_control_tree_wanted: >-
      {{ (ai_control_tree_dirs + ai_control_tree_files) | map('regex_replace', '^', ai_control_tree_dest ~ '/') | list }}
  register: ai_control_tree_pruned
  notify: Restart ai-control
