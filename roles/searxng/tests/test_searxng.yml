---
# Offline test for role searxng (no root, no Docker, nothing applied to this machine). Run it through
# tests/run.sh, which puts a fake `docker` (network listing only) first on PATH, loads the role's filter
# plugins, and afterwards proves the generated secret never reached the -vvv --diff output:
#   roles/searxng/tests/run.sh
#   1. preflight.yml: passes (also on a re-run, with the role's own network present), and refuses 14 bad inputs;
#   2. layout.yml: the secret is generated once (0600, 64 hex), never replaced on a re-run; symlinked dirs and
#      a symlinked .env are refused with the victim untouched;
#   3. settings.yml and compose.yaml rendered and checked key by key (docker compose config isn't available
#      here; on the host the role validates both with the image and with `docker compose config`).
- name: Role searxng renders a hardened, loopback-only SearXNG and keeps its secret out of the output
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../inventory/group_vars/all/main.yml
    - ../../../inventory/group_vars/all/versions.yml
    - ../defaults/main.yml
    - ../vars/main.yml
  vars:
    ansible_managed: Ansible managed
    test_tmp: ""
    test_networks_file: ""
    test_inspect_dir: ""
    test_fake_port: 0
    test_repo: "{{ playbook_dir }}/../../.."
    # Synthetic pin in the versions.yml form (the Lead pins the real digest).
    test_image: "docker.io/searxng/searxng:2026.10.25-54ca1d9cf@sha256:{{ 'ab' * 32 }}"
  tasks:
    - name: Run.sh passed a scratch dir and the fake docker's network file
      ansible.builtin.assert:
        that:
          - test_tmp is abs
          - test_networks_file is abs
          - test_inspect_dir is abs
          - test_fake_port | int > 0
          - lookup('ansible.builtin.pipe', 'command -v docker') == playbook_dir ~ '/bin/docker'
        fail_msg: Run this through roles/searxng/tests/run.sh (it puts the fake docker on PATH).
        quiet: true

    - name: Inputs, the scratch layout and the good values every refusal case starts from
      ansible.builtin.set_fact:
        images: "{{ images | combine({'searxng': test_image}) }}"
        searxng_docker_defaults_file: "{{ test_repo }}/roles/docker/defaults/main.yml"
        searxng_dir: "{{ test_tmp }}/srv/searxng"
        searxng_config_dir: "{{ test_tmp }}/srv/searxng/config"
        searxng_owner: "{{ lookup('ansible.builtin.pipe', 'id -un') }}"
        test_good:
          images: "{{ images | combine({'searxng': test_image}) }}"
          searxng_publish_host: 127.0.0.1
          searxng_subnet: "{{ searxng_subnet }}"
          searxng_gateway: "{{ searxng_gateway }}"
          searxng_ipv4: "{{ searxng_ipv4 }}"
          searxng_engines: "{{ searxng_engines }}"
          searxng_engine_categories: "{{ searxng_engine_categories }}"
          # What a converged ai-box has: docker0, ai_stack's `ai` network from the pools, host and none.
          networks: "bridge 172.17.0.0/16 \nai 172.20.0.0/24 \nhost \nnone \n"

    # ---- 1. preflight -----------------------------------------------------------------------------------
    - name: The role's defaults are the documented ones
      ansible.builtin.assert:
        that:
          - searxng_subnet == '172.29.16.0/28'
          - searxng_gateway == '172.29.16.1'
          - searxng_ipv4 == '172.29.16.2'
          - searxng_publish_host == '127.0.0.1' and searxng_publish_port == 8888
          - searxng_container_port == 8080
          - searxng_dir == test_tmp ~ '/srv/searxng'
        quiet: true

    - name: Preflight passes (first run)
      ansible.builtin.include_tasks: expect_preflight_pass.yml
      vars:
        networks: "{{ test_good.networks }}"

    - name: Preflight passes (re-run, the role's own network exists)
      ansible.builtin.include_tasks: expect_preflight_pass.yml
      vars:
        networks: "{{ test_good.networks }}research 172.29.16.0/28 \n"

    - name: Preflight refuses bad inputs
      ansible.builtin.include_tasks: expect_preflight_refusal.yml
      loop_control:
        loop_var: case
        label: "{{ case.name }}"
      loop:
        - name: an image without a digest
          vars: {images: {searxng: "docker.io/searxng/searxng:2026.10.25-54ca1d9cf"}}
          task: Preflight | role inputs
        - name: an image digest without a tag
          vars: {images: {searxng: "docker.io/searxng/searxng@sha256:{{ 'ab' * 32 }}"}}
          task: Preflight | role inputs
        - name: no image in versions.yml
          vars: {images: {}}
          task: Preflight | role inputs
        - name: a publish on all addresses
          vars: {searxng_publish_host: 0.0.0.0}
          task: Preflight | role inputs
        - name: a subnet inside a Docker pool (ai_stack's networks come from there)
          vars: {searxng_subnet: 172.20.9.0/28, searxng_gateway: 172.20.9.1, searxng_ipv4: 172.20.9.2}
          task: Preflight | the pinned network fits role docker's address plan
        - name: a subnet inside docker0
          vars: {searxng_subnet: 172.17.200.0/28, searxng_gateway: 172.17.200.1, searxng_ipv4: 172.17.200.2}
          task: Preflight | the pinned network fits role docker's address plan
        - name: a subnet inside hl-public
          vars: {searxng_subnet: 172.30.10.16/28, searxng_gateway: 172.30.10.17, searxng_ipv4: 172.30.10.18}
          task: Preflight | the pinned network fits role docker's address plan
        - name: a subnet outside the container range
          vars: {searxng_subnet: 10.99.0.0/28, searxng_gateway: 10.99.0.1, searxng_ipv4: 10.99.0.2}
          task: Preflight | the pinned network fits role docker's address plan
        - name: a /30 (too small)
          vars: {searxng_subnet: 172.29.16.0/30, searxng_gateway: 172.29.16.1, searxng_ipv4: 172.29.16.2}
          task: Preflight | the pinned network fits role docker's address plan
        - name: the container on the gateway address
          vars: {searxng_ipv4: 172.29.16.1}
          task: Preflight | the pinned network fits role docker's address plan
        - name: the container on the broadcast address
          vars: {searxng_ipv4: 172.29.16.15}
          task: Preflight | the pinned network fits role docker's address plan
        - name: the container outside its subnet
          vars: {searxng_ipv4: 172.29.17.2}
          task: Preflight | the pinned network fits role docker's address plan
        - name: an extra that turns the limiter on
          vars: {searxng_settings_extra: {server: {limiter: true}}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: an extra that puts the secret in the file
          vars: {searxng_settings_extra: {server: {secret_key: "not-a-real-secret"}}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: an extra that drops the json format
          vars: {searxng_settings_extra: {search: {formats: [html]}}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: an extra that adds an engine list
          vars: {searxng_settings_extra: {engines: [{name: google, engine: google}]}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: an extra that turns autocomplete on
          vars: {searxng_settings_extra: {search: {autocomplete: duckduckgo}}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: a category override for an engine that isn't kept (it would be added)
          vars: {searxng_engine_categories: {google: [general]}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: a category override without general
          vars: {searxng_engine_categories: {mdn: [it]}}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: startpage back in the engine list
          vars: {searxng_engines: [duckduckgo, startpage]}
          task: Preflight | the merged settings keep the contract (§12.16.2)
        - name: an existing network on the host that overlaps
          vars: {}
          networks: "bridge 172.17.0.0/16 \nlegacy 172.29.0.0/16 \n"
          task: Preflight | no existing Docker network overlaps the pinned subnet

    # ---- 2. layout and the secret -----------------------------------------------------------------------
    - name: Layout, first run (creates the secret)
      ansible.builtin.include_tasks: ../tasks/layout.yml

    - name: Stat the secret file after the first run
      ansible.builtin.stat:
        path: "{{ searxng_env_file }}"
        follow: false
      register: sx_test_env1

    - name: Layout, second run (keeps the secret)
      ansible.builtin.include_tasks: ../tasks/layout.yml

    - name: Stat the secret file after the second run
      ansible.builtin.stat:
        path: "{{ searxng_env_file }}"
        follow: false
      register: sx_test_env2

    # The value is checked by a script whose output is hidden; only its exit status is used.
    - name: The secret has the expected form (output hidden)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import re, sys
            data = open(sys.argv[1], "rb").read()
            sys.exit(0 if re.fullmatch(rb"SEARXNG_SECRET=[0-9a-f]{64}\n", data) else 1)
          - "{{ searxng_env_file }}"
      register: sx_test_secret_form
      changed_when: false
      failed_when: false
      no_log: true

    - name: The secret file is generated once, root-only, and in the expected form
      ansible.builtin.assert:
        that:
          - sx_test_env1.stat.isreg and not sx_test_env1.stat.islnk
          - sx_test_env1.stat.mode == '0600'
          - sx_test_env2.stat.mode == '0600'
          - sx_test_env1.stat.checksum == sx_test_env2.stat.checksum
          - sx_test_env1.stat.inode == sx_test_env2.stat.inode
          - sx_test_secret_form.rc == 0
        fail_msg: >-
          mode {{ sx_test_env1.stat.mode }}/{{ sx_test_env2.stat.mode }}, same content
          {{ sx_test_env1.stat.checksum == sx_test_env2.stat.checksum }}, form rc {{ sx_test_secret_form.rc }}
        quiet: true

    - name: Directories are 0755
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ searxng_dir }}"
        - "{{ searxng_config_dir }}"
      register: sx_test_dirs

    - name: Directories are real and 0755
      ansible.builtin.assert:
        that:
          - sx_test_dirs.results | map(attribute='stat.isdir') | list == [true, true]
          - sx_test_dirs.results | map(attribute='stat.mode') | list == ['0755', '0755']
        quiet: true

    - name: Layout refuses symlinks
      ansible.builtin.include_tasks: expect_layout_refusal.yml
      loop_control:
        loop_var: case
        label: "{{ case.name }}"
      loop:
        - name: project-dir
          kind: dir
          root: "{{ test_tmp }}/l1/searxng"
          link: "{{ test_tmp }}/l1/searxng"
          task: Layout | each directory is absent or a real directory (never a symlink)
          victim: ["sentinel|644|f", "|700|d", "keep"]
        - name: config-dir
          kind: dir
          root: "{{ test_tmp }}/l2/searxng"
          link: "{{ test_tmp }}/l2/searxng/config"
          task: Layout | each directory is absent or a real directory (never a symlink)
          victim: ["sentinel|644|f", "|700|d", "keep"]
        - name: env-file
          kind: file
          root: "{{ test_tmp }}/l3/searxng"
          link: "{{ test_tmp }}/l3/searxng/.env"
          task: Secret | refuse a .env that is a link or not a file
          victim: ["|644|f", "keep"]
        - name: env-dangling
          kind: dangling
          root: "{{ test_tmp }}/l4/searxng"
          link: "{{ test_tmp }}/l4/searxng/.env"
          task: Secret | refuse a .env that is a link or not a file
          victim: ["absent"]

    # The creation itself (searxng_secret_script, O_CREAT|O_EXCL|O_NOFOLLOW) refuses a dangling symlink and an
    # existing file, even without the stat check in front of it: the link's target is never created, the file
    # never rewritten.
    - name: Secret script | a dangling link and an existing file
      ansible.builtin.shell:
        cmd: |
          set -eu
          d="{{ test_tmp }}/script"
          mkdir -p "$d"
          ln -sfn "$d/target-never-created" "$d/dangling"
          echo keep > "$d/existing"
        executable: /bin/bash
      changed_when: true

    - name: Secret script | run it on each
      ansible.builtin.command:
        argv: [python3, -I, -c, "{{ searxng_secret_script }}", "{{ test_tmp }}/script/{{ item }}"]
      loop: [dangling, existing]
      register: sx_test_script
      changed_when: false
      failed_when: false
      no_log: true

    - name: Secret script | read what is there afterwards
      ansible.builtin.shell:
        cmd: |
          set -eu
          d="{{ test_tmp }}/script"
          [ -e "$d/target-never-created" ] && echo created || echo absent
          cat "$d/existing"
        executable: /bin/bash
      register: sx_test_script_after
      changed_when: false

    - name: Secret script | both refused (FileExistsError), nothing created or rewritten
      ansible.builtin.assert:
        that:
          - sx_test_script.results | map(attribute='rc') | list == [1, 1]
          - sx_test_script.results | map(attribute='stderr') | select('search', 'FileExistsError') | list | length == 2
          - sx_test_script_after.stdout_lines == ['absent', 'keep']
        fail_msg: "rcs {{ sx_test_script.results | map(attribute='rc') | list }}; after: {{ sx_test_script_after.stdout_lines }}"
        quiet: true

    # ---- 3. settings.yml and compose.yaml ---------------------------------------------------------------
    - name: Render settings.yml and compose.yaml
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ test_tmp }}/{{ item }}"
        mode: "0644"
      loop:
        - settings.yml
        - compose.yaml

    - name: Read them back
      ansible.builtin.slurp:
        src: "{{ test_tmp }}/{{ item }}"
      loop:
        - settings.yml
        - compose.yaml
      register: sx_test_rendered

    - name: Settings.yml is the contract's (§12.16.2)
      vars:
        raw: "{{ sx_test_rendered.results[0].content | b64decode }}"
        s: "{{ raw | from_yaml }}"
      ansible.builtin.assert:
        that:
          - s.keys() | sort == ['engines', 'general', 'search', 'server', 'use_default_settings', 'valkey']
          - s.use_default_settings.engines.keep_only == ['duckduckgo', 'brave', 'wikipedia', 'wikidata', 'mdn', 'github', 'stackoverflow', 'arxiv']
          - raw is not search('startpage')
          # The gate searches with no category: these four join `general` as well as their own categories.
          - s.engines | map(attribute='name') | list == ['mdn', 'github', 'stackoverflow', 'arxiv']
          - s.engines | map('dict2items') | map('map', attribute='key') | map('sort') | map('list') | unique | list == [['categories', 'name']]
          - (s.engines | selectattr('name', 'equalto', 'mdn') | first).categories == ['general', 'it']
          - (s.engines | selectattr('name', 'equalto', 'github') | first).categories == ['general', 'it', 'repos']
          - (s.engines | selectattr('name', 'equalto', 'stackoverflow') | first).categories == ['general', 'it', 'q&a']
          - (s.engines | selectattr('name', 'equalto', 'arxiv') | first).categories == ['general', 'science', 'scientific publications']
          - s.use_default_settings.engines.keys() | list == ['keep_only']
          - s.search.formats == ['html', 'json']
          - s.search.autocomplete == ''
          - s.search.favicon_resolver == ''
          - s.server.limiter is sameas false
          - s.server.public_instance is sameas false
          - s.server.image_proxy is sameas false
          - s.server.secret_key is not defined
          - s.general.enable_metrics is sameas false
          - s.valkey.url is sameas false
          - raw is not search('ultrasecretkey|SEARXNG_SECRET=')
        fail_msg: "{{ raw }}"
        quiet: true

    - name: Compose.yaml has the declared shape (structure check in place of docker compose config)
      vars:
        compose: "{{ sx_test_rendered.results[1].content | b64decode | from_yaml }}"
        svc: "{{ compose.services.searxng }}"
        net: "{{ compose.networks.research }}"
        allowed_keys: [cap_drop, container_name, env_file, environment, healthcheck, image, labels, mem_limit, memswap_limit,
                       networks, pids_limit, ports, read_only, restart, security_opt, tmpfs, user, volumes]
      ansible.builtin.assert:
        that:
          - compose.keys() | sort == ['name', 'networks', 'services']
          - compose.name == 'searxng'
          - compose.services.keys() | list == ['searxng']
          # Nothing beyond the reviewed keys (no privileged, cap_add, network_mode, devices, pid, ...).
          - svc.keys() | difference(allowed_keys) | list == []
          - svc.image == test_image
          - svc.container_name == 'searxng'
          - svc.restart == 'unless-stopped'
          # Hardening: the image's own user from the start, read-only root, no capabilities at all.
          - svc.user == '977:977'
          - svc.read_only is sameas true
          - svc.cap_drop == ['ALL']
          - svc.cap_add is not defined
          - svc.security_opt == ['no-new-privileges:true']
          - svc.mem_limit == '384m' and svc.memswap_limit == svc.mem_limit
          - svc.pids_limit == 128
          - svc.tmpfs == ['/tmp:size=64m,uid=977,gid=977,mode=0700', '/var/cache/searxng:size=64m,uid=977,gid=977,mode=0700']
          # The secret only through .env; nothing secret in the compose file.
          - svc.env_file == ['.env']
          - svc.environment.keys() | sort == ['FORCE_OWNERSHIP', 'GRANIAN_HOST', 'GRANIAN_PORT', 'PYTHONDONTWRITEBYTECODE', 'SEARXNG_SETTINGS_PATH']
          - svc.environment.GRANIAN_HOST == '0.0.0.0' and svc.environment.GRANIAN_PORT == '8080'
          - svc.environment.SEARXNG_SETTINGS_PATH == '/etc/searxng/settings.yml'
          # settings.yml: one read-only bind of the config dir, never auto-created.
          - svc.volumes | length == 1
          - svc.volumes[0].type == 'bind'
          - svc.volumes[0].source == searxng_config_dir and svc.volumes[0].target == '/etc/searxng'
          - svc.volumes[0].read_only is sameas true
          - svc.volumes[0].bind.create_host_path is sameas false
          # Published on loopback only, exactly once.
          - svc.ports == ['127.0.0.1:8888:8080']
          # Its own network, pinned address.
          - svc.networks.keys() | list == ['research']
          - svc.networks.research.ipv4_address == '172.29.16.2'
          - compose.networks.keys() | list == ['research']
          - net.name == 'research' and net.driver == 'bridge'
          - net.driver_opts['com.docker.network.bridge.name'] == 'br-research'
          - net.ipam.config | length == 1
          - net.ipam.config[0].keys() | sort == ['gateway', 'subnet']
          - net.ipam.config[0].subnet == '172.29.16.0/28' and net.ipam.config[0].gateway == '172.29.16.1'
          - net.internal is not defined and net.external is not defined
          # Healthcheck in the container; labels.
          - svc.healthcheck.test == ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
          - svc.labels['homelab.watch'] == 'true'
          - svc.labels['homelab.config-hash'] == searxng_settings_hash
          - svc.labels['homelab.config-hash'] | length == 64
        fail_msg: "{{ compose | to_nice_yaml }}"
        quiet: true

    - name: A settings change changes the config-hash label (the container is recreated)
      vars:
        other: "{{ searxng_settings_base | combine({'general': {'instance_name': 'other'}}, recursive=true) }}"
      ansible.builtin.assert:
        that:
          - (other | to_nice_yaml(indent=2, sort_keys=true) | hash('sha256')) != searxng_settings_hash
        quiet: true

    # ---- 4. verify.yml against the fake docker and a fake SearXNG -----------------------------------------
    # run.sh serves a fake SearXNG on 127.0.0.1:<test_fake_port> and writes the fake docker's inspect fixtures,
    # whose Config.Env carries a canary SEARXNG_SECRET (never known to this play). verify.yml runs at -vvv;
    # run.sh then greps the output for the canary. The fake container sits at 127.0.0.1 so the "direct" URL
    # (searxng_ipv4:searxng_container_port) reaches the fake server too.
    - name: Verify | the good container
      ansible.builtin.command:
        argv: [cp, "{{ test_inspect_dir }}/good.json", "{{ test_inspect_dir }}/inspect.json"]
      changed_when: true

    - name: Verify | passes on the good container
      ansible.builtin.include_tasks: ../tasks/verify.yml
      vars:
        searxng_ipv4: 127.0.0.1
        searxng_container_port: "{{ test_fake_port | int }}"
        searxng_publish_port: "{{ test_fake_port | int }}"
        searxng_verify_retries: 1
        searxng_verify_delay: 0

    - name: Verify | refuses a container with a capability added
      block:
        - name: Verify | the container with CAP_NET_ADMIN
          ansible.builtin.command:
            argv: [cp, "{{ test_inspect_dir }}/capadd.json", "{{ test_inspect_dir }}/inspect.json"]
          changed_when: true

        - name: Verify | run against it
          ansible.builtin.include_tasks: ../tasks/verify.yml
          vars:
            searxng_ipv4: 127.0.0.1
            searxng_container_port: "{{ test_fake_port | int }}"
            searxng_publish_port: "{{ test_fake_port | int }}"
            searxng_verify_retries: 1
            searxng_verify_delay: 0

        - name: Verify | not reached
          ansible.builtin.set_fact:
            sx_test_verify_by: ""
      rescue:
        - name: Verify | note which task refused
          ansible.builtin.set_fact:
            sx_test_verify_by: "{{ ansible_failed_task.name }}"

    - name: Verify | refused by the hardening assert
      ansible.builtin.assert:
        that: sx_test_verify_by == 'Verify | pinned address, one network, hardening as declared'
        fail_msg: "refused by '{{ sx_test_verify_by }}'"
        quiet: true
