---
# Role stacks (docs/CONTRACTS.md §2, §5, §6). Identifiers (lan_ip, tailnet_fqdn, media_uuid) come from
# host_vars, secrets from the vault, image references only from versions.yml (images.*, local_images.*).

# Shared bridge between the edge project (cloudflared) and the media project (jellyfin).
stacks_public_network: hl-public
stacks_public_subnet: 172.30.10.0/24
stacks_public_bridge: br-hl-public

# The boot gate's proof that /media is the real drive (created by role storage).
stacks_media_sentinel: "{{ media_mount }}/.homelab-media-sentinel"
# Library folders on the drive. Created 1001:1002 2775 only after the mount is verified.
# downloads/complete/{tv,movies} are SABnzbd's category folders (relative paths `tv`/`movies`). SABnzbd only
# creates them on the first download; pre-creating them keeps the Sonarr/Radarr path checks quiet.
stacks_media_dirs:
  - tv
  - movies
  - downloads
  - downloads/complete
  - downloads/complete/tv
  - downloads/complete/movies

# App config dirs under homelab_data_dir. linuxserver images chown /config to PUID:PGID on every
# start, so their dirs are declared with that same owner/group or every run would flip them back.
stacks_app_dirs:
  - { name: jellyfin, owner: "{{ mediasvc_uid }}", group: "{{ media_gid }}" }
  - { name: sonarr, owner: "{{ mediasvc_uid }}", group: "{{ media_gid }}" }
  - { name: radarr, owner: "{{ mediasvc_uid }}", group: "{{ media_gid }}" }
  - { name: prowlarr, owner: "{{ mediasvc_uid }}", group: "{{ media_gid }}" }
  - { name: sabnzbd, owner: "{{ mediasvc_uid }}", group: "{{ media_gid }}" }
  - { name: jellyseerr, owner: 0, group: 0 }   # the image runs as root
stacks_app_dir_mode: "0750"

# Retired push stack (push-core, absorbed by Dashboard v2, docs/CONTRACTS.md §11.5): what tasks/retire_push.yml
# removes from hosts that still have it. The push store and the uid 10101 account are role dashboard's.
stacks_retired_push_container: push-core
stacks_retired_push_network: push_default
stacks_retired_push_image_repo: homelab/push-core

# wol-relay runs with host networking; "nobody" so the process maps to no real host account.
stacks_wol_relay_port: 9999
stacks_wol_relay_user: "65534:65534"

stacks_mem_limits:
  jellyfin: 2g
  sonarr: 1g
  radarr: 1g
  prowlarr: 512m
  sabnzbd: 1g
  jellyseerr: 512m
  cloudflared: 256m
  wol_relay: 128m

# docker compose up --wait: fail the run if a container is not healthy within this many seconds.
stacks_compose_wait_timeout: 300
