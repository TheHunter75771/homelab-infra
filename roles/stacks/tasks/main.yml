---
# Role stacks (docs/CONTRACTS.md §6): network, layout, presets and the three compose projects.
# Order: checks -> layout -> retire push -> network -> media -> edge -> utils. Every compose project is
# brought up with community.docker.docker_compose_v2 (state present), so a re-run reports changed=0.
# push-core is retired (§11.5): Dashboard v2 (role dashboard, after this role) serves 127.0.0.1:8085.

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Directory layout
  ansible.builtin.import_tasks: layout.yml

- name: Retired push stack (push-core, replaced by the dashboard)
  ansible.builtin.import_tasks: retire_push.yml

- name: Shared network for the tunnel
  community.docker.docker_network:
    name: "{{ stacks_public_network }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: "{{ stacks_public_bridge }}"
    ipam_config:
      - subnet: "{{ stacks_public_subnet }}"
    state: present

- name: Media stack
  ansible.builtin.import_tasks: media.yml

- name: Edge stack (tunnel)
  ansible.builtin.import_tasks: edge.yml

- name: Utils stack (wol-relay)
  ansible.builtin.import_tasks: utils.yml
