---
# Push store (contract 4). push-core runs as uid:gid {{ stacks_pushcore_uid }}:{{ stacks_pushcore_gid }}; the host gets the
# same ids as a system user/group "pushcore" so ownership is readable and the ids stay reserved.

- name: Push | pushcore group (gid of the push-core container)
  ansible.builtin.group:
    name: "{{ stacks_pushcore_user }}"
    gid: "{{ stacks_pushcore_gid }}"
    system: true

- name: Push | pushcore system user (uid of the push-core container, no login)
  ansible.builtin.user:
    name: "{{ stacks_pushcore_user }}"
    uid: "{{ stacks_pushcore_uid }}"
    group: "{{ stacks_pushcore_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Push | push store directory (push-core writes subscriptions.json here)
  ansible.builtin.file:
    path: "{{ homelab_push_dir }}"
    state: directory
    owner: "{{ stacks_pushcore_user }}"
    group: "{{ stacks_pushcore_user }}"
    mode: "0750"

- name: Push | VAPID keys from the vault
  ansible.builtin.copy:
    dest: "{{ homelab_push_dir }}/vapid.json"
    content: >-
      {{ {'publicKey': vapid_public_key, 'privateKey': vapid_private_key, 'subject': vapid_subject}
         | to_nice_json(indent=2) }}
    owner: root
    group: "{{ stacks_pushcore_user }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart push-core

# Seeded once so the notifier and the heartbeat sync see a valid, empty list on a clean start.
# push-core owns the file afterwards (atomic tmp + rename).
- name: Push | empty subscription list on a clean start
  ansible.builtin.copy:
    dest: "{{ homelab_push_dir }}/subscriptions.json"
    content: "[]\n"
    owner: "{{ stacks_pushcore_user }}"
    group: "{{ stacks_pushcore_user }}"
    mode: "0640"
    force: false

- name: Push | push-core source on the host (build context, a copy of apps/push-core/)
  ansible.posix.synchronize:
    src: "{{ stacks_push_core_src }}"
    dest: "{{ homelab_stacks_dir }}/push/src/"
    delete: true
    checksum: true
    times: false
    owner: false
    group: false
    perms: true
    # The plugin's own default is a hard-coded plain "sudo rsync"; use the play's become binary, non-interactive.
    rsync_path: "{{ ansible_become_exe | default('sudo') }} -n rsync"
    rsync_opts: "{{ stacks_push_core_sync_excludes | map('regex_replace', '^', '--exclude=') | list + ['--chmod=D0755,F0644'] }}"

- name: Push | build gate for push-core
  ansible.builtin.import_tasks: local_image.yml
  vars:
    stacks_li_stack: push
    stacks_li_context: "{{ homelab_stacks_dir }}/push/src"
    stacks_li_image: "{{ local_images.push_core }}"

- name: Push | compose definition
  ansible.builtin.template:
    src: push-compose.yaml.j2
    dest: "{{ homelab_stacks_dir }}/push/compose.yaml"
    owner: root
    group: root
    mode: "0644"
    validate: docker compose --project-directory {{ homelab_stacks_dir }}/push -f %s config --quiet

# Built only when the build gate says so (source hash not on the current image); otherwise --no-build.
- name: Push | push-core is up and healthy (built only if its source changed)
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_stacks_dir }}/push"
    state: present
    build: "{{ stacks_local_build.push.build }}"
    pull: never
    remove_orphans: true
    wait: true
    wait_timeout: "{{ stacks_compose_wait_timeout }}"
