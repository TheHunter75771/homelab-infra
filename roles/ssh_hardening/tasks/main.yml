---
- name: OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Homelab sshd drop-in is in place (checked with sshd -t before it's installed)
  ansible.builtin.template:
    src: 10-homelab.conf.j2
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# The whole config (sshd_config plus every drop-in) must be valid before anything is removed.
- name: Full sshd configuration is valid
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

- name: Stale hand-made drop-ins are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ssh_hardening_stale_dropins }}"
  notify: Reload sshd

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_hardening_effective
  changed_when: false
  check_mode: false

- name: Effective sshd configuration is key-only, no root, no X11, limited users
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in ssh_hardening_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in ssh_hardening_effective.stdout_lines"
      - "'pubkeyauthentication yes' in ssh_hardening_effective.stdout_lines"
      - "'authenticationmethods publickey' in ssh_hardening_effective.stdout_lines"
      - "'permitrootlogin no' in ssh_hardening_effective.stdout_lines"
      - "'x11forwarding no' in ssh_hardening_effective.stdout_lines"
      - "('maxauthtries ' ~ ssh_hardening_max_auth_tries) in ssh_hardening_effective.stdout_lines"
      - ssh_hardening_allow_users | map('regex_replace', '^', 'allowusers ') | difference(ssh_hardening_effective.stdout_lines) | length == 0
    fail_msg: "sshd's effective configuration does not match the homelab drop-in; check sshd_config and its drop-ins."
    quiet: true
