---
# A restart (not a reload) is what makes resolved bind or release the stub listener.
- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    state: restarted

# Re-reads .network files and reconfigures only the links they match (here the Wi-Fi uplink);
# the LAN link isn't touched. Never `netplan apply`.
- name: Reload systemd-networkd config (dns)
  ansible.builtin.command: networkctl reload
  changed_when: true
