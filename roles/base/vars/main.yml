---
# Live values the hardening file must produce (tasks/sysctl_live.yml), as paths under /proc/sys.
# Same settings as templates/sysctl-homelab-hardening.conf.j2; the LAN interface's send_redirects is
# added below because a mapping key isn't templated.
base_sysctl_live_expected_fixed:
  net/ipv4/conf/all/send_redirects: "0"
  net/ipv4/conf/default/send_redirects: "0"
  net/ipv4/conf/all/log_martians: "1"
  net/ipv4/conf/default/log_martians: "1"
  fs/suid_dumpable: "0"
  fs/protected_fifos: "2"
  kernel/kptr_restrict: "2"
  net/core/bpf_jit_harden: "2"
  kernel/unprivileged_bpf_disabled: "1"
base_sysctl_live_expected: >-
  {{ base_sysctl_live_expected_fixed | combine({'net/ipv4/conf/' ~ lan_iface ~ '/send_redirects': '0'}) }}
# Read too, but not set by us: the emergency SysRq path must stay available (asserted != 0).
base_sysctl_live_keys: "{{ (base_sysctl_live_expected | list) + ['kernel/sysrq'] }}"
# Whether the sudo alternative is managed at all (tasks/sudo.yml).
base_sudo_wanted: "{{ base_sudo_alternative | length > 0 and ansible_facts.os_family | default('') == 'Debian' }}"
