---
- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# Only re-reads unit files. wait-online is a boot-time oneshot; the new command takes effect at
# the next boot (it isn't re-run mid-play).
- name: Reload systemd units (base)
  ansible.builtin.systemd_service:
    daemon_reload: true

# Re-reads the *.sources files; no chronyd restart needed.
- name: Reload chrony sources (base)
  ansible.builtin.command: chronyc reload sources
  changed_when: true

# Rereads chrony.conf and conf.d (makestep isn't reloadable). Runs after the sources reload above.
- name: Restart chrony (base)
  ansible.builtin.systemd_service:
    name: chrony.service
    state: restarted

# Only this file, through systemd-sysctl, which expands the net.ipv4.conf.* glob (sysctl.d(5); procps
# sysctl(8) documents no glob support). Other services' runtime settings aren't re-applied.
- name: Apply hardening sysctls (base)
  ansible.builtin.command:
    argv:
      - /usr/lib/systemd/systemd-sysctl
      - "{{ base_sysctl_file }}"
  changed_when: true
