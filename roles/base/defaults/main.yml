---
# Packages every host gets (docs/CONTRACTS.md §7).
base_packages:
  - sqlite3
  - rsync
  - jq
  - smartmontools
  - unattended-upgrades
  - needrestart
  - curl

# journald: persistent storage, capped.
base_journald_system_max_use: 500M

# Seconds systemd-networkd-wait-online waits for lan_iface to be routable at boot.
base_wait_online_timeout: 60

# IP-literal plain-NTP sources (Cloudflare anycast time). They need no DNS, so they break the
# loop "clock badly wrong -> TLS fails -> no DNS (strict DoT) -> NTS hostnames unresolvable".
base_ntp_fallback_servers:
  - 162.159.200.123
  - 162.159.200.1

# mDNS off: avahi announced the host on every link, including the public Wi-Fi backup uplink.
# Purging it removes only avahi-daemon and avahi-utils (checked with apt-get -s on the box).
base_purge_packages:
  - avahi-daemon
  - avahi-utils
# Pinned to -1 so a Recommends (libnss-mdns recommends avahi-daemon) or an upgrade can't bring it back.
base_never_install:
  - avahi-daemon

# Apport can't be purged (ubuntu-server and ubuntu-server-minimal depend on it), so it's stopped and
# masked. Its own stop hook resets fs.suid_dumpable to 0 and kernel.core_pattern to "core".
base_apport_units:
  - apport.service
  - apport-autoreport.path
  - apport-autoreport.timer
  - apport-forward.socket

# Network and core-dump hardening (Lynis/CIS items from the 2026-10-24 audit).
base_sysctl_file: /etc/sysctl.d/60-homelab-hardening.conf
