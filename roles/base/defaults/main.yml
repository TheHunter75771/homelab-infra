---
# Packages every host gets (docs/CONTRACTS.md §7).
base_packages:
  - sqlite3
  - rsync
  - jq
  - smartmontools
  - unattended-upgrades
  - needrestart
  - curl

# journald: persistent storage, capped.
base_journald_system_max_use: 500M

# Seconds systemd-networkd-wait-online waits for lan_iface to be routable at boot.
base_wait_online_timeout: 60

# IP-literal plain-NTP sources from two operators, one each. They need no DNS, so they break the loop
# "clock badly wrong -> TLS fails -> no DNS (strict DoT) -> NTS hostnames unresolvable".
# - Cloudflare (time.cloudflare.com, anycast): 162.159.200.123
# - Google (time1.google.com, anycast; developers.google.com/time): 216.239.35.0
# Checked 2026-10-26: DNS for those names returns these addresses, and each answers an NTP client
# query (mode 4; Cloudflare stratum 3, Google stratum 1 refid GOOG).
# Only two on purpose: in normal operation Ubuntu's NTS pools (five, marked prefer) must stay the
# majority when chrony votes out falsetickers, so the unauthenticated sources can't outvote them.
# Google smears leap seconds and Cloudflare doesn't; that can only matter in the day around a leap
# second, and only while no NTS source is selectable.
base_ntp_fallback_servers:
  - 162.159.200.123
  - 216.239.35.0
# chrony steps the clock when the offset is above this many seconds, at any time (limit -1), not only
# during its first 3 updates (Ubuntu's makestep 1 3). A clock that comes up months off (dead RTC battery)
# is stepped as soon as a source answers, however long that takes, instead of being slewed for years.
base_chrony_makestep_threshold: 1
base_chrony_makestep_limit: -1
# chrony's default "authselectmode mix" makes every NTS source *required*: while NTS can't work (a wrong
# clock breaks its TLS, and the pools' placeholder sources still count), no unauthenticated source can
# ever be selected, so the IP fallback above is dead exactly when it's needed (ai-box, 2026-10-26;
# docs/CONTRACTS.md §12.9). "ignore" drops that requirement; the NTS pools keep "prefer", so chrony still
# uses only them whenever one is selectable.
base_chrony_authselectmode: ignore

# mDNS off: avahi announced the host on every link, including the public Wi-Fi backup uplink.
# Purging it removes only avahi-daemon and avahi-utils (checked with apt-get -s on the box).
base_purge_packages:
  - avahi-daemon
  - avahi-utils
# Pinned to -1 so a Recommends (libnss-mdns recommends avahi-daemon) or an upgrade can't bring it back.
base_never_install:
  - avahi-daemon

# Apport can't be purged (ubuntu-server and ubuntu-server-minimal depend on it), so it's stopped and
# masked. Its own stop hook resets fs.suid_dumpable to 0 and kernel.core_pattern to "core".
base_apport_units:
  - apport.service
  - apport-autoreport.path
  - apport-autoreport.timer
  - apport-forward.socket

# Network and core-dump hardening (Lynis/CIS items from the 2026-10-24 audit).
# "99-zz-" sorts after every vendor file (sysctl.d applies files in name order; the last setting
# wins), including Debian's 99-sysctl.conf. The precedence check below proves it on every run.
base_sysctl_file: /etc/sysctl.d/99-zz-homelab-hardening.conf
# Owner of that file (tests/test_sysctl_files.yml runs unprivileged and passes its own user).
base_sysctl_file_owner: root
base_sysctl_file_group: root
# Earlier names of our own file, removed after the new one is in place.
base_sysctl_stale_files:
  - /etc/sysctl.d/60-homelab-hardening.conf

# Network protocols nothing here uses; modprobe refuses to load them (install -> /bin/false).
# dccp no longer exists in this kernel (removed upstream in 6.16); listing it guards against a
# kernel that brings it back.
base_blacklisted_modules:
  - dccp
  - sctp
  - rds
  - tipc

# Where the live sysctl values are read, and the command that re-applies the hardening file when one
# drifted (tasks/sysctl_live.yml). tests/test_sysctl_live.yml points both at a scratch tree.
base_sysctl_proc_dir: /proc/sys
base_sysctl_apply_argv:
  - /usr/lib/systemd/systemd-sysctl
  - "{{ base_sysctl_file }}"

# Classic sudo instead of sudo-rs (docs/CONTRACTS.md §12.13): the "sudo" alternative is set to this path
# in manual mode, on Debian-family hosts where it's a registered alternative. Empty: leave sudo alone.
base_sudo_alternative: /usr/bin/sudo.ws
# Classic visudo, which the classic alternative links as /usr/sbin/visudo (sudo's debian/sudo.alternatives).
base_sudo_visudo: /usr/sbin/visudo.ws
