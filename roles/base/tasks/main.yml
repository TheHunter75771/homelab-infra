---
- name: Host timezone is set
  community.general.timezone:
    name: "{{ timezone }}"

- name: Base packages are installed
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Journald keeps a persistent, capped journal
  ansible.builtin.template:
    src: journald-homelab.conf.j2
    dest: /etc/systemd/journald.conf.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

# A drop-in after 50unattended-upgrades: the package's conffile stays untouched, so package
# upgrades never stop on a conffile prompt (unattended-upgrades skips packages that would).
- name: Unattended-upgrades installs security updates only and never reboots
  ansible.builtin.template:
    src: unattended-upgrades-homelab.j2
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/apt-config -c %s dump

- name: LAN interface is set
  ansible.builtin.assert:
    that:
      - lan_iface | default('') | length > 0
    fail_msg: Set lan_iface in host_vars (network-online waits for it).
    quiet: true

- name: Wait-online drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Netplan is not edited (`netplan apply` can bounce the LAN link mid-run); this overrides the
# unit's command instead.
- name: Network-online waits only for the LAN interface
  ansible.builtin.template:
    src: wait-online-homelab.conf.j2
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/zz-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd units (base)

- name: Chrony is installed
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Chrony service is enabled and running
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: started

- name: Chrony has time sources that don't need DNS
  ansible.builtin.template:
    src: chrony-homelab-fallback.sources.j2
    dest: /etc/chrony/sources.d/homelab-fallback.sources
    owner: root
    group: root
    mode: "0644"
  notify: Reload chrony sources (base)

- name: APT timers that drive unattended-upgrades are enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
