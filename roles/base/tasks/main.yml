---
- name: Host timezone is set
  community.general.timezone:
    name: "{{ timezone }}"

- name: Base packages are installed
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Journald keeps a persistent, capped journal
  ansible.builtin.template:
    src: journald-homelab.conf.j2
    dest: /etc/systemd/journald.conf.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

# A drop-in after 50unattended-upgrades: the package's conffile stays untouched, so package
# upgrades never stop on a conffile prompt (unattended-upgrades skips packages that would).
- name: Unattended-upgrades installs security updates only and never reboots
  ansible.builtin.template:
    src: unattended-upgrades-homelab.j2
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/apt-config -c %s dump

- name: LAN interface is set
  ansible.builtin.assert:
    that:
      - lan_iface | default('') | length > 0
    fail_msg: Set lan_iface in host_vars (network-online waits for it).
    quiet: true

- name: Wait-online drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Netplan is not edited (`netplan apply` can bounce the LAN link mid-run); this overrides the
# unit's command instead.
- name: Network-online waits only for the LAN interface
  ansible.builtin.template:
    src: wait-online-homelab.conf.j2
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/zz-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd units (base)

- name: Chrony is installed
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Chrony service is enabled and running
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: started

- name: Chrony has time sources that don't need DNS
  ansible.builtin.template:
    src: chrony-homelab-fallback.sources.j2
    dest: /etc/chrony/sources.d/homelab-fallback.sources
    owner: root
    group: root
    mode: "0644"
  notify: Reload chrony sources (base)

- name: APT timers that drive unattended-upgrades are enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Avahi (mDNS) is purged
  ansible.builtin.apt:
    name: "{{ base_purge_packages }}"
    state: absent
    purge: true

- name: APT never installs the purged packages again
  ansible.builtin.template:
    src: apt-never-install.pref.j2
    dest: /etc/apt/preferences.d/homelab-never-install.pref
    owner: root
    group: root
    mode: "0644"

- name: Look for apport's units
  ansible.builtin.stat:
    path: "/usr/lib/systemd/system/{{ item }}"
  loop: "{{ base_apport_units }}"
  register: base_apport_unit_files

# Stop before masking: apport's ExecStop puts fs.suid_dumpable and kernel.core_pattern back.
- name: Apport is stopped
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
  loop: "{{ base_apport_unit_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Apport can't start again (masked)
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    masked: true
  loop: "{{ base_apport_unit_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Hardening sysctl file (new name, old names removed)
  ansible.builtin.import_tasks: sysctl_files.yml

- name: Unused network protocols can't be loaded
  ansible.builtin.template:
    src: modprobe-homelab-blacklist.conf.j2
    dest: /etc/modprobe.d/homelab-blacklist-net.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply base changes before checking them
  ansible.builtin.meta: flush_handlers

- name: Read the live hardening settings
  ansible.builtin.slurp:
    src: "/proc/sys/{{ item }}"
  loop:
    - net/ipv4/conf/all/send_redirects
    - net/ipv4/conf/default/send_redirects
    - "net/ipv4/conf/{{ lan_iface }}/send_redirects"
    - net/ipv4/conf/all/log_martians
    - net/ipv4/conf/default/log_martians
    - fs/suid_dumpable
    - fs/protected_fifos
    - kernel/kptr_restrict
    - net/core/bpf_jit_harden
    - kernel/unprivileged_bpf_disabled
    - kernel/sysrq
  register: base_sysctl_live

- name: Hardening sysctls are live (redirects off incl. the LAN interface, martians logged, BPF/kptr/FIFO locked down)
  ansible.builtin.assert:
    that:
      - base_live['net/ipv4/conf/all/send_redirects'] == '0'
      - base_live['net/ipv4/conf/default/send_redirects'] == '0'
      - base_live['net/ipv4/conf/' ~ lan_iface ~ '/send_redirects'] == '0'
      - base_live['net/ipv4/conf/all/log_martians'] == '1'
      - base_live['net/ipv4/conf/default/log_martians'] == '1'
      - base_live['fs/suid_dumpable'] == '0'
      - base_live['fs/protected_fifos'] == '2'
      - base_live['kernel/kptr_restrict'] == '2'
      - base_live['net/core/bpf_jit_harden'] == '2'
      - base_live['kernel/unprivileged_bpf_disabled'] == '1'
      # Left alone on purpose: the emergency SysRq path must still exist. (Forwarding isn't checked:
      # base runs before Docker, which is what turns it on.)
      - base_live['kernel/sysrq'] != '0'
    fail_msg: "Live kernel settings: {{ base_live }}"
    quiet: true
  vars:
    base_live: >-
      {{ dict(base_sysctl_live.results | map(attribute='item')
         | zip(base_sysctl_live.results | map(attribute='content') | map('b64decode') | map('trim'))) }}

# The live check above only proves the values right after our handler. This one proves they
# survive a reboot: systemd-sysctl merges every sysctl.d file in name order, and a later vendor
# file (or an explicit key that a glob then skips) would silently undo ours at the next boot.
- name: Read the merged sysctl configuration that systemd applies at boot
  ansible.builtin.command: /usr/lib/systemd/systemd-sysctl --cat-config --no-pager
  register: base_sysctl_merged
  changed_when: false
  check_mode: false

- name: Hardening settings win at boot
  ansible.builtin.import_tasks: sysctl_boot_check.yml

- name: Read service states
  ansible.builtin.service_facts:

- name: Avahi is gone and apport is masked
  ansible.builtin.assert:
    that:
      - ansible_facts.services['avahi-daemon.service'] is not defined
        or ansible_facts.services['avahi-daemon.service'].status in ['masked', 'not-found']
      - ansible_facts.services['apport.service'] is not defined
        or ansible_facts.services['apport.service'].status == 'masked'
    fail_msg: >-
      avahi-daemon: {{ ansible_facts.services['avahi-daemon.service'] | default('absent') }};
      apport: {{ ansible_facts.services['apport.service'] | default('absent') }}
    quiet: true

- name: Look for anything listening on UDP 5353 (mDNS)
  ansible.builtin.command:
    argv: [ss, -H, -l, -n, -u, sport, "=", ":5353"]
  register: base_mdns_listeners
  changed_when: false
  check_mode: false

- name: Nothing listens on UDP 5353
  ansible.builtin.assert:
    that:
      - base_mdns_listeners.stdout | trim | length == 0
    fail_msg: "Still listening on 5353: {{ base_mdns_listeners.stdout_lines }}"
    quiet: true

- name: Ask modprobe what loading each blacklisted protocol would do
  ansible.builtin.command:
    argv: [modprobe, --dry-run, --verbose, "{{ item }}"]
  loop: "{{ base_blacklisted_modules }}"
  register: base_blacklist_dry_run
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the loaded modules
  ansible.builtin.slurp:
    src: /proc/modules
  register: base_proc_modules

# A dry run of a blacklisted module shows its own action as "install /bin/false" (dccp too: it's
# not in this kernel, but the install line still defines it). Shared helper modules a protocol
# depends on (sctp and tipc pull in udp_tunnel) may still show as insmod, which is harmless; the
# protocol module itself must never be insmod'ed.
- name: Each blacklisted protocol resolves to /bin/false, never to its own module
  ansible.builtin.assert:
    that:
      - item.stdout is search('install /bin/false')
      - item.stdout is not search('insmod [^ ]*/' ~ item.item ~ '[.]ko')
    fail_msg: "modprobe --dry-run {{ item.item }}: {{ item.stdout_lines | default([]) }} {{ item.stderr | default('') }}"
    quiet: true
  loop: "{{ base_blacklist_dry_run.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: No blacklisted protocol is loaded
  ansible.builtin.assert:
    that:
      - base_loaded | intersect(base_blacklisted_modules) | length == 0
    fail_msg: "Loaded: {{ base_loaded | intersect(base_blacklisted_modules) }} (the blacklist stops new loads; unload or reboot)"
    quiet: true
  vars:
    base_loaded: "{{ (base_proc_modules.content | b64decode).splitlines() | map('split') | map('first') | list }}"
