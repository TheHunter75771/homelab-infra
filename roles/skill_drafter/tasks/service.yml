---
- name: Service | skill-drafter unit
  ansible.builtin.template:
    src: skill-drafter.service.j2
    dest: "{{ skill_drafter_unit_dir }}/{{ skill_drafter_service }}"
    owner: "{{ skill_drafter_root_owner }}"
    group: "{{ skill_drafter_root_owner }}"
    mode: "0644"
    follow: false
  notify:
    - Reload systemd for skill-drafter
    - Restart skill-drafter

# Reload the unit, then restart it if it is enabled and something changed.
- name: Service | apply pending reloads and restarts
  ansible.builtin.meta: flush_handlers

# The switch. Off: installed only; a drafter that was on is stopped and disabled.
- name: Service | skill-drafter on (enabled, running) or off (installed only)
  ansible.builtin.systemd_service:
    name: "{{ skill_drafter_service }}"
    enabled: "{{ skill_drafter_enabled | bool }}"
    state: "{{ 'started' if skill_drafter_enabled | bool else 'stopped' }}"
  ignore_errors: "{{ ansible_check_mode }}"
