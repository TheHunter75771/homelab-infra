---
# §12.17.2: ailib's Samba password is generated ONCE on this host into a root-only file and handed to
# smbpasswd on stdin; a converge never rotates it. The password never passes through Ansible here:
# Python on the host writes 48 hex chars from secrets.token_hex(24) straight into a new file
# (O_CREAT|O_EXCL|O_NOFOLLOW, 0600), and a second Python reads that file and pipes it to
# `smbpasswd -a -s`, so it is never in argv (`ps`) or a registered result. Every task that touches it
# is no_log anyway (tests/check_no_log.py). Rotation is manual: delete the file, converge both plays.
- name: Password | root-only secrets directory
  ansible.builtin.file:
    path: "{{ ai_library_share_secret_dir }}"
    state: directory
    owner: "{{ ai_library_share_secret_owner }}"
    group: "{{ ai_library_share_secret_owner }}"
    mode: "0700"

- name: Password | is there a password file already
  ansible.builtin.stat:
    path: "{{ ai_library_share_password_file }}"
    follow: false
    get_checksum: false
  register: ai_library_share_password_stat

- name: Password | an existing password file is a regular file (never a symlink)
  ansible.builtin.assert:
    that:
      - ai_library_share_password_stat.stat.isreg | default(false)
      - not (ai_library_share_password_stat.stat.islnk | default(false))
    fail_msg: >-
      {{ ai_library_share_password_file }} exists but isn't a regular file. Remove it by hand; the role then
      generates a new password (and the client play copies it to ai-box).
    quiet: true
  when: ai_library_share_password_stat.stat.exists

- name: Password | generate the password on the host (only when absent)
  ansible.builtin.command:
    argv:
      - "{{ ai_library_share_python }}"
      - -I
      - -B
      - -c
      - |
        import os, secrets, sys
        path = sys.argv[1]
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
        try:
            os.fchmod(fd, 0o600)
            data = (secrets.token_hex(24) + "\n").encode("ascii")
            while data:
                data = data[os.write(fd, data):]
            os.fsync(fd)
        except BaseException:
            os.close(fd)
            os.unlink(path)
            raise
        os.close(fd)
      - "{{ ai_library_share_password_file }}"
  register: ai_library_share_password_generated
  changed_when: true
  no_log: true
  when: not ai_library_share_password_stat.stat.exists

- name: Password | password file owner and mode (never the content)
  ansible.builtin.file:
    path: "{{ ai_library_share_password_file }}"
    state: file
    follow: false
    owner: "{{ ai_library_share_secret_owner }}"
    group: "{{ ai_library_share_secret_owner }}"
    mode: "0600"
  when: ai_library_share_password_stat.stat.exists or not ansible_check_mode

# Read-only: does Samba's passdb already hold ailib? (rc 0 yes, anything else no).
- name: Password | is ailib in the Samba passdb
  ansible.builtin.command:
    argv: ["{{ ai_library_share_pdbedit }}", -L, -u, "{{ ai_library_share_user }}"]
  register: ai_library_share_pdbedit_result
  changed_when: false
  failed_when: false
  check_mode: false

# Set only when the account is missing from passdb or the password was just generated: an existing
# account keeps its password (never rotated). The password goes file -> Python -> smbpasswd's stdin.
- name: Password | set the Samba password from the file (stdin only)
  ansible.builtin.command:
    argv:
      - "{{ ai_library_share_python }}"
      - -I
      - -B
      - -c
      - |
        import subprocess, sys
        prog, path, user = sys.argv[1:4]
        with open(path, encoding="ascii") as fh:
            pw = fh.read().strip()
        if len(pw) < 32:
            sys.exit("the password file holds fewer than 32 characters")
        res = subprocess.run([prog, "-a", "-s", user], input=f"{pw}\n{pw}\n", text=True,
                             stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, check=False)
        if res.returncode != 0:
            sys.exit(f"smbpasswd exited {res.returncode}")
      - "{{ ai_library_share_smbpasswd }}"
      - "{{ ai_library_share_password_file }}"
      - "{{ ai_library_share_user }}"
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - ai_library_share_pdbedit_result.rc != 0 or ai_library_share_password_generated is not skipped
