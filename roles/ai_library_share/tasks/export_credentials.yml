---
# Export the ailib password to the client play (§12.17.3, like §12.15.7's agent token). The playbook
# includes this after tasks_from: server, on the gaming PC:
#   - ansible.builtin.include_role: {name: ai_library_share, tasks_from: export_credentials}
# It sets the host fact `ai_library_share_password`; the client play passes
# hostvars[<this host>].ai_library_share_password to tasks_from: client as
# ai_library_share_client_password. Every task that holds the value is no_log, and the slurped bytes
# are dropped as soon as the fact is set. In check mode before the first real run the file doesn't
# exist yet: the fact is then "" and the client keeps (or, in check mode only, skips) its file.
- name: Export credentials | is there a password file
  ansible.builtin.stat:
    path: "{{ ai_library_share_password_file }}"
    follow: false
    get_checksum: false
  register: ai_library_share_export_stat

- name: Export credentials | the password file exists (tasks_from server creates it)
  ansible.builtin.assert:
    that:
      - ai_library_share_export_stat.stat.isreg | default(false) or ansible_check_mode
    fail_msg: "{{ ai_library_share_password_file }} is missing or not a regular file; run tasks_from: server first."
    quiet: true

- name: Export credentials | read it
  ansible.builtin.slurp:
    src: "{{ ai_library_share_password_file }}"
  register: ai_library_share_export_slurp
  no_log: true
  when: ai_library_share_export_stat.stat.isreg | default(false)

- name: Export credentials | set the fact
  ansible.builtin.set_fact:
    ai_library_share_password: >-
      {{ (ai_library_share_export_slurp.content | b64decode | trim) if ai_library_share_export_slurp is not skipped else '' }}
    ai_library_share_export_slurp: {}
  no_log: true

# The client writes it into a key=value credentials file: one line, no separators, 32+ characters.
# no_log: a failure must not print the value.
- name: Export credentials | the password is well-formed
  ansible.builtin.assert:
    that:
      - ai_library_share_password is match('^[A-Za-z0-9]{32,}$')
    quiet: true
  no_log: true
  when: ai_library_share_password | length > 0 or not ansible_check_mode
