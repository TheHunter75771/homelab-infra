---
# §12.17.3: /etc/ai-library/credentials (root 0600, no_log), from the server play's exported fact.
# Kept as it is when no password was exported this run (preflight checked it exists then).
- name: Credentials | root-only directory
  ansible.builtin.file:
    path: "{{ ai_library_share_client_dir }}"
    state: directory
    owner: "{{ ai_library_share_secret_owner }}"
    group: "{{ ai_library_share_secret_owner }}"
    mode: "0700"

- name: Credentials | mount.cifs credentials file (root 0600)
  ansible.builtin.copy:
    dest: "{{ ai_library_share_credentials_file }}"
    content: |
      username={{ ai_library_share_user }}
      password={{ ai_library_share_client_password }}
    owner: "{{ ai_library_share_secret_owner }}"
    group: "{{ ai_library_share_secret_owner }}"
    mode: "0600"
    follow: false
  diff: false
  no_log: true
  when: ai_library_share_password_given | bool
  notify: Remount ai-library

- name: Credentials | owner and mode of a kept file (never the content)
  ansible.builtin.file:
    path: "{{ ai_library_share_credentials_file }}"
    state: file
    follow: false
    owner: "{{ ai_library_share_secret_owner }}"
    group: "{{ ai_library_share_secret_owner }}"
    mode: "0600"
  when: not ai_library_share_password_given | bool and ai_library_share_credentials_stat.stat.exists
