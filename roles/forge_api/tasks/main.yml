---
# Role forge_api (docs/CONTRACTS.md §12.25, module H8). Run after roles searxng and research_gate
# (playbooks/research.yml) and after the AI stack (open-webui's pinned address and the `ai` bridge).
# Order: inputs (switched on: the approver and the library mount) -> Python + account -> code -> token (once) ->
# config -> unit -> enabled+started, or stopped+disabled -> read-only verify (switched on only).

- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Python and account
  ansible.builtin.import_tasks: base.yml

- name: Code (forge_api, forge, library)
  ansible.builtin.import_tasks: install.yml

- name: Token (generated once, never logged)
  ansible.builtin.import_tasks: token.yml

- name: Config
  ansible.builtin.import_tasks: config.yml

- name: Unit, and the switch
  ansible.builtin.import_tasks: service.yml

- name: Read-only verify after start
  ansible.builtin.include_tasks: verify.yml
  when:
    - forge_api_enabled | bool
    - not ansible_check_mode
