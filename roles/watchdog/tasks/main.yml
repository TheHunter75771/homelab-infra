---
# The driver can refuse to load (for example when the BIOS locks the TCO "no reboot" bit).
# That isn't an error here: the device check below decides what gets enabled.
- name: Hardware watchdog driver is loaded now
  community.general.modprobe:
    name: "{{ watchdog_module }}"
    state: present
  register: watchdog_modprobe
  failed_when: false

# Returns at once when nothing is queued.
- name: Let udev finish with any new device
  ansible.builtin.command: udevadm settle --timeout=10
  changed_when: false
  check_mode: false

- name: Look for the watchdog device
  ansible.builtin.stat:
    path: "{{ watchdog_device }}"
  register: watchdog_dev

- name: Note whether a hardware watchdog is available
  ansible.builtin.set_fact:
    watchdog_available: "{{ watchdog_dev.stat.exists }}"

- name: Say why systemd's watchdog stays off
  ansible.builtin.debug:
    msg: >-
      No {{ watchdog_device }} after loading {{ watchdog_module }}
      ({{ watchdog_modprobe.msg | default('driver loaded, no device') | trim }}). systemd's watchdog stays off.
  when: not watchdog_available

- name: Watchdog driver loader unit is installed
  ansible.builtin.template:
    src: homelab-watchdog-load.service.j2
    dest: /etc/systemd/system/homelab-watchdog-load.service
    owner: root
    group: root
    mode: "0644"
  register: watchdog_loader_unit
  when: watchdog_available

- name: Watchdog driver loads on every boot
  ansible.builtin.systemd_service:
    name: homelab-watchdog-load.service
    enabled: true
    state: started
    daemon_reload: "{{ watchdog_loader_unit is changed }}"
  when: watchdog_available

- name: Systemd manager drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Systemd uses the hardware watchdog (only when the device exists)
  ansible.builtin.template:
    src: watchdog-homelab.conf.j2
    dest: /etc/systemd/system.conf.d/10-homelab-watchdog.conf
    owner: root
    group: root
    mode: "0644"
  when: watchdog_available
  notify: Re-execute systemd

- name: Systemd watchdog setting is absent when there's no device
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d/10-homelab-watchdog.conf
    state: absent
  when: not watchdog_available
  notify: Re-execute systemd

# Crash recovery, independent of the hardware watchdog (it lives here because it replaces the
# hardware reset this role was meant to provide; base keeps only generic settings).
- name: The kernel reboots itself after a panic or a hard lockup
  ansible.builtin.template:
    src: sysctl-homelab-panic.conf.j2
    dest: "{{ watchdog_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply panic sysctls (watchdog)

- name: Earlier names of the panic sysctl file are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ watchdog_sysctl_stale_files }}"

- name: Kdump is removed (its postrm also regenerates GRUB)
  ansible.builtin.apt:
    name: "{{ watchdog_kdump_packages }}"
    state: absent
    purge: true
  notify:
    - Regenerate GRUB config (watchdog)
    - Flag a reboot to free the crashkernel memory (watchdog)

- name: The crashkernel= reservation is gone from GRUB's defaults
  ansible.builtin.file:
    path: "{{ watchdog_kdump_grub_cfg }}"
    state: absent
  notify:
    - Regenerate GRUB config (watchdog)
    - Flag a reboot to free the crashkernel memory (watchdog)

- name: APT never installs kdump again
  ansible.builtin.template:
    src: apt-no-kdump.pref.j2
    dest: /etc/apt/preferences.d/homelab-no-kdump.pref
    owner: root
    group: root
    mode: "0644"

- name: Apply the systemd, sysctl and GRUB changes before checking them
  ansible.builtin.meta: flush_handlers

- name: Read PID 1's runtime watchdog setting
  ansible.builtin.command: >-
    busctl get-property org.freedesktop.systemd1 /org/freedesktop/systemd1
    org.freedesktop.systemd1.Manager RuntimeWatchdogUSec
  register: watchdog_pid1
  changed_when: false
  check_mode: false
  when: watchdog_available

- name: Read whether the watchdog device is armed
  ansible.builtin.slurp:
    src: "/sys/class/watchdog/{{ watchdog_device | basename }}/state"
  register: watchdog_state
  failed_when: false
  when: watchdog_available

# busctl prints "t <microseconds>"; anything but 0 means PID 1 runs the watchdog. The sysfs
# state (when the kernel exposes it) says whether the hardware timer is actually armed.
- name: Systemd is driving the hardware watchdog
  ansible.builtin.assert:
    that:
      - watchdog_pid1.stdout.split() | last | int > 0
      - watchdog_state.content is not defined or (watchdog_state.content | b64decode | trim) == 'active'
    fail_msg: >-
      PID 1 reports RuntimeWatchdogUSec={{ watchdog_pid1.stdout }}, device state
      {{ (watchdog_state.content | default('') | b64decode | trim) or 'unknown' }}, after the drop-in was applied.
    quiet: true
  when: watchdog_available

- name: Read the live panic settings
  ansible.builtin.slurp:
    src: "/proc/sys/kernel/{{ item }}"
  loop:
    - panic
    - panic_on_oops
    - hardlockup_panic
  register: watchdog_panic_live

- name: Panic, oops and hard-lockup settings are live
  ansible.builtin.assert:
    that:
      - watchdog_live['panic'] == watchdog_panic_reboot_sec | string
      - watchdog_live['panic_on_oops'] == '1'
      - watchdog_live['hardlockup_panic'] == '1'
    fail_msg: "Live kernel settings: {{ watchdog_live }}"
    quiet: true
  vars:
    watchdog_live: >-
      {{ dict(watchdog_panic_live.results | map(attribute='item')
         | zip(watchdog_panic_live.results | map(attribute='content') | map('b64decode') | map('trim'))) }}

# Live values prove nothing about the next boot: a later-sorting vendor file would undo them.
- name: Read the merged sysctl configuration that systemd applies at boot
  ansible.builtin.command: /usr/lib/systemd/systemd-sysctl --cat-config --no-pager
  register: watchdog_sysctl_merged
  changed_when: false
  check_mode: false

- name: The panic settings win at boot, under the current file name only
  ansible.builtin.assert:
    that:
      - watchdog_sysctl_problems | length == 0
      - watchdog_sysctl_stale_files | map('regex_replace', '^', '# ') | select('in', watchdog_sysctl_merged.stdout_lines) | list | length == 0
    fail_msg: >-
      At the next boot these settings would not take effect: {{ watchdog_sysctl_problems }}.
      Stale file names still present: {{ watchdog_sysctl_stale_files | map('regex_replace', '^', '# ')
      | select('in', watchdog_sysctl_merged.stdout_lines) | list }}.
      A later-sorting vendor file now overrides ours; rename ours to sort after it, or drop that key.
    quiet: true
  vars:
    watchdog_sysctl_problems: "{{ watchdog_sysctl_merged.stdout | homelab_sysctl_overrides(watchdog_sysctl_file) }}"

- name: Look for the generated GRUB config
  ansible.builtin.stat:
    path: /boot/grub/grub.cfg
  register: watchdog_grub_cfg

- name: Read the generated GRUB config
  ansible.builtin.slurp:
    src: /boot/grub/grub.cfg
  register: watchdog_grub
  when: watchdog_grub_cfg.stat.exists

- name: The next boot reserves no crashkernel memory
  ansible.builtin.assert:
    that:
      - "'crashkernel=' not in (watchdog_grub.content | b64decode)"
    fail_msg: /boot/grub/grub.cfg still passes crashkernel=; check /etc/default/grub and grub.d, then run update-grub.
    quiet: true
  when: watchdog_grub_cfg.stat.exists

- name: Read how much memory the running kernel holds for a crash kernel
  ansible.builtin.slurp:
    src: /sys/kernel/kexec_crash_size
  register: watchdog_crash_size
  failed_when: false

# Not a change: shown on every run until the box has rebooted without crashkernel=.
- name: Say that a reboot is needed to free the crashkernel memory
  ansible.builtin.debug:
    msg: >-
      REBOOT NEEDED (not done by Ansible): the running kernel still reserves
      {{ ((watchdog_crash_size.content | b64decode | trim | int) / 1048576) | int }} MiB for kdump's crash kernel.
      kdump is removed and the next boot won't reserve it.
  when: (watchdog_crash_size.content | default('MA==') | b64decode | trim | int) > 0
