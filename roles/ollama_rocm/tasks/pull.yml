---
# Pull each of ollama_rocm_pull_models (ai_gpu_model when set, then ollama_rocm_extra_models) once,
# through the server on its tailnet address (the server downloads it as the ollama user into
# ollama_rocm_models_dir). Needs tailscaled up, like the service itself.
# tests/test_render.yml runs this against a stub /api/tags server.
# Waits up to 3 min (60 x 3 s): at boot the unit's restart backoff grows to 60 s per attempt.
- name: Ollama answers on its tailnet address
  ansible.builtin.uri:
    url: "http://{{ ollama_rocm_listen }}/api/tags"
    return_content: true
    timeout: 5
  register: ollama_rocm_tags
  retries: 60
  delay: 3
  until: ollama_rocm_tags.status == 200

# /api/tags lists names in their shortest form (ollama_rocm_pull_listed); compared in lower case.
- name: Pull each model that isn't present
  ansible.builtin.include_tasks: pull_model.yml
  loop: "{{ ollama_rocm_pull_models | zip(ollama_rocm_pull_listed) | list }}"
  loop_control:
    loop_var: ollama_rocm_pull_item
    label: "{{ ollama_rocm_pull_item.0 }}"
  when: ollama_rocm_pull_item.1 not in ollama_rocm_models_present
  vars:
    ollama_rocm_pull_name: "{{ ollama_rocm_pull_item.0 }}"
    ollama_rocm_models_present: >-
      {{ (ollama_rocm_tags.content | from_json).models | default([]) | map(attribute='name') | map('lower') | list }}
