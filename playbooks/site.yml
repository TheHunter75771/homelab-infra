---
# Full converge of the media server. Order matters: see docs/CONTRACTS.md §9.
- name: Converge media servers
  hosts: media_servers
  become: true
  roles:
    - role: base
    - role: users
    - role: ssh_hardening
    - role: tailscale
    - role: dns
    - role: watchdog
    - role: storage
    # firewall before docker: the docker role restarts containers with DNS pointed at the host
    # stub (§9d), which needs the UFW allow in place first (review L1).
    - role: firewall
    - role: docker
    - role: bootgate
    - role: notifier
    - role: stacks
    - role: tailscale_serve
    - role: backups
