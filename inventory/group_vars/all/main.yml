---
# Public-safe defaults. Identifiers live in inventory/host_vars (git-ignored); secrets in vault.yml.
homelab_root: /srv/homelab
homelab_stacks_dir: "{{ homelab_root }}/stacks"
homelab_data_dir: "{{ homelab_root }}/data"
homelab_backups_dir: "{{ homelab_root }}/backups"
homelab_push_dir: "{{ homelab_root }}/push"
homelab_incomplete_dir: "{{ homelab_root }}/downloads-incomplete"
media_mount: /media
admin_user: mediaadmin
automation_user: ansible
backup_pull_user: backuppull
mediasvc_user: mediasvc
mediasvc_uid: 1001
mediasvc_gid: 1001
media_group: media
media_gid: 1002
timezone: America/New_York
# Default docker0 gateway; resolved also listens here so containers get encrypted DNS (CONTRACTS §9d).
docker_dns_ip: 172.17.0.1
docker_dns_bip: 172.17.0.1/16
# AI models (Noah, 2026-10-26; see the LocalAI MODELS.md benchmark): the GPU model runs on the gaming PC (role
# ollama_rocm), the CPU fallback on ai-box (role ai_stack). The broker serves both under the alias "assistant".
# 2026-10-28 (Noah): switched to qwen3.5:35b after a local model test (best on the private document eval; results kept
# outside this repo). It fills the 16 GB card and keeps about 12 GB of weights in PC RAM.
ai_gpu_model: "qwen3.5:35b"
ai_cpu_model: "qwen3.5:4b"
# 2026-10-29 (§12.30, Reviewer Q7-1): ONE context size for the GPU model. qwen3.5:35b fits once, and Ollama reloads it
# (about 25 s) on any num_ctx change. Read by the PC's Ollama default (OLLAMA_CONTEXT_LENGTH) and the broker's gpu_num_ctx.
ai_gpu_num_ctx: 32768
# Document-search embedding model (Noah 2026-10-27, CONTRACTS §12.22): alias "embed" on both backends; the gaming PC
# pulls it via ollama_rocm_extra_models (asserted to match).
ai_embed_model: "nomic-embed-text:v1.5"
# AI operator accounts (docs/CONTRACTS.md §12.13): claude = Claude (full logged sudo); localai = Noah's local AI.
operator_user: claude
