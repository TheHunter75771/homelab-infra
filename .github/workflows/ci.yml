---
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install -r requirements-tools.txt
      - name: Collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Public inventory stand-in
        run: |
          cp inventory/hosts.example.yml inventory/hosts.yml
          printf 'dummy\n' > /tmp/vault-pass
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault-pass
        run: ansible-lint
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --no-banner
  dashboard-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard/server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm test
      - name: Time-travel (suite at +40 d and +220 d)
        run: npm run test:time-travel

  dashboard-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Server deps (the dump drift test runs the server's code)
        run: npm ci
        working-directory: apps/dashboard/server
      - run: npm ci
      - run: npm test
  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - name: tofu fmt
        run: tofu fmt -check -recursive terraform/
      - name: tofu validate (cloudflare)
        working-directory: terraform/cloudflare
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
      - name: plan guard tests
        run: bash terraform/cloudflare/tests/test_plan_guard.sh

  role-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3 rsync shellcheck
          pip install pyyaml jinja2==3.1.6  # jinja2: the dashboard helper's drift test renders the real template
          PIN=$(python3 -c 'import yaml;v=yaml.safe_load(open("inventory/group_vars/all/versions.yml"));print(v["python_packages"]["pywebpush"])')
          pip install "pywebpush==$PIN"
      - name: shellcheck
        run: shellcheck roles/*/files/*.sh roles/*/tests/*.sh terraform/cloudflare/*.sh terraform/cloudflare/tests/*.sh
      - name: backups
        run: bash roles/backups/tests/test_backup.sh
      - name: backup pull
        run: bash roles/backup_pull/tests/test_pull.sh
      - name: heartbeat
        run: python3 -m unittest discover -s roles/heartbeat/tests -v
      - name: bootgate
        run: python3 -m unittest discover -s roles/bootgate/files/tests -v
      - name: notifier
        run: python3 -m unittest discover -s roles/notifier/files/tests -v
      - name: wol-relay
        run: node --test roles/stacks/tests/wol_relay.test.js
      - name: dashboard desktop app
        run: python3 -m unittest discover -s roles/dashboard_desktop/tests -v
      - name: dashboard helper
        run: python3 -m unittest discover -s roles/dashboard/files/homelab-dockerctl/tests -v
      - name: storage format guard
        run: |
          pip install -r requirements-tools.txt
          ansible-galaxy collection install -r requirements.yml -p ./collections
          printf 'dummy\n' > /tmp/vault-pass
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/storage/tests/test_format_guard.yml
      - name: base sysctl filter
        run: python3 -m unittest discover -s roles/base/tests -v
      - name: base sysctl files
        run: |
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ANSIBLE_FILTER_PLUGINS=$PWD/roles/base/filter_plugins \
            ansible-playbook -i localhost, -c local roles/base/tests/test_sysctl_files.yml
      - name: base sudo switch (stubbed)
        run: |
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/base/tests/test_sudo_switch.yml
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook --check -i localhost, -c local roles/base/tests/test_sudo_switch.yml
      - name: base sudo behavioural probe
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/base/tests/test_sudo_probe.yml
      - name: base sudo alternative decision
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/base/tests/test_sudo_decide.yml
      - name: base chrony selectdata (clock-deadlock check)
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/base/tests/test_chrony_selectdata.yml
      - name: base sysctl live drift repair
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/base/tests/test_sysctl_live.yml
      - name: base sysctl live drift repair (check mode)
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook --check -i localhost, -c local roles/base/tests/test_sysctl_live_check.yml
      - name: ufw sysctl agrees with base (log_martians)
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/firewall/tests/test_ufw_sysctl.yml
      - name: ollama_rocm install + render
        run: |
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/ollama_rocm/tests/test_install.yml
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/ollama_rocm/tests/test_render.yml
      - name: gpu_gate deploy
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/gpu_gate/tests/test_gpu_gate.yml
      - name: ai_stack render
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/ai_stack/tests/test_render.yml
      - name: operator_account render
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/operator_account/tests/test_render.yml
      - name: docker apt key and pin filters
        run: python3 -m unittest discover -s roles/docker/tests -v
      - name: firewall declared rules
        run: python3 -m unittest discover -s roles/firewall/tests -v
      - name: skill-library
        run: python3 -m unittest discover -s apps/skill-library/tests -t apps/skill-library -v
      - name: gpu-gate
        run: python3 -m unittest discover -s apps/gpu-gate/tests -t apps/gpu-gate -v
      - name: finance-tools (Money Hub read-only Open WebUI tool)
        # pydantic + langchain-core let the two Open WebUI spec tests run instead of skipping
        run: |
          pip install pydantic==2.14.1 langchain-core==1.7.0
          python3 -m unittest discover -s apps/finance-tools/tests -t apps/finance-tools -v
      - name: jellyfin network preset
        run: python3 -m unittest discover -s roles/stacks/tests -v
      - name: tailscale serve config
        run: ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass ansible-playbook -i localhost, -c local roles/tailscale_serve/tests/test_serve_config.yml

  gpu-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Locked deps (hashes, wheels only)
        run: "pip install --require-hashes --only-binary=:all: -r apps/gpu-broker/requirements.lock"
      - name: Tests
        working-directory: apps/gpu-broker
        run: python -m unittest discover -s tests -v
